name: Compositional relay protocol qualification

on:
  push:
    branches:
      - agent/compositional-relay-protocol-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compositional-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile protocol modules
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/model.py \
            ai_hypothesis/population_compute/relay_model.py \
            experiments/population_compute_scaling_v0/diagnose_compositional_relay.py \
            experiments/population_compute_scaling_v0/diagnose_compositional_relay_fixed4.py \
            experiments/population_compute_scaling_v0/diagnose_compositional_relay_reset4.py

      - name: Run protocol structural regressions
        run: |
          python -m unittest \
            tests/test_shared_population_cell.py \
            tests/test_relay_population_model.py \
            tests/test_compositional_relay_protocol.py

      - name: Run mixed-population relay-2 diagnostic
        shell: bash
        run: |
          mkdir -p diagnostic
          set +e
          python experiments/population_compute_scaling_v0/diagnose_compositional_relay.py \
            --device cpu \
            --seed 303 \
            --steps 2048 \
            --batch-size 8 \
            --heldout-world-count 512 \
            --output diagnostic/compositional-relay-2.json \
            > diagnostic/mixed-stdout.json \
            2> diagnostic/mixed-stderr.log
          echo $? > diagnostic/mixed-status
          exit 0

      - name: Run fixed-four relay-2 diagnostic
        shell: bash
        run: |
          set +e
          python experiments/population_compute_scaling_v0/diagnose_compositional_relay_fixed4.py \
            --device cpu \
            --seed 404 \
            --steps 2048 \
            --batch-size 32 \
            --heldout-world-count 512 \
            --output diagnostic/compositional-relay-2-fixed4.json \
            > diagnostic/fixed4-stdout.json \
            2> diagnostic/fixed4-stderr.log
          echo $? > diagnostic/fixed4-status
          exit 0

      - name: Run fixed-four state-reset relay-2 diagnostic
        shell: bash
        run: |
          set +e
          python experiments/population_compute_scaling_v0/diagnose_compositional_relay_reset4.py \
            --device cpu \
            --seed 505 \
            --steps 2048 \
            --batch-size 32 \
            --heldout-world-count 512 \
            --output diagnostic/compositional-relay-2-reset4.json \
            > diagnostic/reset4-stdout.json \
            2> diagnostic/reset4-stderr.log
          echo $? > diagnostic/reset4-status
          exit 0

      - name: Upload relay-2 diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compositional-relay-2-diagnostic
          path: diagnostic/
          if-no-files-found: error

      - name: Enforce diagnostic execution
        shell: bash
        run: |
          failed=0
          for status_file in diagnostic/*-status; do
            status="$(cat "$status_file")"
            if [ "$status" -ne 0 ]; then
              echo "Diagnostic failed: $status_file (exit $status)"
              failed=1
            fi
          done
          exit "$failed"
