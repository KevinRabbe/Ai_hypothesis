name: Compositional relay protocol qualification

on:
  push:
    branches:
      - agent/compositional-relay-protocol-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compositional-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile protocol modules
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/model.py \
            ai_hypothesis/population_compute/relay_model.py \
            experiments/population_compute_scaling_v0/diagnose_compositional_relay.py

      - name: Run protocol structural regressions
        run: |
          python -m unittest \
            tests/test_shared_population_cell.py \
            tests/test_relay_population_model.py \
            tests/test_compositional_relay_protocol.py \
            tests/test_population_state_reset_policy.py

      - name: Run product mixed-population relay-2 diagnostic
        shell: bash
        run: |
          mkdir -p diagnostic
          set +e
          python experiments/population_compute_scaling_v0/diagnose_compositional_relay.py \
            --device cpu \
            --seed 303 \
            --steps 2048 \
            --batch-size 8 \
            --heldout-world-count 512 \
            --output diagnostic/product-relay-2.json \
            > diagnostic/stdout.json \
            2> diagnostic/stderr.log
          echo $? > diagnostic/status
          exit 0

      - name: Upload product relay-2 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compositional-relay-2-diagnostic
          path: diagnostic/
          if-no-files-found: error

      - name: Enforce diagnostic execution
        shell: bash
        run: |
          status="$(cat diagnostic/status)"
          if [ "$status" -ne 0 ]; then
            echo "Product relay-2 diagnostic failed with exit $status"
            exit "$status"
          fi
