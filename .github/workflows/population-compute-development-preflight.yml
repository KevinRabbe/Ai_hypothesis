name: Population-compute development preflight

on:
  push:
    branches:
      - agent/population-compute-development-preflight-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Run non-gating relay trainability preflight
        run: |
          python -m ai_hypothesis.population_compute.run_relay_scaling \
            --training-seed 0 \
            --device cpu \
            --steps 300 \
            --train-batch-size 32 \
            --evaluation-world-count 120 \
            --evaluation-batch-size 32 \
            --state-width 64 \
            --message-width 24 \
            --output-dir results/population_compute_development_preflight_v0

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-compute-development-preflight
          path: results/population_compute_development_preflight_v0
          if-no-files-found: error
