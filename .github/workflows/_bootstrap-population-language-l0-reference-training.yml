name: Bootstrap Population Language L0 reference training

on:
  push:
    branches:
      - agent/population-language-l0-reference-training-v0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact six-file slice
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/population-language-l0-reference-training/chunk-00 \
            .bootstrap/population-language-l0-reference-training/chunk-01 \
            .bootstrap/population-language-l0-reference-training/chunk-02 \
            .bootstrap/population-language-l0-reference-training/chunk-03 \
            .bootstrap/population-language-l0-reference-training/chunk-rest \
            > /tmp/reference-training-payload.b64
          echo "35ada6c412e77202c5ff27a6a528f773ffd433e47460fbae5822c6a874a2be06  /tmp/reference-training-payload.b64" | sha256sum --check
          base64 --decode /tmp/reference-training-payload.b64 > /tmp/reference-training-payload.tgz
          echo "07190f86f34b7318d2aa092a9ee32f5f7ad10cb5ed8d04fe9fe743b5d117fdd1  /tmp/reference-training-payload.tgz" | sha256sum --check
          mkdir -p /tmp/reference-training-payload
          tar -xzf /tmp/reference-training-payload.tgz -C /tmp/reference-training-payload
          mkdir -p ai_hypothesis/population_language experiments/population_language_l0 scripts tests
          mv /tmp/reference-training-payload/l0_reference_training.py ai_hypothesis/population_language/l0_reference_training.py
          mv /tmp/reference-training-payload/reference_training_v0.md experiments/population_language_l0/reference_training_v0.md
          mv /tmp/reference-training-payload/test_population_language_l0_reference_training.py tests/test_population_language_l0_reference_training.py
          mv /tmp/reference-training-payload/run_population_language_l0_reference_training.py scripts/run_population_language_l0_reference_training.py
          mv /tmp/reference-training-payload/run_population_language_l0_reference_training.ps1 scripts/run_population_language_l0_reference_training.ps1
          mv /tmp/reference-training-payload/population-language-l0-reference-training-ci.yml .github/workflows/population-language-l0-reference-training-ci.yml
          git rm -r .bootstrap/population-language-l0-reference-training
          git rm .github/workflows/_bootstrap-population-language-l0-reference-training.yml
          git add \
            ai_hypothesis/population_language/l0_reference_training.py \
            experiments/population_language_l0/reference_training_v0.md \
            scripts/run_population_language_l0_reference_training.py \
            scripts/run_population_language_l0_reference_training.ps1 \
            tests/test_population_language_l0_reference_training.py \
            .github/workflows/population-language-l0-reference-training-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement Population Language L0 reference training"
          git push origin HEAD:${GITHUB_REF_NAME}
# trigger-after-install
