name: Apply compositional relay protocol

on:
  push:
    branches:
      - agent/compositional-relay-protocol-v0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compositional-relay-protocol-v0

      - name: Apply narrow protocol patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'patch target not found in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          model = 'ai_hypothesis/population_compute/model.py'
          replace_once(
              model,
              '''        communication_mode: CommunicationMode,\n        shared_seed: torch.Tensor | None = None,\n    ) -> PopulationForwardOutput:\n''',
              '''        communication_mode: CommunicationMode,\n        shared_seed: torch.Tensor | None = None,\n        message_content: torch.Tensor | None = None,\n    ) -> PopulationForwardOutput:\n''',
          )
          replace_once(
              model,
              '''            seed = shared_seed.to(device=local_inputs.device, dtype=local_inputs.dtype)\n\n        flat_mask = mask.reshape(-1)\n''',
              '''            seed = shared_seed.to(device=local_inputs.device, dtype=local_inputs.dtype)\n\n        if message_content is not None:\n            expected_message_shape = (\n                batch_size,\n                worker_count,\n                self.config.message_width,\n            )\n            if message_content.shape != expected_message_shape:\n                raise ValueError(\n                    "message_content must have shape "\n                    "[batch, workers, message_width]"\n                )\n            message_content = message_content.to(\n                device=local_inputs.device,\n                dtype=local_inputs.dtype,\n            )\n\n        flat_mask = mask.reshape(-1)\n''',
          )
          replace_once(
              model,
              '''        active_local_inputs = flat_local_inputs.index_select(0, active_flat_indices)\n\n        flat_batch_indices = (\n''',
              '''        active_local_inputs = flat_local_inputs.index_select(0, active_flat_indices)\n        active_message_content = None\n        if message_content is not None:\n            flat_message_content = message_content.reshape(\n                batch_size * worker_count,\n                self.config.message_width,\n            )\n            active_message_content = flat_message_content.index_select(\n                0,\n                active_flat_indices,\n            )\n\n        flat_batch_indices = (\n''',
          )
          replace_once(
              model,
              '''            if communication_mode is CommunicationMode.SPARSE_SHARED_V0:\n                gate = torch.sigmoid(self.message_gate(active_states))\n                messages = torch.tanh(self.message_projection(active_states)) * gate\n                message_sum = messages.new_zeros(\n''',
              '''            if communication_mode is CommunicationMode.SPARSE_SHARED_V0:\n                gate = torch.sigmoid(self.message_gate(active_states))\n                if active_message_content is None:\n                    content = torch.tanh(self.message_projection(active_states))\n                else:\n                    content = active_message_content\n                messages = content * gate\n                message_sum = messages.new_zeros(\n''',
          )

          relay = 'ai_hypothesis/population_compute/relay_model.py'
          replace_once(
              relay,
              '''        seed = torch.tanh(self.query_projection(batch.start_bits))\n        return self.cell(\n            batch.local_inputs,\n            batch.active_mask,\n            recurrent_rounds=rounds,\n            communication_mode=communication_mode,\n            shared_seed=seed,\n        )\n''',
              '''        seed = torch.tanh(self.query_projection(batch.start_bits))\n        value_bits = batch.local_inputs[..., NODE_BIT_WIDTH:]\n        message_content = torch.tanh(self.query_projection(value_bits))\n        return self.cell(\n            batch.local_inputs,\n            batch.active_mask,\n            recurrent_rounds=rounds,\n            communication_mode=communication_mode,\n            shared_seed=seed,\n            message_content=message_content,\n        )\n''',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_hypothesis/population_compute/model.py ai_hypothesis/population_compute/relay_model.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Make relay messages compositional [skip ci]"
          git push origin HEAD:agent/compositional-relay-protocol-v0
