name: Gate7 high-scale routing-bandwidth execution qualification

on:
  push:
    branches:
      - agent/gate7-high-scale-routing-bandwidth-execution-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate7_high_scale_routing_bandwidth.py'
      - 'ai_hypothesis/population_compute/run_gate7_high_scale_routing_bandwidth.py'
      - 'ai_hypothesis/population_compute/analyze_gate7_high_scale_routing_bandwidth.py'
      - 'scripts/run_gate7_high_scale_routing_bandwidth.ps1'
      - 'tests/test_gate7_high_scale_routing_bandwidth_execution.py'
      - '.github/workflows/gate7-high-scale-routing-bandwidth-execution-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch for import boundary
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Compile admitted execution and independent audit
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate7_high_scale_routing_bandwidth.py \
            ai_hypothesis/population_compute/run_gate7_high_scale_routing_bandwidth.py \
            ai_hypothesis/population_compute/analyze_gate7_high_scale_routing_bandwidth.py

      - name: Run non-exposure execution-contract regressions
        run: |
          python -m unittest tests/test_gate7_high_scale_routing_bandwidth_execution.py

      - name: Verify exact frozen bindings and sequential protocol
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute import gate7_high_scale_routing_bandwidth as e
          from ai_hypothesis.population_compute import gate7_high_scale_routing_bandwidth_protocol as p
          assert e.GATE7_HIGH_SCALE_EXECUTION_ADMITTED is True
          assert e.GATE7_HIGH_SCALE_ENGINEERING_RESULT_HEAD == '5305475ea1e295c84fadbce3533f13489b10d60d'
          assert e.GATE7_HIGH_SCALE_ENGINEERING_SUMMARY_SHA256 == 'e40823e3e2787151f2a63607aa3d396f18e03428b715b8864af4f549631e2953'
          assert p.GATE7_HIGH_SCALE_POPULATIONS == (1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072)
          assert p.GATE7_HIGH_SCALE_K_LADDER == (16, 32, 64, 128, 256, 512)
          assert p.GATE7_HIGH_SCALE_WORLD_COUNT == 64
          assert p.GATE7_HIGH_SCALE_EVALUATION_BATCH_SIZE == 64
          assert p.GATE7_HIGH_SCALE_BOOTSTRAP_SAMPLES == 2000
          assert p.GATE7_HIGH_SCALE_NONINFERIORITY_MARGIN == 0.05
          PY

      - name: Prove CI never invokes scientific world generation or runner
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('tests/test_gate7_high_scale_routing_bandwidth_execution.py').read_text())
          forbidden = {'generate_gate7_high_scale_world', 'run_gate7_high_scale_routing_bandwidth'}
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              name = node.func.id if isinstance(node.func, ast.Name) else (
                  node.func.attr if isinstance(node.func, ast.Attribute) else None
              )
              assert name not in forbidden, f'CI test invokes forbidden scientific call: {name}'
          PY
          test ! -f experiments/population_compute_scaling_v0/gate7_high_scale_routing_bandwidth_result.md

      - name: Verify independent auditor dependency boundary
        shell: bash
        run: |
          ! grep --line-number 'from .gate7_high_scale_routing_bandwidth import' \
            ai_hypothesis/population_compute/analyze_gate7_high_scale_routing_bandwidth.py
          ! grep --line-number '^import torch' \
            ai_hypothesis/population_compute/analyze_gate7_high_scale_routing_bandwidth.py

  windows-wrapper-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smoke PowerShell wrapper before checkpoints, CUDA or world generation
        shell: pwsh
        env:
          GATE7_HIGH_SCALE_SCIENCE_WRAPPER_SMOKE: '1'
        run: |
          $output = Join-Path $env:RUNNER_TEMP "gate7-high-scale-science-smoke-${{ github.run_id }}"
          .\scripts\run_gate7_high_scale_routing_bandwidth.ps1 `
            -IdleMachineAttested `
            -OutputRoot $output
          if (-not (Test-Path -LiteralPath (Join-Path $output "run-config.json") -PathType Leaf)) {
              throw "Gate-7 high-scale wrapper smoke did not write run-config.json"
          }
          if (Test-Path -LiteralPath (Join-Path $output "science")) {
              throw "Gate-7 high-scale wrapper smoke reached checkpoint/CUDA/scientific execution"
          }
          $config = Get-Content -Raw (Join-Path $output "run-config.json") | ConvertFrom-Json
          if ($config.evaluation_batch_size -ne 64 -or $config.bootstrap_samples -ne 2000) {
              throw "Gate-7 high-scale wrapper smoke changed the frozen sample identity"
          }
          if ($config.confirmation_opened -ne $false) {
              throw "Gate-7 high-scale wrapper smoke opened confirmation"
          }
