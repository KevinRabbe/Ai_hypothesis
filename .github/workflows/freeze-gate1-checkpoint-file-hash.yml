name: Freeze Gate1 checkpoint file hash

on:
  push:
    branches:
      - agent/relay-work-span-frontier-v0

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relay-work-span-frontier-v0
      - name: Require exact checkpoint file SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          audit = Path('ai_hypothesis/population_compute/relay_resource_audit.py')
          text = audit.read_text(encoding='utf-8')
          old = '''CANONICAL_RESOURCE_PARAMETER_FINGERPRINT = "c227ade9006e47bec17a2a3d5aedf6ac95a6a94607b96b9f52ab759905536c12"\nCANONICAL_EXPERIMENT_VERSION = "population-compute-relay-training-v1"\n'''
          new = '''CANONICAL_RESOURCE_PARAMETER_FINGERPRINT = "c227ade9006e47bec17a2a3d5aedf6ac95a6a94607b96b9f52ab759905536c12"\nCANONICAL_RESOURCE_CHECKPOINT_FILE_SHA256 = "0b7c1f2a14fe9d2987819ed53fc0b55c04f3bb00bce356c1023778830a08ad26"\nCANONICAL_EXPERIMENT_VERSION = "population-compute-relay-training-v1"\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('checkpoint file hash constant target not found')

          old_check = '''        _expect_equal(\n            reasons,\n            "checkpoint parameter_fingerprint",\n            checkpoint.get("parameter_fingerprint"),\n            CANONICAL_RESOURCE_PARAMETER_FINGERPRINT,\n        )\n        _expect_equal(\n            reasons,\n            "checkpoint experiment_version",\n'''
          new_check = '''        _expect_equal(\n            reasons,\n            "checkpoint parameter_fingerprint",\n            checkpoint.get("parameter_fingerprint"),\n            CANONICAL_RESOURCE_PARAMETER_FINGERPRINT,\n        )\n        _expect_equal(\n            reasons,\n            "checkpoint file_sha256",\n            checkpoint.get("file_sha256"),\n            CANONICAL_RESOURCE_CHECKPOINT_FILE_SHA256,\n        )\n        _expect_equal(\n            reasons,\n            "checkpoint experiment_version",\n'''
          if old_check in text:
              text = text.replace(old_check, new_check, 1)
          elif new_check not in text:
              raise RuntimeError('checkpoint file hash validation target not found')
          audit.write_text(text, encoding='utf-8')

          protocol = Path('experiments/population_compute_scaling_v0/resource_frontier_protocol_v0.md')
          doc = protocol.read_text(encoding='utf-8')
          old_doc = '''parameter_fingerprint = c227ade9006e47bec17a2a3d5aedf6ac95a6a94607b96b9f52ab759905536c12\nsource = frozen confirmation artifact 8642866100 / run 30239005530 / run/seed_1/model-v1.pt\n'''
          new_doc = '''parameter_fingerprint = c227ade9006e47bec17a2a3d5aedf6ac95a6a94607b96b9f52ab759905536c12\ncheckpoint_file_sha256 = 0b7c1f2a14fe9d2987819ed53fc0b55c04f3bb00bce356c1023778830a08ad26\nsource = frozen confirmation artifact 8642866100 / run 30239005530 / run/seed_1/model-v1.pt\n'''
          if old_doc in doc:
              doc = doc.replace(old_doc, new_doc, 1)
          elif new_doc not in doc:
              raise RuntimeError('protocol file hash target not found')
          protocol.write_text(doc, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_hypothesis/population_compute/relay_resource_audit.py experiments/population_compute_scaling_v0/resource_frontier_protocol_v0.md
          git commit -m "Freeze Gate1 checkpoint file hash [skip ci]"
          git push origin HEAD:agent/relay-work-span-frontier-v0
