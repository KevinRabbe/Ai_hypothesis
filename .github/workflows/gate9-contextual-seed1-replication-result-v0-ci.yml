name: Gate9 contextual seed1 replication result qualification

on:
  pull_request:
    branches:
      - agent/gate9-contextual-seed0-failure-result-v0
    paths:
      - .github/workflows/gate9-contextual-seed1-replication-result-v0-ci.yml
      - experiments/population_compute_scaling_v0/gate9_contextual_seed1_replication_audit_manifest_v0.sha256
      - experiments/population_compute_scaling_v0/gate9_contextual_seed1_replication_result_v0.json
      - experiments/population_compute_scaling_v0/gate9_contextual_seed1_replication_result_v0.md

permissions:
  contents: read

jobs:
  result-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify immutable seed1 replication result
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("experiments/population_compute_scaling_v0")
          result_path = root / "gate9_contextual_seed1_replication_result_v0.json"
          manifest_path = root / "gate9_contextual_seed1_replication_audit_manifest_v0.sha256"
          result_bytes = result_path.read_bytes()
          result = json.loads(result_bytes)

          assert hashlib.sha256(result_bytes).hexdigest() == (
              "aca49f3e340dc8b26f1a4364764ab8f61e237f3dd2379465f2536ed99b86784d"
          )
          assert result["experiment_version"] == (
              "gate9-contextual-seed1-replication-result-v0"
          )
          assert result["scientific_status"] == (
              "G9_CONTEXTUAL_SEED1_REPLICATION_FAILURE_RECORDED"
          )
          assert result["role"] == "preregistered_replication_only"
          assert result["seed"] == 1
          assert result["seed_outcome"] == (
              "G9_CONTEXTUAL_SEED_CHECKPOINT_ADMISSION_FAILED"
          )

          assert result["stack_identity"] == {
              "architecture_head": (
                  "c689cc3f38f6f642916ee1a702d7de7bd0e43b"
              ),
              "audit_contract_head": (
                  "af8dc84cd2884e547b1c40599400bfaf8610ee64"
              ),
              "execution_head": (
                  "bdc1af9bc65b94b01ae3946977686bd90158786f"
              ),
              "seed0_failure_result_head": (
                  "3d9e686d158e9a4534fbe55b52d6ba2080419ba8"
              ),
              "training_protocol_head": (
                  "1228c19cbf85da4ab738c3355c58f946cd6a965c"
              ),
          }

          assert result["training"] == {
              "episodes": 262144,
              "final_loss": 0.6926665306091309,
              "rows": 512,
              "unique_batch_hashes": 512,
              "unique_query_hashes": 496,
          }
          validation = result["validation"]
          assert validation == {
              "bit_accuracy": 0.5006904602050781,
              "exact_accuracy": 0.004364013671875,
              "full_correct": 143,
              "oracle_accuracy": 1.0,
              "oracle_correct": 32768,
              "query_only_accuracy": 0.004364013671875,
              "query_only_correct": 143,
              "rows": 32768,
              "shuffled_accuracy": 0.00396728515625,
              "shuffled_correct": 130,
              "unique_operator_ordinals": 32768,
              "unique_shuffled_operator_ordinals": 32768,
          }
          assert validation["exact_accuracy"] == validation["query_only_accuracy"]
          assert validation["full_correct"] - validation["shuffled_correct"] == 13

          assert result["admission"] == {
              "bit_accuracy_min": 0.999,
              "context_delta_min_strict": 0.5,
              "exact_accuracy_min": 0.995,
              "full_minus_query_only": 0.0,
              "full_minus_shuffled": 0.000396728515625,
              "oracle_accuracy_observed": 1.0,
              "oracle_accuracy_required": 1.0,
              "passes": False,
          }
          assert result["checkpoint"] == {
              "all_finite_float32": True,
              "learned_parameter_count": 19649,
              "sha256": (
                  "7cd592ba9c54f05620e6bf8c41b7e7fea0301e47a89a456a1d19148defe6ab55"
              ),
              "tensor_count": 17,
          }
          assert result["replication_consequence"] == {
              "isolated_seed0_initialization_failure_supported": False,
              "root_cause_diagnosed": False,
              "scientific_test_generation_allowed": False,
              "seed0_already_closed_v0_admission": True,
              "seed1_independently_failed": True,
              "seed2_may_run_for_replication_only": True,
          }
          assert result["independent_audit"] == {
              "checkpoint_loaded_weights_only": True,
              "checkpoint_schema_verified": True,
              "git_head_verified": True,
              "git_status_manifest_binds_canonical_empty_bytes": True,
              "manifest_paths_sorted_and_unique": True,
              "manifest_sha256_verified": True,
              "run_config_verified": True,
              "source_artifact_modified": False,
              "summary_evidence_reconciled": True,
              "training_ledger_reconstructed": True,
              "uploaded_artifact_hashes_match_manifest": True,
              "validation_ledger_reconstructed": True,
          }

          boundaries = result["closed_boundaries"]
          assert boundaries["final_result_record_only"] is True
          for key, value in boundaries.items():
              if key != "final_result_record_only":
                  assert value is False, (key, value)

          expected_hashes = {
              "git-head.txt": (
                  "3194e14bb0768613035b4fdd9e6e80590bf9e03c63cbc565ac34639556d5a556"
              ),
              "git-status.txt": (
                  "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
              ),
              "manifest.sha256": (
                  "101cac0769b54200713b9c978fecf0eb3d87d420f50194f20d959c90386d9296"
              ),
              "run-config.json": (
                  "7f628a787664cb7ec62eeb363b9ce96976df0f6bd8de503270220051ce001a17"
              ),
              "seed-1/selected-checkpoint.pt": (
                  "7cd592ba9c54f05620e6bf8c41b7e7fea0301e47a89a456a1d19148defe6ab55"
              ),
              "seed-1/summary.json": (
                  "2ad40ae3dcabcf9f52c8f2cdd9a0a0d3a8babba6dcab9150440b29474108fc28"
              ),
              "seed-1/train-steps.jsonl": (
                  "e9250b9ebb180ccf4004c8bd8e45f9f1455a28a99c1f6118e6876d2fbd964927"
              ),
              "seed-1/validation-per-episode.jsonl": (
                  "0a5c7ae5aca7b0d230ff58b89a10fc866c7058415e01f4c6fd098ce6379dcb1e"
              ),
          }
          assert result["source_artifact_sha256"] == expected_hashes

          manifest = manifest_path.read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == (
              "101cac0769b54200713b9c978fecf0eb3d87d420f50194f20d959c90386d9296"
          )
          assert b"\r" not in manifest
          assert manifest.count(b"\n") == 7
          assert list(manifest.splitlines()) == sorted(manifest.splitlines())
          assert set(manifest.splitlines()) == {
              b"3194e14bb0768613035b4fdd9e6e80590bf9e03c63cbc565ac34639556d5a556  git-head.txt",
              b"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  git-status.txt",
              b"7f628a787664cb7ec62eeb363b9ce96976df0f6bd8de503270220051ce001a17  run-config.json",
              b"7cd592ba9c54f05620e6bf8c41b7e7fea0301e47a89a456a1d19148defe6ab55  seed-1/selected-checkpoint.pt",
              b"2ad40ae3dcabcf9f52c8f2cdd9a0a0d3a8babba6dcab9150440b29474108fc28  seed-1/summary.json",
              b"e9250b9ebb180ccf4004c8bd8e45f9f1455a28a99c1f6118e6876d2fbd964927  seed-1/train-steps.jsonl",
              b"0a5c7ae5aca7b0d230ff58b89a10fc866c7058415e01f4c6fd098ce6379dcb1e  seed-1/validation-per-episode.jsonl",
          }
          PY

      - name: Prove exact result-only slice
        run: |
          git fetch origin "${{ github.base_ref }}"
          mapfile -t changed < <(
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort
          )
          expected=(
            ".github/workflows/gate9-contextual-seed1-replication-result-v0-ci.yml"
            "experiments/population_compute_scaling_v0/gate9_contextual_seed1_replication_audit_manifest_v0.sha256"
            "experiments/population_compute_scaling_v0/gate9_contextual_seed1_replication_result_v0.json"
            "experiments/population_compute_scaling_v0/gate9_contextual_seed1_replication_result_v0.md"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Keep raw and executable boundaries closed
        run: |
          ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" |
            grep -E '\.(py|ps1|pt|bin|safetensors|sqlite3|jsonl)$'
          test ! -e experiments/population_compute_scaling_v0/selected-checkpoint.pt
          test ! -e experiments/population_compute_scaling_v0/train-steps.jsonl
          test ! -e experiments/population_compute_scaling_v0/validation-per-episode.jsonl
