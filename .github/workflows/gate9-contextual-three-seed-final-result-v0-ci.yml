name: Gate9 contextual three-seed final result qualification

on:
  pull_request:
    branches:
      - agent/gate9-contextual-seed2-replication-result-v0
    paths:
      - .github/workflows/gate9-contextual-three-seed-final-result-v0-ci.yml
      - experiments/population_compute_scaling_v0/gate9_contextual_three_seed_final_result_v0.json
      - experiments/population_compute_scaling_v0/gate9_contextual_three_seed_final_result_v0.md

permissions:
  contents: read

jobs:
  final-result-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct final Gate9 result from immutable seed records
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("experiments/population_compute_scaling_v0")
          paths = {
              0: root / "gate9_contextual_seed0_failure_result_v0.json",
              1: root / "gate9_contextual_seed1_replication_result_v0.json",
              2: root / "gate9_contextual_seed2_replication_result_v0.json",
          }
          expected_blobs = {
              0: "b86141981eaedd5ad7f20c3e15a1d68f82a3d821",
              1: "c459d426584731565d2c609b4e74548e24c46372",
              2: "1e5cd44ddd94494d3f234f00a24012e7b24f4f31",
          }
          final_path = root / "gate9_contextual_three_seed_final_result_v0.json"
          assert subprocess.check_output(
              ["git", "hash-object", str(final_path)], text=True
          ).strip() == "2818297e92355a45d2989a80ef412df54151816f"

          seeds = {}
          for seed, path in paths.items():
              assert subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip() == expected_blobs[seed]
              record = json.loads(path.read_text(encoding="utf-8"))
              assert record["seed"] == seed
              assert record["seed_outcome"] == (
                  "G9_CONTEXTUAL_SEED_CHECKPOINT_ADMISSION_FAILED"
              )
              seeds[seed] = record

          final = json.loads(final_path.read_text(encoding="utf-8"))
          assert final["experiment_version"] == (
              "gate9-contextual-three-seed-final-result-v0"
          )
          assert final["scientific_status"] == (
              "G9_CONTEXTUAL_THREE_SEED_FINAL_RESULT_RECORDED"
          )
          assert final["classification"] == "G9_NOVEL_OPERATOR_INDUCTION_FAILED"

          full_correct = sum(
              seeds[seed]["validation"]["full_correct"] for seed in range(3)
          )
          shuffled_correct = sum(
              seeds[seed]["validation"]["shuffled_correct"] for seed in range(3)
          )
          query_correct = sum(
              seeds[seed]["validation"]["query_only_correct"] for seed in range(3)
          )
          oracle_correct = sum(
              seeds[seed]["validation"]["oracle_correct"] for seed in range(3)
          )
          rows = sum(seeds[seed]["validation"]["rows"] for seed in range(3))
          mean_bit = sum(
              seeds[seed]["validation"]["bit_accuracy"] for seed in range(3)
          ) / 3
          mean_loss = sum(
              seeds[seed]["training"]["final_loss"] for seed in range(3)
          ) / 3

          assert final["aggregate_validation"] == {
              "bit_accuracy_mean_across_seeds": mean_bit,
              "final_train_loss_mean_across_seeds": mean_loss,
              "full_accuracy": full_correct / rows,
              "full_correct": full_correct,
              "full_minus_query_only_correct": full_correct - query_correct,
              "full_minus_shuffled_correct": full_correct - shuffled_correct,
              "oracle_accuracy": oracle_correct / rows,
              "oracle_correct": oracle_correct,
              "query_only_accuracy": query_correct / rows,
              "query_only_correct": query_correct,
              "rows": rows,
              "shuffled_accuracy": shuffled_correct / rows,
              "shuffled_correct": shuffled_correct,
          }
          assert full_correct == query_correct == 380
          assert shuffled_correct == 364
          assert oracle_correct == rows == 98_304

          assert final["classification_basis"] == {
              "all_three_ordered_seeds_completed": True,
              "all_three_ordered_seeds_failed_checkpoint_admission": True,
              "all_three_seed_checkpoints_required_for_admission": True,
              "checkpoint_admission_possible": False,
              "local_scientific_tests_required_or_allowed": False,
              "population_scaling_classification_reached": False,
              "scientific_test_generation_allowed": False,
          }
          assert final["interpretation"] == {
              "aggregate_full_equals_query_only": True,
              "aggregate_support_context_advantage_observed": False,
              "gate8_positive_result_invalidated": False,
              "isolated_bad_initialization_explanation_supported": False,
              "public_support_oracle_perfect_all_seeds": True,
              "root_cause_diagnosed": False,
              "scope": "frozen_gate9_v0_architecture_and_training_protocol",
          }

          expected_per_seed = [
              {
                  "bit_accuracy": 0.50048828125,
                  "checkpoint_sha256": "236f04d4c08e494ee51645750842e68bf18e66004fbf461e51a8d827e7eb1368",
                  "exact_accuracy": 0.003326416015625,
                  "final_train_loss": 0.6930734515190125,
                  "full_correct": 109,
                  "query_only_correct": 117,
                  "result_git_blob": expected_blobs[0],
                  "seed": 0,
                  "seed_outcome": "G9_CONTEXTUAL_SEED_CHECKPOINT_ADMISSION_FAILED",
                  "shuffled_correct": 112,
              },
              {
                  "bit_accuracy": 0.5006904602050781,
                  "checkpoint_sha256": "7cd592ba9c54f05620e6bf8c41b7e7fea0301e47a89a456a1d19148defe6ab55",
                  "exact_accuracy": 0.004364013671875,
                  "final_train_loss": 0.6926665306091309,
                  "full_correct": 143,
                  "query_only_correct": 143,
                  "result_git_blob": expected_blobs[1],
                  "seed": 1,
                  "seed_outcome": "G9_CONTEXTUAL_SEED_CHECKPOINT_ADMISSION_FAILED",
                  "shuffled_correct": 130,
              },
              {
                  "bit_accuracy": 0.5026893615722656,
                  "checkpoint_sha256": "edd305fe5d8d55b12379caf055ceebad260eb1bf024f4c2af375bae885b68643",
                  "exact_accuracy": 0.00390625,
                  "final_train_loss": 0.693339467048645,
                  "full_correct": 128,
                  "query_only_correct": 120,
                  "result_git_blob": expected_blobs[2],
                  "seed": 2,
                  "seed_outcome": "G9_CONTEXTUAL_SEED_CHECKPOINT_ADMISSION_FAILED",
                  "shuffled_correct": 122,
              },
          ]
          assert final["per_seed"] == expected_per_seed

          boundaries = final["closed_boundaries"]
          assert boundaries["final_result_record_only"] is True
          for key, value in boundaries.items():
              if key != "final_result_record_only":
                  assert value is False, (key, value)
          PY

      - name: Prove exact final-result-only slice
        run: |
          git fetch origin "${{ github.base_ref }}"
          mapfile -t changed < <(
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort
          )
          expected=(
            ".github/workflows/gate9-contextual-three-seed-final-result-v0-ci.yml"
            "experiments/population_compute_scaling_v0/gate9_contextual_three_seed_final_result_v0.json"
            "experiments/population_compute_scaling_v0/gate9_contextual_three_seed_final_result_v0.md"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Keep all executable and raw-evidence boundaries closed
        run: |
          ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" |
            grep -E '\.(py|ps1|pt|bin|safetensors|sqlite3|jsonl)$'
          test ! -e experiments/population_compute_scaling_v0/selected-checkpoint.pt
          test ! -e experiments/population_compute_scaling_v0/train-steps.jsonl
          test ! -e experiments/population_compute_scaling_v0/validation-per-episode.jsonl
