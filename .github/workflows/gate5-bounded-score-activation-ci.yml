name: Gate5 bounded score activation qualification

on:
  push:
    branches:
      - agent/gate5-bounded-score-activation-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate5_bounded_score_activation.py'
      - 'ai_hypothesis/population_compute/gate5_bounded_score_batch.py'
      - 'ai_hypothesis/population_compute/analyze_gate5_bounded_score_activation.py'
      - 'ai_hypothesis/population_compute/run_gate5_bounded_score_activation.py'
      - 'scripts/run_gate5_bounded_score_activation.ps1'
      - 'tests/test_gate5_bounded_score_activation.py'
      - 'tests/test_gate5_bounded_score_activation_audit.py'
      - 'experiments/population_compute_scaling_v0/gate5_bounded_score_activation_protocol.md'
      - 'experiments/population_compute_scaling_v0/gate5_bounded_score_activation_pre_result_clarification.md'
      - 'experiments/population_compute_scaling_v0/gate4_confirmation_result.md'
      - '.github/workflows/gate5-bounded-score-activation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-score-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Verify confirmed Gate4 base is preserved
        shell: bash
        run: |
          grep -q 'GATE4_CONFIRMED_ADAPTIVE_ACTIVATION_BENEFIT' experiments/population_compute_scaling_v0/gate4_confirmation_result.md
          grep -q 'cda2ba5741d64315fbec338981a8064eacbeb2aeb3849ed5436c26ac2fbabf8f' experiments/population_compute_scaling_v0/gate4_confirmation_result.md

      - name: Compile Gate5 frozen modules
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate5_bounded_score_activation.py \
            ai_hypothesis/population_compute/gate5_bounded_score_batch.py \
            ai_hypothesis/population_compute/analyze_gate5_bounded_score_activation.py \
            ai_hypothesis/population_compute/run_gate5_bounded_score_activation.py

      - name: Run synthetic Gate5 pre-result regressions
        run: |
          python -m unittest \
            tests/test_gate5_bounded_score_activation.py \
            tests/test_gate5_bounded_score_activation_audit.py

      - name: Verify frozen Gate5 constants and work identity
        shell: bash
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute.gate5_bounded_score_activation import (
              GATE5_BOOTSTRAP_SAMPLES,
              GATE5_CHECKPOINT_INDICES,
              GATE5_CONDITIONS,
              GATE5_DEPTH,
              GATE5_EVAL_BATCH_SIZE,
              GATE5_HINT_RELIABILITY,
              GATE5_NONINFERIORITY_MARGIN,
              GATE5_RESERVE_CAPACITY,
              GATE5_SCHEDULED_SLOTS,
              GATE5_STAGE_A_FRONTIER,
              GATE5_STAGE_A_SLOTS,
              GATE5_STAGE_B_SLOTS,
              GATE5_TOTAL_LEARNED_UPDATES,
              GATE5_WORLD_COUNT,
          )
          assert GATE5_CHECKPOINT_INDICES == (0, 1, 2)
          assert GATE5_DEPTH == 8
          assert GATE5_HINT_RELIABILITY == 0.70
          assert GATE5_RESERVE_CAPACITY == 256
          assert GATE5_STAGE_A_SLOTS == 63
          assert GATE5_STAGE_A_FRONTIER == 64
          assert GATE5_STAGE_B_SLOTS == 96
          assert GATE5_SCHEDULED_SLOTS == 159
          assert GATE5_TOTAL_LEARNED_UPDATES == 2544
          assert GATE5_NONINFERIORITY_MARGIN == 0.05
          assert GATE5_WORLD_COUNT == 256
          assert GATE5_EVAL_BATCH_SIZE == 64
          assert GATE5_BOOTSTRAP_SAMPLES == 2000
          assert len(GATE5_CONDITIONS) == 6
          assert 3 * len(GATE5_CONDITIONS) == 18
          PY

      - name: Verify admitted runner uses strict bounded visibility path
        shell: bash
        run: |
          grep -q 'from .gate5_bounded_score_batch import evaluate_gate5_strict_condition' ai_hypothesis/population_compute/run_gate5_bounded_score_activation.py
          ! grep -q 'evaluate_gate5_condition(' ai_hypothesis/population_compute/run_gate5_bounded_score_activation.py
          grep -q 'Full-reserve ranking occurs only after the bounded parent is fixed' ai_hypothesis/population_compute/gate5_bounded_score_batch.py
          grep -q 'only the sampled subset is constructed before parent choice' ai_hypothesis/population_compute/gate5_bounded_score_batch.py

      - name: Verify K16 control clarification is frozen
        shell: bash
        run: |
          grep -q 'FROZEN BEFORE ANY GATE-5 DEVELOPMENT WORLD IS GENERATED OR INSPECTED' experiments/population_compute_scaling_v0/gate5_bounded_score_activation_pre_result_clarification.md
          grep -q 'same deterministic `k16` sampling-group identifier' experiments/population_compute_scaling_v0/gate5_bounded_score_activation_pre_result_clarification.md
          grep -q 'if the incoming live reserves are identical at a slot, the visible candidate subsets are exactly identical' experiments/population_compute_scaling_v0/gate5_bounded_score_activation_pre_result_clarification.md

      - name: Verify frozen Gate5 development namespace remains unexposed in CI
        shell: bash
        run: |
          ! grep -R --line-number 'generate_gate5_development_world' tests/test_gate5_bounded_score_activation.py tests/test_gate5_bounded_score_activation_audit.py
          grep -q 'gate5-bounded-score-activation-development-hidden' ai_hypothesis/population_compute/gate5_bounded_score_activation.py
          grep -q 'gate5-bounded-score-activation-development-hints' ai_hypothesis/population_compute/gate5_bounded_score_activation.py
          grep -q 'gate5-bounded-score-activation-development-runtime' ai_hypothesis/population_compute/gate5_bounded_score_activation.py
          ! grep -q 'gate4-adaptive-activation-confirmation-hidden' ai_hypothesis/population_compute/gate5_bounded_score_activation.py

      - name: Verify admitted CLI exposes no scientific tuning knobs
        shell: bash
        run: |
          python -m ai_hypothesis.population_compute.run_gate5_bounded_score_activation --help > gate5-help.txt
          grep -q -- '--output-root' gate5-help.txt
          grep -q -- '--checkpoint0' gate5-help.txt
          grep -q -- '--checkpoint1' gate5-help.txt
          grep -q -- '--checkpoint2' gate5-help.txt
          ! grep -q -- '--world-count' gate5-help.txt
          ! grep -q -- '--capacity' gate5-help.txt
          ! grep -q -- '--scheduled-slots' gate5-help.txt
          ! grep -q -- '--stage-a' gate5-help.txt
          ! grep -q -- '--stage-b' gate5-help.txt
          ! grep -q -- '--k' gate5-help.txt
          ! grep -q -- '--margin' gate5-help.txt
          ! grep -q -- '--reliability' gate5-help.txt
          ! grep -q -- '--bootstrap' gate5-help.txt
          ! grep -q -- '--training' gate5-help.txt

      - name: Verify Gate5 remains pre-result and confirmation closed
        shell: bash
        run: |
          grep -q 'FROZEN PRE-RESULT PROTOCOL — NO GATE-5 DEVELOPMENT WORLD GENERATED OR INSPECTED' experiments/population_compute_scaling_v0/gate5_bounded_score_activation_protocol.md
          grep -q 'delta_NI = 0.05' experiments/population_compute_scaling_v0/gate5_bounded_score_activation_protocol.md
          grep -q 'G5_B2_ROBUST_BOUNDED_SCORE_ACTIVATION' experiments/population_compute_scaling_v0/gate5_bounded_score_activation_protocol.md
          grep -q 'Gate-5 confirmation is \*\*CLOSED\*\*' experiments/population_compute_scaling_v0/gate5_bounded_score_activation_protocol.md
          ! find experiments/population_compute_scaling_v0 -maxdepth 1 -type f -iname 'gate5*_result.md' | grep -q .

  windows-powershell-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put checkout on admitted Gate5 branch name
        shell: powershell
        run: git switch -C agent/gate5-bounded-score-activation-v0

      - name: Execute Gate5 pre-science wrapper under Windows PowerShell 5.1 StrictMode
        shell: powershell
        env:
          GATE5_WRAPPER_SMOKE: '1'
        run: |
          .\scripts\run_gate5_bounded_score_activation.ps1 `
            -IdleMachineAttested `
            -OutputRoot "$env:RUNNER_TEMP\gate5-bounded-score-smoke"
