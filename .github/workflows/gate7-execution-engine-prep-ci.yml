name: Gate7 execution-engine preparation qualification

on:
  push:
    branches:
      - agent/gate7-high-scale-frontier-prep-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate7_scaling_frontier_prep.py'
      - 'ai_hypothesis/population_compute/gate7_tensor_engine_prep.py'
      - 'tests/test_gate7_scaling_frontier_prep.py'
      - 'tests/test_gate7_tensor_engine_prep.py'
      - 'experiments/population_compute_scaling_v0/gate7_*'
      - '.github/workflows/gate7-execution-engine-prep-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate7-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Compile Gate7 preparation modules
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate7_scaling_frontier_prep.py \
            ai_hypothesis/population_compute/gate7_tensor_engine_prep.py

      - name: Run data-blind Gate7 preparation regressions
        run: |
          python -m unittest \
            tests/test_gate7_scaling_frontier_prep.py \
            tests/test_gate7_tensor_engine_prep.py

      - name: Verify Gate7 remains preparation only
        shell: bash
        run: |
          grep -q 'GATE7_PREPARATION_ONLY = True' ai_hypothesis/population_compute/gate7_scaling_frontier_prep.py
          grep -q 'GATE7_TENSOR_ENGINE_PREPARATION_ONLY = True' ai_hypothesis/population_compute/gate7_tensor_engine_prep.py
          ! grep -R --line-number 'generate_gate7.*world' \
            ai_hypothesis/population_compute/gate7_scaling_frontier_prep.py \
            ai_hypothesis/population_compute/gate7_tensor_engine_prep.py \
            tests/test_gate7_scaling_frontier_prep.py \
            tests/test_gate7_tensor_engine_prep.py
          ! grep -R --line-number 'gate7-.*-hidden' \
            ai_hypothesis/population_compute/gate7_scaling_frontier_prep.py \
            ai_hypothesis/population_compute/gate7_tensor_engine_prep.py

      - name: Verify hot tensor functions contain no CUDA-to-Python scalar extraction
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          from ai_hypothesis.population_compute import gate7_tensor_engine_prep as m
          for fn in (
              m.build_productive_child_inputs,
              m.build_complete_tensor_frontier,
              m.select_bounded_score_indices,
          ):
              source = inspect.getsource(fn)
              for forbidden in ('.item(', '.cpu(', '.tolist(', 'float('):
                  assert forbidden not in source, (fn.__name__, forbidden)
          assert 'sorted(' not in inspect.getsource(m.select_bounded_score_indices)
          PY

      - name: Verify no scientific Gate7 runner exists
        shell: bash
        run: |
          test ! -f ai_hypothesis/population_compute/run_gate7.py
          test ! -f scripts/run_gate7.ps1
          test ! -f experiments/population_compute_scaling_v0/gate7_result.md
