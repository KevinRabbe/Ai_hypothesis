name: Fix fixed-four relay evaluation

on:
  push:
    branches:
      - agent/compositional-relay-protocol-v0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compositional-relay-protocol-v0
      - name: Preserve full heldout cohort contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('experiments/population_compute_scaling_v0/diagnose_compositional_relay_fixed4.py')
          text = path.read_text(encoding='utf-8')
          old_import = '''    RELAY_DIFFICULTIES,\n    generate_relay_world,\n    relay_scope_thresholds,\n'''
          new_import = '''    RELAY_DIFFICULTIES,\n    generate_relay_dataset,\n    generate_relay_world,\n    relay_scope_thresholds,\n'''
          if new_import not in text:
              if old_import not in text:
                  raise RuntimeError('heldout import patch target not found')
              text = text.replace(old_import, new_import, 1)
          old = '''    heldout_worlds = _threshold_worlds(\n        base_seed=HELDOUT_WORLD_SEED_BASE,\n        offset=0,\n        count=args.heldout_world_count,\n        threshold=ACTIVE_WORKERS,\n    )\n'''
          new = '''    heldout_worlds = generate_relay_dataset(\n        start_seed=HELDOUT_WORLD_SEED_BASE,\n        world_count=args.heldout_world_count,\n        difficulty=difficulty,\n    )\n'''
          if new not in text:
              if old not in text:
                  raise RuntimeError('heldout cohort patch target not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/population_compute_scaling_v0/diagnose_compositional_relay_fixed4.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve fixed-four heldout cohort contract [skip ci]"
          git push origin HEAD:agent/compositional-relay-protocol-v0
