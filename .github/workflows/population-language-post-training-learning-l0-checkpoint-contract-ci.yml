name: Population Language Post-Training Learning L0 Checkpoint Contract CI

on:
  pull_request:
    paths:
      - ".github/workflows/population-language-post-training-learning-l0-checkpoint-contract-ci.yml"
      - "ai_hypothesis/population_language/post_training_learning_l0_checkpoint.py"
      - "experiments/population_language_post_training_learning_l0/checkpoint_contract_v0.md"
      - "tests/test_population_language_post_training_learning_l0_checkpoint.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          python -m pip install --disable-pip-version-check \
            torch==2.9.1 \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Compile checkpoint-contract slice
        run: |
          python -m py_compile \
            ai_hypothesis/population_language/post_training_learning_l0_checkpoint.py \
            tests/test_population_language_post_training_learning_l0_checkpoint.py
      - name: Run full Post-Training Learning contract stack
        run: |
          python -m unittest \
            tests.test_population_language_post_training_learning_l0 \
            tests.test_population_language_post_training_learning_l0_adapter \
            tests.test_population_language_post_training_learning_l0_calibration \
            tests.test_population_language_post_training_learning_l0_execution \
            tests.test_population_language_post_training_learning_l0_checkpoint
      - name: Verify locked checkpoint constants
        run: |
          python - <<'PY'
          from ai_hypothesis.population_language import post_training_learning_l0_checkpoint as checkpoint

          report = checkpoint.validate_checkpoint_contract()
          assert report["valid"], report
          assert checkpoint.SOURCE_EXECUTION_PRIMITIVES_HEAD == "821449afe7381d4becc9c43dc456632b66b8f034"
          assert checkpoint.REFERENCE_MODEL_NAME == "population"
          assert checkpoint.REFERENCE_CHECKPOINT_PAYLOAD_KEYS == (
              "version", "model", "seed", "optimizer_step", "state_dict"
          )
          assert checkpoint.REFERENCE_CHECKPOINT_MAX_BYTES == 96 * 1024 * 1024
          assert checkpoint.REFERENCE_RAW_STATE_BYTES == 18_967_968 * 4
          PY
      - name: Verify exact four-file scope
        run: |
          base=821449afe7381d4becc9c43dc456632b66b8f034
          git cat-file -e "$base^{commit}"
          git diff --name-only "$base" HEAD | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/population-language-post-training-learning-l0-checkpoint-contract-ci.yml
          ai_hypothesis/population_language/post_training_learning_l0_checkpoint.py
          experiments/population_language_post_training_learning_l0/checkpoint_contract_v0.md
          tests/test_population_language_post_training_learning_l0_checkpoint.py
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
