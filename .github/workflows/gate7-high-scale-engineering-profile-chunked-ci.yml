name: Gate7 high-scale chunked engineering profile qualification

on:
  push:
    branches:
      - agent/gate7-high-scale-engineering-profile-chunked-v1
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/profile_gate7_high_scale_execution_chunked.py'
      - 'ai_hypothesis/population_compute/gate7_high_scale_frontier_prep.py'
      - 'scripts/profile_gate7_high_scale_execution_chunked.ps1'
      - 'tests/test_profile_gate7_high_scale_execution_chunked.py'
      - '.github/workflows/gate7-high-scale-engineering-profile-chunked-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Compile chunked engineering profiler
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/profile_gate7_high_scale_execution_chunked.py \
            ai_hypothesis/population_compute/gate7_high_scale_frontier_prep.py

      - name: Run chunked-profile regressions
        run: |
          python -m unittest \
            tests/test_profile_gate7_high_scale_execution_chunked.py \
            tests/test_gate7_high_scale_frontier_prep.py

      - name: Verify fixed chunked profile contract
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute import profile_gate7_high_scale_execution_chunked as p
          assert p.GATE7_HIGH_SCALE_CHUNKED_ENGINEERING_PROFILE_ONLY is True
          assert p.GATE7_HIGH_SCALE_CHUNKED_ENGINEERING_PROFILE_VERSION == 'gate7-high-scale-execution-engineering-profile-chunked-v1'
          assert p.GATE7_HIGH_SCALE_FRONTIER_MAX_RECURRENT_ROWS == 1_048_576
          assert p.GATE7_HIGH_SCALE_EVALUATION_BATCH_SIZE == 64
          PY

      - name: Verify no checkpoint or scientific runner is reachable
        shell: bash
        run: |
          ! grep --line-number 'torch.load\|load_verified\|checkpoint_path\|hidden_path =' \
            ai_hypothesis/population_compute/profile_gate7_high_scale_execution_chunked.py
          test ! -f ai_hypothesis/population_compute/gate7_high_scale_routing_bandwidth.py
          test ! -f ai_hypothesis/population_compute/run_gate7_high_scale_routing_bandwidth.py
          test ! -f scripts/run_gate7_high_scale_routing_bandwidth.ps1
          test ! -f experiments/population_compute_scaling_v0/gate7_high_scale_routing_bandwidth_result.md

  windows-wrapper-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smoke chunked PowerShell wrapper before CUDA or profiling
        shell: pwsh
        env:
          GATE7_HIGH_SCALE_CHUNKED_PROFILE_WRAPPER_SMOKE: '1'
        run: |
          $output = Join-Path $env:RUNNER_TEMP "gate7-high-scale-chunked-profile-smoke-${{ github.run_id }}"
          .\scripts\profile_gate7_high_scale_execution_chunked.ps1 `
            -IdleMachineAttested `
            -OutputRoot $output
          $runConfigPath = Join-Path $output "run-config.json"
          if (-not (Test-Path -LiteralPath $runConfigPath -PathType Leaf)) {
              throw "Gate-7 chunked profile smoke did not write run-config.json"
          }
          $runConfig = Get-Content -Raw $runConfigPath | ConvertFrom-Json
          if ($runConfig.frontier_max_recurrent_rows -ne 1048576) {
              throw "Gate-7 chunked profile smoke changed the recurrent-row bound"
          }
          if ($runConfig.physical_world_batch_size -ne 64) {
              throw "Gate-7 chunked profile smoke changed the world batch"
          }
          if (Test-Path -LiteralPath (Join-Path $output "profile")) {
              throw "Gate-7 chunked profile smoke reached CUDA profiling"
          }
