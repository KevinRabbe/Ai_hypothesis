name: Apply exact compositional relay identity

on:
  push:
    branches:
      - agent/compositional-relay-protocol-v0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compositional-relay-protocol-v0
      - name: Remove double tanh from candidate node content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          relay = Path('ai_hypothesis/population_compute/relay_model.py')
          text = relay.read_text(encoding='utf-8')
          old = '        message_content = torch.tanh(self.query_projection(value_bits))\n'
          new = '        message_content = self.query_projection(value_bits)\n'
          if new not in text:
              if old not in text:
                  raise RuntimeError('relay candidate-content patch target not found')
              relay.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_compositional_relay_protocol.py')
          text = test.read_text(encoding='utf-8')
          old = '        expected_content = torch.tanh(model.query_projection(value_bits))\n'
          new = '        expected_content = model.query_projection(value_bits)\n'
          if new not in text:
              if old not in text:
                  raise RuntimeError('relay test expected-content patch target not found')
              text = text.replace(old, new, 1)
          anchor = '''        self.assertTrue(\n            torch.allclose(recorder.message_content, expected_content, atol=1e-7)\n        )\n        self.assertTrue(recorder.reset_state_each_round)\n'''
          replacement = '''        self.assertTrue(\n            torch.allclose(recorder.message_content, expected_content, atol=1e-7)\n        )\n        self.assertTrue(\n            torch.allclose(torch.tanh(expected_content), torch.tanh(model.query_projection(value_bits)), atol=1e-7)\n        )\n        self.assertTrue(recorder.reset_state_each_round)\n'''
          if replacement not in text:
              if anchor not in text:
                  raise RuntimeError('relay exact-identity assertion anchor not found')
              text = text.replace(anchor, replacement, 1)
          test.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_hypothesis/population_compute/relay_model.py tests/test_compositional_relay_protocol.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make relay node messages exactly compositional [skip ci]"
          git push origin HEAD:agent/compositional-relay-protocol-v0
