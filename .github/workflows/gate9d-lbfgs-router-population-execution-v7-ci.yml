name: Gate9D LBFGS router population execution v7 qualification
on:
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate9d_lbfgs_router_population_execution_v7.py'
      - 'scripts/run_gate9d_lbfgs_router_population_execution_v7.py'
      - 'scripts/run_gate9d_lbfgs_router_population_execution_v7.ps1'
      - 'experiments/population_compute_scaling_v0/gate9d_lbfgs_router_population_execution_v7.md'
      - 'tests/test_gate9d_lbfgs_router_population_execution_v7.py'
      - '.github/workflows/gate9d-lbfgs-router-population-execution-v7-ci.yml'
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.9'}
      - run: python -m pip install --disable-pip-version-check torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile ai_hypothesis/population_compute/gate9d_lbfgs_router_population_execution_v7.py scripts/run_gate9d_lbfgs_router_population_execution_v7.py tests/test_gate9d_lbfgs_router_population_execution_v7.py
          python -m unittest tests/test_gate9d_lbfgs_router_population_execution_v7.py -v
      - run: |
          test "$(git diff --name-only ae1dc4c916dbc361748c2205cb177038cf4e47ce...HEAD | wc -l)" -eq 6
          ! git diff --name-only ae1dc4c916dbc361748c2205cb177038cf4e47ce...HEAD | grep -E '\.(pt|pth|bin|zip)$'
