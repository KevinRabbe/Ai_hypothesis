name: Fix indexed consolidation regression

on:
  push:
    branches:
      - agent/indexed-thread-consolidation-control-v0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/indexed-thread-consolidation-control-v0
      - name: Patch forged-route expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_indexed_thread_consolidation_control.py')
          text = path.read_text(encoding='utf-8')
          old = 'with self.assertRaisesRegex(ValueError, "not owned"):\n            self.adapter.context(state, forged)'
          new = 'with self.assertRaisesRegex(RuntimeError, "no longer matches"):\n            self.adapter.context(state, forged)'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise RuntimeError('forged-route regression target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_indexed_thread_consolidation_control.py
          git commit -m "Fix forged consolidation route regression [skip ci]"
          git push origin HEAD:agent/indexed-thread-consolidation-control-v0
