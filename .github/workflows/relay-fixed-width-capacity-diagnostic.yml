name: Relay fixed-width capacity diagnostic

on:
  push:
    branches:
      - agent/relay-fixed-width-capacity-diagnostic-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-width-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile diagnostic
        run: python -m compileall -q experiments/population_compute_scaling_v0/diagnose_fixed_width_capacity.py

      - name: Run fixed-width capacity diagnostic
        shell: bash
        run: |
          mkdir -p diagnostic
          set +e
          python experiments/population_compute_scaling_v0/diagnose_fixed_width_capacity.py \
            --device cpu \
            --steps 2048 \
            --heldout-world-count 512 \
            --output diagnostic/fixed-width-capacity.json \
            > diagnostic/stdout.json \
            2> diagnostic/stderr.log
          echo $? > diagnostic/status
          exit 0

      - name: Upload fixed-width capacity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-fixed-width-capacity-diagnostic
          path: diagnostic/
          if-no-files-found: error

      - name: Enforce diagnostic execution
        shell: bash
        run: |
          status="$(cat diagnostic/status)"
          if [ "$status" -ne 0 ]; then
            echo "Fixed-width capacity diagnostic failed with exit $status"
            exit "$status"
          fi
