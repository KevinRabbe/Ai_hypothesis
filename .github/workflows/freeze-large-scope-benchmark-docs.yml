name: Freeze large-scope benchmark qualification docs

on:
  push:
    branches:
      - agent/large-scope-benchmark-ci-v0

permissions:
  contents: write

jobs:
  freeze-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/large-scope-benchmark-ci-v0
      - name: Record qualified benchmark contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old in text:
                  file.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if new in text:
                  return
              raise RuntimeError(f'expected documentation block missing in {path}')

          benchmark = 'benchmarks/large_scope_relevance_v0.md'
          replace_exact(
              benchmark,
              '**Construction artifact only. Gate 5 (adaptive allocation) is not being declared active by this document. No result is claimed until the frozen Worker v1 checkpoints are executed against the benchmark.**',
              '**Mechanically qualified, empirical Worker-v1 result pending.** The benchmark mechanics, persistent-runtime bridge, shared-base worker control, paired statistics, and CLI artifact path are executable-green on Python 3.11 + CPU Torch. Gate 5 is still not active, and no neural-performance result is claimed until the frozen Worker v1 checkpoints are executed on the development split.'
          )
          replace_exact(
              benchmark,
              '''Choose one checkpoint deterministically for that world and use the same worker weights for every inspected window.\n\n```text\nW inspected windows\n×\none repeated worker checkpoint\n```\n\nThis spends W local neural transformations and measures the effect of inspecting more scope without adding weight diversity.''',
              '''Choose one deterministic base checkpoint for that world and use the same worker weights for every inspected window. The base checkpoint is shared with the `diverse_workers` condition.\n\n```text\nW inspected windows\n×\none repeated base checkpoint\n```\n\nThis spends W local neural transformations and measures the effect of inspecting more scope without adding weight diversity.'''
          )
          replace_exact(
              benchmark,
              '''Assign a distinct independently weighted checkpoint to each inspected window when `W <= population_width`.\n\n```text\nW inspected windows\n×\nW distinct worker checkpoints\n```\n\nThe assignment is deterministic and nested across widths.\n\nThis condition has the same inspected scope and number of local neural transformations as the scope-only control. The intended difference is independently learned weights.''',
              '''Start from the exact same deterministic base checkpoint used by `same_worker`, then assign distinct independently weighted checkpoints to the additional inspected windows when `W <= population_width`.\n\n```text\nfirst inspected window  -> shared base checkpoint\nadditional windows      -> distinct worker checkpoints\n```\n\nThe assignment is deterministic and nested across widths. At width 1 the two worker modes are therefore exactly identical; any nonzero width-1 mode difference is a benchmark/runtime bug.\n\nAt larger widths the two modes have the same inspected scope and number of local neural transformations. The intended difference is only whether additional regions reuse the base weights or use independently learned weights.'''
          )

          paired_section = '''## Paired diversity comparison\n\nThe same-worker and diverse-worker conditions are evaluated on the **same world and exact inspection prefix**, so their primary diversity comparison is paired by `(split, world seed, width)`.\n\nThe result artifact retains the existing per-condition `summaries` and additionally emits bounded streaming `paired_summaries`. Every paired delta is defined as:\n\n```text\ndiverse_workers - same_worker\n```\n\nPaired summaries report:\n\n- retrieval-given-inspection for both modes and the paired rate delta;\n- both-retrieved / same-only / diverse-only / neither-retrieved counts;\n- exact two-sided retrieval-discordance probability from the discordant pairs;\n- mean and standard error of target-rank delta when the target was inspected;\n- mean and standard error of target RELEVANT-evidence delta when inspected;\n- paired strongest-distractor RELEVANT-evidence delta;\n- paired target-minus-distractor evidence-gap delta when inspected;\n- paired positive-world candidate-evidence delta;\n- paired negative-world candidate-evidence delta.\n\nThis preserves the causal control instead of throwing away pairing and comparing only unrelated aggregate means. No raw world dump is required; the accumulator keeps only bounded pending pairs for the current world batch and running moments/counts.\n\nInterpret signs carefully:\n\n- retrieval delta: positive favors diverse workers;\n- target-rank delta: negative favors diverse workers;\n- target-evidence delta: positive favors diverse workers;\n- strongest-distractor delta: negative favors diverse workers;\n- target-minus-distractor gap delta: positive favors diverse workers;\n- negative-world candidate-evidence delta: negative means lower false-positive pressure under diverse workers.\n\nWidth 1 is the exact causal sanity check: because both modes inspect the same window with the same checkpoint, all paired neural-output deltas must be zero apart from impossible numerical-path divergence.\n\n'''
          file = Path(benchmark)
          text = file.read_text(encoding='utf-8')
          marker = '## Key decomposition\n'
          if '## Paired diversity comparison\n' not in text:
              if marker not in text:
                  raise RuntimeError('paired comparison insertion point missing')
              file.write_text(text.replace(marker, paired_section + marker, 1), encoding='utf-8')

          replace_exact(
              benchmark,
              '''- exact number of local neural window evaluations.\n\nIt deliberately does not sum heterogeneous per-attempt resource maps or manufacture a scalar efficiency score.''',
              '''- exact number of local neural window evaluations;\n- per-condition threshold-free summaries;\n- paired same-scope diversity summaries when both worker modes are requested.\n\nIt deliberately does not sum heterogeneous per-attempt resource maps or manufacture a scalar efficiency score.'''
          )

          replace_exact(
              'docs/roadmap.md',
              'Construction note: [`benchmarks/large_scope_relevance_v0.md`](../benchmarks/large_scope_relevance_v0.md) implements the controlled scope-only versus diverse-weight benchmark interface needed to measure this dimension later. Its existence does **not** activate Gate 5, and no empirical result is claimed yet.',
              'Construction note: [`benchmarks/large_scope_relevance_v0.md`](../benchmarks/large_scope_relevance_v0.md) implements and mechanically qualifies the controlled scope-only versus diverse-weight benchmark, including an exact shared-base width-1 control and paired diverse-minus-same statistics. This does **not** activate Gate 5: the frozen Worker-v1 development result is still pending, and no adaptive-allocation result is claimed.'
          )

          replace_exact(
              'README.md',
              '- [`benchmarks/large_scope_relevance_v0.md`](benchmarks/large_scope_relevance_v0.md) — constructed controlled scope benchmark; no Gate 5 result is claimed.',
              '- [`benchmarks/large_scope_relevance_v0.md`](benchmarks/large_scope_relevance_v0.md) — mechanically qualified controlled scope benchmark with paired diversity controls; frozen Worker-v1 empirical result still pending and no Gate 5 result is claimed.'
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/large_scope_relevance_v0.md docs/roadmap.md README.md
          if ! git diff --cached --quiet; then
            git commit -m "Document qualified large-scope benchmark contract [skip ci]"
            git push origin HEAD:agent/large-scope-benchmark-ci-v0
          fi
