name: Gate9 contextual seed artifact audit qualification

on:
  pull_request:
    branches:
      - agent/gate9-contextual-training-execution-v0
    paths:
      - .github/workflows/gate9-contextual-seed-audit-v0-ci.yml
      - ai_hypothesis/population_compute/gate9_contextual_seed_audit.py
      - experiments/population_compute_scaling_v0/gate9_contextual_seed_audit_v0.md
      - scripts/audit_gate9_contextual_training_seed.py
      - tests/test_gate9_contextual_seed_audit.py

permissions:
  contents: read

jobs:
  independent-audit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install exact CPU Torch family
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.9.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Compile auditor runner and regressions
        run: |
          python -m py_compile \
            ai_hypothesis/population_compute/gate9_contextual_seed_audit.py \
            scripts/audit_gate9_contextual_training_seed.py \
            tests/test_gate9_contextual_seed_audit.py

      - name: Run full synthetic failed-seed audit regressions
        run: |
          python -m unittest tests/test_gate9_contextual_seed_audit.py -v

      - name: Verify exact audit bindings and closed boundaries
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys
          import torch

          assert torch.__version__.startswith("2.9.1"), torch.__version__
          path = pathlib.Path(
              "ai_hypothesis/population_compute/"
              "gate9_contextual_seed_audit.py"
          )
          spec = importlib.util.spec_from_file_location("gate9_seed_audit_ci", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          assert module.AUDIT_VERSION == "gate9-contextual-training-seed-audit-v0"
          assert module.EXPECTED_EXECUTION_HEAD == (
              "bdc1af9bc65b94b01ae3946977686bd90158786f"
          )
          assert module.EXPECTED_EXECUTION_BRANCH == (
              "agent/gate9-contextual-training-execution-v0"
          )
          assert module.EXPECTED_TRAINING_PROTOCOL_HEAD == (
              "1228c19cbf85da4ab738c3355c58f946cd6a965c"
          )
          assert module.EXPECTED_ARCHITECTURE_HEAD == (
              "c689cc3f38f6f6f642916ee1a702d7de7bd0e43b"
          )
          assert module.TRAIN_STEPS == 512
          assert module.TRAIN_EPISODES == 262_144
          assert module.VALIDATION_EPISODES == 32_768
          assert module.LEARNED_PARAMETER_COUNT == 19_649
          assert len(module.STATE_TENSOR_SHAPES) == 17
          assert sum(
              1 if not shape else __import__("math").prod(shape)
              for shape in module.STATE_TENSOR_SHAPES.values()
          ) == 19_649
          print({
              "audit_version": module.AUDIT_VERSION,
              "source_execution_head": module.EXPECTED_EXECUTION_HEAD,
              "training_execution_performed": False,
              "scientific_test_generation_performed": False,
          })
          PY

      - name: Prove auditor is independent and read-only
        run: |
          python - <<'PY'
          import pathlib

          source = pathlib.Path(
              "ai_hypothesis/population_compute/"
              "gate9_contextual_seed_audit.py"
          ).read_text(encoding="utf-8")
          for token in (
              "gate9_contextual_training_runtime",
              "gate9_contextual_training_data",
              "gate9_contextual_worker_architecture",
              "gate9_contextual_operator_contract",
              "generate_gate9_test_world",
              "operator_from_counter",
              "torch." + "optim",
              "torch.save(",
          ):
              assert token not in source, token
          assert "weights_only=True" in source
          assert "source_artifact_modified" in source
          PY

      - name: Prove exact five-file audit slice
        run: |
          python - <<'PY'
          import subprocess

          base = "bdc1af9bc65b94b01ae3946977686bd90158786f"
          expected = {
              ".github/workflows/gate9-contextual-seed-audit-v0-ci.yml",
              "ai_hypothesis/population_compute/gate9_contextual_seed_audit.py",
              "experiments/population_compute_scaling_v0/gate9_contextual_seed_audit_v0.md",
              "scripts/audit_gate9_contextual_training_seed.py",
              "tests/test_gate9_contextual_seed_audit.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", base, "HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed == expected, (changed, expected)
          PY
