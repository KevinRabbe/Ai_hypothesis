name: Fix compositional diagnostic evaluator API

on:
  push:
    branches:
      - agent/compositional-relay-protocol-v0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compositional-relay-protocol-v0
      - name: Align diagnostic with current evaluator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('experiments/population_compute_scaling_v0/diagnose_compositional_relay.py')
          text = path.read_text(encoding='utf-8')
          old = '''            metrics = evaluate_relay_condition(\n                model,\n                worlds,\n                training_seed=args.seed,\n                benchmark_seed=6_000,\n                difficulty=difficulty,\n                population_size=population,\n                communication_mode=mode,\n                batch_size=32,\n                expected_parameter_count=parameter_count,\n                expected_fingerprint=fingerprint,\n                device=device,\n            )\n            by_mode[mode.value] = {\n'''
          new = '''            evaluation = evaluate_relay_condition(\n                model,\n                worlds,\n                training_seed=args.seed,\n                benchmark_seed=6_000,\n                active_workers=population,\n                communication_mode=mode,\n                batch_size=32,\n                device=device,\n            )\n            metrics = evaluation.metrics\n            if metrics.learned_parameter_count != parameter_count:\n                raise RuntimeError("diagnostic changed learned parameter count")\n            if metrics.parameter_fingerprint != fingerprint:\n                raise RuntimeError("diagnostic changed parameter fingerprint")\n            by_mode[mode.value] = {\n'''
          if new not in text:
              if old not in text:
                  raise RuntimeError('diagnostic evaluator patch target not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/population_compute_scaling_v0/diagnose_compositional_relay.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align relay diagnostic evaluator API [skip ci]"
          git push origin HEAD:agent/compositional-relay-protocol-v0
