name: Relay v1 canonical development rerun

on:
  push:
    branches:
      - agent/relay-v1-canonical-development-rerun
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-development:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile canonical relay v1
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/relay_protocol_v1.py \
            ai_hypothesis/population_compute/relay_experiment_v1.py \
            ai_hypothesis/population_compute/run_relay_scaling_v1.py

      - name: Run canonical v1 structural regressions
        run: |
          python -m unittest \
            tests/test_population_compute_contract.py \
            tests/test_collective_relay.py \
            tests/test_relay_serial_control.py \
            tests/test_relay_experiment_v1.py \
            tests/test_run_relay_scaling_v1.py

      - name: Run canonical seed-0 development curve
        shell: bash
        run: |
          mkdir -p diagnostic
          set +e
          python -m ai_hypothesis.population_compute.run_relay_scaling_v1 \
            --training-seed 0 \
            --device cpu \
            --steps 2000 \
            --train-batch-size 64 \
            --learning-rate 0.0003 \
            --weight-decay 0.0001 \
            --gradient-clip-norm 1.0 \
            --gate-supervision-weight 1.0 \
            --state-width 64 \
            --message-width 24 \
            --evaluation-world-count 1000 \
            --evaluation-batch-size 64 \
            --evaluation-split development \
            --output-dir diagnostic/run \
            > diagnostic/stdout.json \
            2> diagnostic/stderr.log
          echo $? > diagnostic/status
          exit 0

      - name: Upload canonical development rerun
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-v1-canonical-development-rerun
          path: diagnostic/
          if-no-files-found: error

      - name: Enforce canonical development execution
        shell: bash
        run: |
          status="$(cat diagnostic/status)"
          if [ "$status" -ne 0 ]; then
            echo "Canonical relay-v1 development rerun failed with exit $status"
            cat diagnostic/stderr.log
            exit "$status"
          fi
