name: Fix large-scope worker control

on:
  push:
    branches:
      - agent/large-scope-benchmark-ci-v0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/large-scope-benchmark-ci-v0
      - name: Align same/diverse base checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          relevance = Path('ai_hypothesis/large_scope/relevance.py')
          text = relevance.read_text(encoding='utf-8')
          old_same = 'worker = _scope_seed("same-worker", split, seed, population_width) % population_width'
          new_same = 'worker = _scope_seed("worker-plan", split, seed, population_width) % population_width'
          old_diverse = 'start = _scope_seed("diverse-workers", split, seed, population_width) % population_width'
          new_diverse = 'start = _scope_seed("worker-plan", split, seed, population_width) % population_width'
          for old, new in ((old_same, new_same), (old_diverse, new_diverse)):
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError(f'worker-plan target missing: {old}')
          relevance.write_text(text, encoding='utf-8')

          tests = Path('tests/test_large_scope_relevance.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '        self.assertEqual(len(set(diverse_16)), 16)\n        self.assertEqual(diverse_16[:4], diverse_4)\n'
          replacement = (
              '        self.assertEqual(len(set(diverse_16)), 16)\n'
              '        self.assertEqual(diverse_16[:4], diverse_4)\n'
              '        self.assertEqual(same_4[0], diverse_4[0])\n'
              '        self.assertEqual(\n'
              '            same_worker_indices(seed=7, width=1, population_width=16),\n'
              '            diverse_worker_indices(seed=7, width=1, population_width=16),\n'
              '        )\n'
          )
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif 'same_worker_indices(seed=7, width=1' not in text:
              raise RuntimeError('worker-control regression anchor missing')
          tests.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_hypothesis/large_scope/relevance.py tests/test_large_scope_relevance.py
          git commit -m "Align large-scope worker control [skip ci]"
          git push origin HEAD:agent/large-scope-benchmark-ci-v0
