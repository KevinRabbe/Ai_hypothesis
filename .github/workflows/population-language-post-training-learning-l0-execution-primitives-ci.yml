name: Population Language Post-Training Learning L0 Execution Primitives CI

on:
  push:
    branches:
      - agent/population-language-post-training-learning-l0-execution-primitives-v0
  pull_request:
    paths:
      - ".github/workflows/population-language-post-training-learning-l0-execution-primitives-ci.yml"
      - "ai_hypothesis/population_language/post_training_learning_l0_execution.py"
      - "experiments/population_language_post_training_learning_l0/execution_primitives_v0.md"
      - "tests/test_population_language_post_training_learning_l0_execution.py"

permissions:
  contents: read

jobs:
  execution-primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          python -m pip install --disable-pip-version-check \
            torch==2.9.1 \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Compile execution-primitives slice
        run: |
          python -m py_compile \
            ai_hypothesis/population_language/post_training_learning_l0_execution.py \
            tests/test_population_language_post_training_learning_l0_execution.py
      - name: Run full Post-Training Learning contract stack
        run: |
          python -m unittest -v \
            tests.test_population_language_post_training_learning_l0 \
            tests.test_population_language_post_training_learning_l0_adapter \
            tests.test_population_language_post_training_learning_l0_calibration \
            tests.test_population_language_post_training_learning_l0_execution
      - name: Verify locked execution constants
        run: |
          python - <<'PY'
          from ai_hypothesis.population_language import (
              post_training_learning_l0_execution as execution,
          )

          report = execution.validate_execution_primitives()
          assert report["valid"], report["checks"]
          assert execution.STATUS == (
              "EXECUTION_PRIMITIVES_ONLY_NO_CHECKPOINT_OR_CALIBRATION_OR_FINAL_RESULT"
          )
          assert execution.SOURCE_CALIBRATION_HEAD == (
              "19aa701c475b19fc5b31409528948f21ad9fbdf4"
          )
          assert execution.ARTIFACT_MAX_BYTES == 1_048_576
          assert execution.SCHEDULE_SHA256_BY_UPDATES[256] == (
              "f8dbafd553ab4bca6d3d6b977a3cb8bc"
              "939adb18a86a46e9837d3c5bb9dd8958"
          )
          PY
      - name: Verify exact four-file scope
        env:
          BASE_SHA: 19aa701c475b19fc5b31409528948f21ad9fbdf4
        run: |
          python - <<'PY'
          import os
          import subprocess

          expected = {
              ".github/workflows/population-language-post-training-learning-l0-execution-primitives-ci.yml",
              "ai_hypothesis/population_language/post_training_learning_l0_execution.py",
              "experiments/population_language_post_training_learning_l0/execution_primitives_v0.md",
              "tests/test_population_language_post_training_learning_l0_execution.py",
          }
          output = subprocess.check_output(
              ["git", "diff", "--name-only", f"{os.environ['BASE_SHA']}...HEAD"],
              text=True,
          )
          observed = {line for line in output.splitlines() if line}
          assert observed == expected, {
              "missing": sorted(expected - observed),
              "unexpected": sorted(observed - expected),
          }
          PY
