name: Gate9D router architecture sweep v4 qualification
on:
  pull_request:
    branches:
      - agent/gate9d-learned-shared-router-exhaustive-margin-v3
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install exact CPU runtime
        run: python -m pip install --disable-pip-version-check torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and verify contract
        run: |
          python -m py_compile ai_hypothesis/population_compute/gate9d_router_architecture_sweep_v4.py scripts/run_gate9d_router_architecture_sweep_v4.py tests/test_gate9d_router_architecture_sweep_v4.py
          python -m unittest tests/test_gate9d_router_architecture_sweep_v4.py -v
      - name: Prove exact six-file slice and closed binaries
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git diff --name-only "$base...HEAD" | wc -l)" -eq 6
          ! git diff --name-only "$base...HEAD" | grep -E '\.(pt|bin|safetensors|jsonl|zip)$'
