name: Population Language Post-Training Learning L0 Calibration Plan CI

on:
  pull_request:
    paths:
      - ".github/workflows/population-language-post-training-learning-l0-calibration-plan-ci.yml"
      - "ai_hypothesis/population_language/post_training_learning_l0_calibration_plan.py"
      - "experiments/population_language_post_training_learning_l0/calibration_plan_v0.md"
      - "tests/test_population_language_post_training_learning_l0_calibration_plan.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          python -m pip install --disable-pip-version-check \
            torch==2.9.1 \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Compile calibration-plan slice
        run: |
          python -m py_compile \
            ai_hypothesis/population_language/post_training_learning_l0_calibration_plan.py \
            tests/test_population_language_post_training_learning_l0_calibration_plan.py
      - name: Run complete preparation contract stack
        run: |
          python -m unittest \
            tests.test_population_language_l0_reference_training \
            tests.test_population_language_post_training_learning_l0 \
            tests.test_population_language_post_training_learning_l0_adapter \
            tests.test_population_language_post_training_learning_l0_calibration \
            tests.test_population_language_post_training_learning_l0_execution \
            tests.test_population_language_post_training_learning_l0_checkpoint \
            tests.test_population_language_post_training_learning_l0_fresh_process \
            tests.test_population_language_l0_reference_manifest \
            tests.test_population_language_post_training_learning_l0_calibration_plan
      - name: Verify locked calibration-plan constants
        run: |
          python - <<'PY'
          from ai_hypothesis.population_language import post_training_learning_l0_calibration_plan as plan

          report = plan.validate_calibration_plan_contract()
          assert report["valid"], report
          assert plan.SOURCE_REFERENCE_MANIFEST_HEAD == "4bb09762948fd83eb7a7ea2beb5b1f8ecdbd450d"
          assert plan.PLAN_MAX_BYTES == 256 * 1024
          assert len(plan.PLAN_KEYS) == 18
          assert len(plan.CHECKPOINT_KEYS) == 5
          assert len(plan.CANDIDATE_KEYS) == 7
          assert len(plan.PAIR_KEYS) == 2
          PY
      - name: Verify exact four-file scope
        run: |
          base=4bb09762948fd83eb7a7ea2beb5b1f8ecdbd450d
          git cat-file -e "$base^{commit}"
          git diff --name-only "$base" HEAD | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/population-language-post-training-learning-l0-calibration-plan-ci.yml
          ai_hypothesis/population_language/post_training_learning_l0_calibration_plan.py
          experiments/population_language_post_training_learning_l0/calibration_plan_v0.md
          tests/test_population_language_post_training_learning_l0_calibration_plan.py
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
