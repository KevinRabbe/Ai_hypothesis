name: Gate9D router convergence robustness v6 qualification
on:
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate9d_router_convergence_robustness_v6.py'
      - 'scripts/run_gate9d_router_convergence_robustness_v6.py'
      - 'scripts/run_gate9d_router_convergence_robustness_v6.ps1'
      - 'experiments/population_compute_scaling_v0/gate9d_router_convergence_robustness_v6.md'
      - 'tests/test_gate9d_router_convergence_robustness_v6.py'
      - '.github/workflows/gate9d-router-convergence-robustness-v6-ci.yml'
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.9'}
      - run: python -m pip install --disable-pip-version-check torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile ai_hypothesis/population_compute/gate9d_router_convergence_robustness_v6.py scripts/run_gate9d_router_convergence_robustness_v6.py tests/test_gate9d_router_convergence_robustness_v6.py
          python -m unittest tests/test_gate9d_router_convergence_robustness_v6.py -v
      - run: |
          test "$(git diff --name-only 90315b5b078dd92c55d46698af1d1c0659d25f8c...HEAD | wc -l)" -eq 6
          ! git diff --name-only 90315b5b078dd92c55d46698af1d1c0659d25f8c...HEAD | grep -E '\.(pt|pth|bin|zip)$'
