name: Population relay learning diagnostic

on:
  push:
    branches:
      - agent/population-relay-learning-diagnostic-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: small-long
            state_width: 32
            message_width: 12
          - name: reference-long
            state_width: 64
            message_width: 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run held-out development diagnostic
        run: |
          mkdir -p diagnostic
          python -m ai_hypothesis.population_compute.run_relay_scaling \
            --device cpu \
            --training-seed 900 \
            --benchmark-seed 900 \
            --train-steps 2048 \
            --train-batch-size 8 \
            --learning-rate 0.001 \
            --state-width ${{ matrix.state_width }} \
            --message-width ${{ matrix.message_width }} \
            --development-world-count 512 \
            --eval-batch-size 32 \
            --checkpoint diagnostic/relay.pt \
            --output diagnostic/development.json \
            > diagnostic/stdout.json

      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: population-relay-learning-diagnostic-${{ matrix.name }}
          path: |
            diagnostic/development.json
          if-no-files-found: error
