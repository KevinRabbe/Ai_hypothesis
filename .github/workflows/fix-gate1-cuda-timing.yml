name: Fix Gate1 CUDA timing semantics

on:
  push:
    branches:
      - agent/relay-work-span-frontier-v0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relay-work-span-frontier-v0
      - name: Patch resource timing without per-iteration CUDA sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_hypothesis/population_compute/relay_resource_frontier.py')
          text = path.read_text(encoding='utf-8')
          old_fields = '''    throughput_samples_per_second: float\n    device_median_latency_ms: float | None\n'''
          new_fields = '''    throughput_samples_per_second: float\n    latency_source: str\n    host_enqueue_seconds: float\n    device_median_latency_ms: float | None\n'''
          if old_fields not in text:
              if new_fields not in text:
                  raise RuntimeError('measurement field patch target not found')
          else:
              text = text.replace(old_fields, new_fields, 1)

          old_validation = '''        if self.worker_updates_per_sample <= 0:\n            raise ValueError("worker_updates_per_sample must be positive")\n'''
          new_validation = '''        if self.latency_source not in {"host_perf_counter", "cuda_event"}:\n            raise ValueError("unknown latency source")\n        if not math.isfinite(self.host_enqueue_seconds) or self.host_enqueue_seconds <= 0:\n            raise ValueError("host enqueue time must be finite and positive")\n        if self.worker_updates_per_sample <= 0:\n            raise ValueError("worker_updates_per_sample must be positive")\n'''
          if old_validation not in text:
              if new_validation not in text:
                  raise RuntimeError('measurement validation patch target not found')
          else:
              text = text.replace(old_validation, new_validation, 1)

          start = text.index('def _measure_schedule(\n')
          end = text.index('\ndef _synchronize(device: torch.device) -> None:\n', start)
          replacement = '''def _measure_schedule(\n    forward: Callable[[RelayPopulationModel, RelayTensorBatch], RelayScheduleOutput],\n    model: RelayPopulationModel,\n    batch: RelayTensorBatch,\n    *,\n    warmup_iterations: int,\n    measured_iterations: int,\n) -> RelayScheduleMeasurement:\n    device = batch.local_inputs.device\n    output: RelayScheduleOutput | None = None\n    for _ in range(warmup_iterations):\n        output = forward(model, batch)\n    _synchronize(device)\n\n    baseline_allocated: int | None = None\n    baseline_reserved: int | None = None\n    if device.type == "cuda":\n        torch.cuda.reset_peak_memory_stats(device)\n        baseline_allocated = int(torch.cuda.memory_allocated(device))\n        baseline_reserved = int(torch.cuda.memory_reserved(device))\n\n    latencies_ms: list[float] = []\n    device_latencies_ms: list[float] = []\n    if device.type == "cuda":\n        # Keep the measured stream asynchronous: enqueue event-delimited calls and synchronize\n        # once after the block. Per-iteration synchronization would destroy the batching/launch\n        # behavior Gate 1 is intended to measure.\n        event_pairs: list[tuple[torch.cuda.Event, torch.cuda.Event]] = []\n        _synchronize(device)\n        measured_started = time.perf_counter()\n        for _ in range(measured_iterations):\n            start_event = torch.cuda.Event(enable_timing=True)\n            end_event = torch.cuda.Event(enable_timing=True)\n            start_event.record()\n            output = forward(model, batch)\n            end_event.record()\n            event_pairs.append((start_event, end_event))\n        enqueue_finished = time.perf_counter()\n        _synchronize(device)\n        total_measured_seconds = time.perf_counter() - measured_started\n        host_enqueue_seconds = enqueue_finished - measured_started\n        device_latencies_ms = [\n            float(start_event.elapsed_time(end_event))\n            for start_event, end_event in event_pairs\n        ]\n        latencies_ms = list(device_latencies_ms)\n        latency_source = "cuda_event"\n    else:\n        measured_started = time.perf_counter()\n        for _ in range(measured_iterations):\n            started = time.perf_counter()\n            output = forward(model, batch)\n            latencies_ms.append((time.perf_counter() - started) * 1_000.0)\n        enqueue_finished = time.perf_counter()\n        total_measured_seconds = enqueue_finished - measured_started\n        host_enqueue_seconds = total_measured_seconds\n        latency_source = "host_perf_counter"\n\n    if output is None:\n        raise RuntimeError("schedule measurement produced no output")\n    telemetry = output.telemetry\n    peak_allocated = peak_reserved = peak_delta = None\n    if device.type == "cuda":\n        peak_allocated = int(torch.cuda.max_memory_allocated(device))\n        peak_reserved = int(torch.cuda.max_memory_reserved(device))\n        assert baseline_allocated is not None\n        peak_delta = max(0, peak_allocated - baseline_allocated)\n\n    sorted_latencies = sorted(latencies_ms)\n    p95_index = max(0, math.ceil(0.95 * len(sorted_latencies)) - 1)\n    measurement = RelayScheduleMeasurement(\n        schedule=telemetry.schedule,\n        batch_size=int(batch.local_inputs.shape[0]),\n        warmup_iterations=warmup_iterations,\n        measured_iterations=measured_iterations,\n        median_batch_latency_ms=float(statistics.median(latencies_ms)),\n        p95_batch_latency_ms=float(sorted_latencies[p95_index]),\n        min_batch_latency_ms=float(sorted_latencies[0]),\n        total_measured_seconds=total_measured_seconds,\n        throughput_samples_per_second=(\n            int(batch.local_inputs.shape[0]) * measured_iterations / total_measured_seconds\n        ),\n        latency_source=latency_source,\n        host_enqueue_seconds=host_enqueue_seconds,\n        device_median_latency_ms=(\n            float(statistics.median(device_latencies_ms)) if device_latencies_ms else None\n        ),\n        cuda_baseline_allocated_bytes=baseline_allocated,\n        cuda_peak_allocated_bytes=peak_allocated,\n        cuda_peak_allocated_delta_bytes=peak_delta,\n        cuda_baseline_reserved_bytes=baseline_reserved,\n        cuda_peak_reserved_bytes=peak_reserved,\n        worker_updates_per_sample=telemetry.worker_updates_per_sample,\n        candidate_evaluations_per_sample=telemetry.candidate_evaluations_per_sample,\n        input_projection_evaluations_per_sample=(\n            telemetry.input_projection_evaluations_per_sample\n        ),\n        value_projection_evaluations_per_sample=(\n            telemetry.value_projection_evaluations_per_sample\n        ),\n        static_projection_evaluations_per_sample=(\n            telemetry.static_projection_evaluations_per_sample\n        ),\n        communicated_scalars_per_sample=(\n            telemetry.inter_state_communicated_scalars_per_sample\n        ),\n        peak_active_neural_states_per_sample=(\n            telemetry.peak_active_neural_states_per_sample\n        ),\n        cached_state_vectors_per_sample=telemetry.cached_state_vectors_per_sample,\n        cached_message_vectors_per_sample=telemetry.cached_message_vectors_per_sample,\n    )\n    measurement.validate()\n    return measurement\n\n'''
          text = text[:start] + replacement + text[end + 1:]
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_hypothesis/population_compute/relay_resource_frontier.py
          git commit -m "Fix Gate1 CUDA timing semantics [skip ci]"
          git push origin HEAD:agent/relay-work-span-frontier-v0
