name: Gate7 information-ceiling decomposition execution qualification

on:
  push:
    branches:
      - agent/gate7-information-ceiling-decomposition-execution-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_decomposition.py'
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_worlds.py'
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_rank.py'
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_statistics.py'
      - 'ai_hypothesis/population_compute/run_gate7_information_ceiling_decomposition.py'
      - 'ai_hypothesis/population_compute/analyze_gate7_information_ceiling_decomposition.py'
      - 'scripts/run_gate7_information_ceiling_decomposition.ps1'
      - 'tests/test_gate7_information_ceiling_decomposition_execution.py'
      - '.github/workflows/gate7-information-ceiling-decomposition-execution-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch for import boundary
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch

      - name: Compile execution and independent auditor
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate7_information_ceiling_decomposition.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_worlds.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_rank.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_statistics.py \
            ai_hypothesis/population_compute/run_gate7_information_ceiling_decomposition.py \
            ai_hypothesis/population_compute/analyze_gate7_information_ceiling_decomposition.py

      - name: Run non-exposure execution regressions
        run: |
          python -m unittest tests/test_gate7_information_ceiling_decomposition_execution.py

      - name: Verify exact frozen bindings
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute import gate7_information_ceiling_decomposition as e
          from ai_hypothesis.population_compute.gate7_information_ceiling_decomposition_protocol import (
              expected_primary_ceiling_by_population,
          )

          assert e.GATE7_INFORMATION_CEILING_EXECUTION_ADMITTED is True
          assert e.GATE7_INFORMATION_CEILING_PROTOCOL_HEAD == '3640699f1727886c9ad2e954269fad660dc34370'
          assert e.GATE7_INFORMATION_CEILING_BASE_RESULT_HEAD == '4591dae55cada819e848ae7f929d5e8f2b8805d6'
          assert e.GATE7_INFORMATION_CEILING_POPULATIONS == (16384, 32768, 65536, 131072)
          assert e.GATE7_INFORMATION_CEILING_RANKERS == (
              'learned_score_rank',
              'bayes_hint_likelihood_rank',
              'public_hash_rank',
          )
          assert e.GATE7_INFORMATION_CEILING_ATTEMPT_LADDER == (
              1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024
          )
          assert e.GATE7_INFORMATION_CEILING_PRIMARY_ATTEMPTS == 128
          assert e.GATE7_INFORMATION_CEILING_WORLD_COUNT == 512
          assert e.GATE7_INFORMATION_CEILING_EVALUATION_BATCH_SIZE == 64
          assert e.GATE7_INFORMATION_CEILING_BOOTSTRAP_SAMPLES == 10_000
          expected = expected_primary_ceiling_by_population()
          assert abs(expected[131072] - 0.06627595867880422) < 1e-15
          PY

      - name: Prove CI never invokes scientific worlds or runner
        shell: bash
        run: |
          test_file=tests/test_gate7_information_ceiling_decomposition_execution.py
          workflow=.github/workflows/gate7-information-ceiling-decomposition-execution-ci.yml
          ! grep --line-number -E '^[[:space:]]*(run_gate7_information_ceiling_decomposition|generate_gate7_information_ceiling_world)\(' "$test_file"
          ! grep --line-number -E '^[[:space:]]*python -m ai_hypothesis\.population_compute\.run_gate7_information_ceiling_decomposition([[:space:]]|$)' "$workflow"
          ! grep --line-number -E '^[[:space:]]*--transition-checkpoint0([[:space:]]|$)' "$workflow"
          ! grep --line-number -E '^[[:space:]]*if .*cuda\.is_available' "$workflow"

      - name: Verify independent auditor boundary
        shell: bash
        run: |
          auditor=ai_hypothesis/population_compute/analyze_gate7_information_ceiling_decomposition.py
          ! grep --line-number '^import torch' "$auditor"
          ! grep --line-number '^from torch' "$auditor"
          ! grep --line-number 'gate7_information_ceiling_decomposition import' "$auditor"
          ! grep --line-number 'gate7_information_ceiling_decomposition_rank import' "$auditor"
          ! grep --line-number 'gate7_information_ceiling_decomposition_statistics import' "$auditor"

      - name: Verify no training or communication intervention
        shell: bash
        run: |
          runner=ai_hypothesis/population_compute/run_gate7_information_ceiling_decomposition.py
          ranker=ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_rank.py
          ! grep --line-number -E 'optimizer|backward\(|\.train\(' "$runner" "$ranker"
          ! grep --line-number -E 'CommunicationMode|RelayPopulationModel|message_content|communication_mode' "$runner" "$ranker"
          grep -F '"communication_intervention_performed": False' "$runner"
          grep -F '"continuation_worlds_reused": False' "$runner"

  windows-wrapper-smoke:
    if: github.head_ref == 'agent/gate7-information-ceiling-decomposition-execution-v0' || github.ref == 'refs/heads/agent/gate7-information-ceiling-decomposition-execution-v0'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Smoke PowerShell wrapper before checkpoints CUDA or worlds
        shell: pwsh
        env:
          GATE7_INFORMATION_CEILING_WRAPPER_SMOKE: '1'
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'gate7-information-ceiling-wrapper-smoke'
          if (Test-Path -LiteralPath $output) {
              Remove-Item -LiteralPath $output -Recurse -Force
          }
          .\scripts\run_gate7_information_ceiling_decomposition.ps1 `
              -IdleMachineAttested `
              -OutputRoot $output
          if (Test-Path -LiteralPath (Join-Path $output 'science')) {
              throw 'Information-ceiling wrapper smoke reached the scientific output boundary.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $output 'run-config.json') -PathType Leaf)) {
              throw 'Information-ceiling wrapper smoke did not preserve run provenance.'
          }
