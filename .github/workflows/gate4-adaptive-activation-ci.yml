name: Gate4 adaptive activation qualification

on:
  push:
    branches:
      - agent/gate4-adaptive-activation-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate4_adaptive_activation.py'
      - 'ai_hypothesis/population_compute/analyze_gate4_adaptive_activation.py'
      - 'ai_hypothesis/population_compute/run_gate4_adaptive_activation.py'
      - 'scripts/run_gate4_adaptive_activation.ps1'
      - 'tests/test_gate4_adaptive_activation.py'
      - 'tests/test_gate4_adaptive_activation_audit.py'
      - 'experiments/population_compute_scaling_v0/gate4_adaptive_activation_protocol.md'
      - 'experiments/population_compute_scaling_v0/gate4_adaptive_activation_development_result.md'
      - 'experiments/population_compute_scaling_v0/gate3_v3_confirmation_result.md'
      - '.github/workflows/gate4-adaptive-activation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-activation-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Verify confirmed Gate3 base is preserved
        shell: bash
        run: |
          grep -q 'GATE3_V3_CONFIRMED_GENERATION_PRESSURE_BENEFIT' experiments/population_compute_scaling_v0/gate3_v3_confirmation_result.md
          grep -q '638f4965e015b2f6d0f709231cf5116fe17cec78006a1deec66ba66f29c07283' experiments/population_compute_scaling_v0/gate3_v3_confirmation_result.md

      - name: Compile Gate4 frozen modules
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate4_adaptive_activation.py \
            ai_hypothesis/population_compute/analyze_gate4_adaptive_activation.py \
            ai_hypothesis/population_compute/run_gate4_adaptive_activation.py

      - name: Run synthetic Gate4 regressions
        run: |
          python -m unittest \
            tests/test_gate4_adaptive_activation.py \
            tests/test_gate4_adaptive_activation_audit.py

      - name: Verify frozen Gate4 constants and work identity
        shell: bash
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute.gate4_adaptive_activation import (
              GATE4_BOOTSTRAP_SAMPLES,
              GATE4_CHECKPOINT_INDICES,
              GATE4_CONDITIONS,
              GATE4_DEPTH,
              GATE4_EVAL_BATCH_SIZE,
              GATE4_HINT_RELIABILITY,
              GATE4_RESERVE_CAPACITY,
              GATE4_SCHEDULED_SLOTS,
              GATE4_STATIC_DEPTH7_BUILD_SLOTS,
              GATE4_STATIC_FINAL_PARENT_SLOTS,
              GATE4_TOTAL_LEARNED_UPDATES,
              GATE4_WORLD_COUNT,
          )
          assert GATE4_CHECKPOINT_INDICES == (0, 1, 2)
          assert GATE4_DEPTH == 8
          assert GATE4_HINT_RELIABILITY == 0.70
          assert GATE4_RESERVE_CAPACITY == 256
          assert GATE4_SCHEDULED_SLOTS == 159
          assert GATE4_TOTAL_LEARNED_UPDATES == 2544
          assert GATE4_STATIC_DEPTH7_BUILD_SLOTS == 127
          assert GATE4_STATIC_FINAL_PARENT_SLOTS == 32
          assert GATE4_WORLD_COUNT == 256
          assert GATE4_EVAL_BATCH_SIZE == 64
          assert GATE4_BOOTSTRAP_SAMPLES == 2000
          assert len(GATE4_CONDITIONS) == 3
          assert 3 * len(GATE4_CONDITIONS) == 9
          PY

      - name: Verify frozen development namespace remains isolated
        shell: bash
        run: |
          ! grep -R --line-number 'generate_gate4_development_world' tests/test_gate4_adaptive_activation.py tests/test_gate4_adaptive_activation_audit.py
          grep -q 'gate4-adaptive-activation-development-hidden' ai_hypothesis/population_compute/gate4_adaptive_activation.py
          grep -q 'gate4-adaptive-activation-development-hints' ai_hypothesis/population_compute/gate4_adaptive_activation.py
          grep -q 'gate4-adaptive-activation-development-runtime' ai_hypothesis/population_compute/gate4_adaptive_activation.py
          ! grep -q 'gate3-v3-generation-pressure-development-hidden' ai_hypothesis/population_compute/gate4_adaptive_activation.py
          ! grep -q 'gate3-v3-generation-pressure-confirmation' ai_hypothesis/population_compute/gate4_adaptive_activation.py

      - name: Verify admitted CLI exposes no scientific tuning knobs
        shell: bash
        run: |
          python -m ai_hypothesis.population_compute.run_gate4_adaptive_activation --help > gate4-help.txt
          grep -q -- '--output-root' gate4-help.txt
          grep -q -- '--checkpoint0' gate4-help.txt
          grep -q -- '--checkpoint1' gate4-help.txt
          grep -q -- '--checkpoint2' gate4-help.txt
          ! grep -q -- '--world-count' gate4-help.txt
          ! grep -q -- '--capacity' gate4-help.txt
          ! grep -q -- '--scheduled-slots' gate4-help.txt
          ! grep -q -- '--reliability' gate4-help.txt
          ! grep -q -- '--bootstrap' gate4-help.txt
          ! grep -q -- '--scheduler' gate4-help.txt
          ! grep -q -- '--training' gate4-help.txt

      - name: Verify recorded Gate4 A2 evidence and confirmation boundary
        shell: bash
        run: |
          grep -q 'FROZEN PRE-RESULT PROTOCOL — NO GATE-4 DEVELOPMENT RESULT INSPECTED' experiments/population_compute_scaling_v0/gate4_adaptive_activation_protocol.md
          grep -q 'A4 → A2 → A1 → A3 → A0 → mixed' experiments/population_compute_scaling_v0/gate4_adaptive_activation_protocol.md
          grep -q 'Gate-4 confirmation is \*\*CLOSED\*\*' experiments/population_compute_scaling_v0/gate4_adaptive_activation_protocol.md
          grep -q 'G4_A2_ROBUST_ADAPTIVE_ACTIVATION_BENEFIT' experiments/population_compute_scaling_v0/gate4_adaptive_activation_development_result.md
          grep -q '9d422d176d4840fc2608849aa9209d906c896f4cba701414211b628461c4616b' experiments/population_compute_scaling_v0/gate4_adaptive_activation_development_result.md
          grep -q '90f3d201cdeebc075caa89d5f0235c1d86ad654ad8000405f663996cf96f659a' experiments/population_compute_scaling_v0/gate4_adaptive_activation_development_result.md
          grep -q 'ef20892e8a179598c4c0894a4391a2d013a70879849daaf05718ec76b508b336' experiments/population_compute_scaling_v0/gate4_adaptive_activation_development_result.md
          grep -q 'No Gate-4 confirmation world was generated or inspected by this development run' experiments/population_compute_scaling_v0/gate4_adaptive_activation_development_result.md

  windows-powershell-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put checkout on admitted Gate4 branch name
        shell: powershell
        run: git switch -C agent/gate4-adaptive-activation-v0

      - name: Execute Gate4 pre-science wrapper under Windows PowerShell 5.1 StrictMode
        shell: powershell
        env:
          GATE4_WRAPPER_SMOKE: '1'
        run: |
          .\scripts\run_gate4_adaptive_activation.ps1 `
            -IdleMachineAttested `
            -OutputRoot "$env:RUNNER_TEMP\gate4-adaptive-activation-smoke"
