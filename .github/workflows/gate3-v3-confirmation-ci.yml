name: Gate3 v3 confirmation qualification

on:
  push:
    branches:
      - agent/gate3-v3-confirmation-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate3_v3_confirmation.py'
      - 'ai_hypothesis/population_compute/analyze_gate3_v3_confirmation.py'
      - 'ai_hypothesis/population_compute/run_gate3_v3_confirmation.py'
      - 'scripts/run_gate3_v3_confirmation.ps1'
      - 'tests/test_gate3_v3_confirmation.py'
      - 'tests/test_gate3_v3_confirmation_audit.py'
      - 'experiments/population_compute_scaling_v0/gate3_v3_confirmation_protocol.md'
      - 'experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_development_result.md'
      - '.github/workflows/gate3-v3-confirmation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmation-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Verify development mechanically permits confirmation
        shell: bash
        run: |
          grep -q 'V3_G1_ROBUST_GENERATION_PRESSURE_BENEFIT' experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_development_result.md
          grep -q 'No confirmation world was generated or inspected by the development run' experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_development_result.md

      - name: Compile confirmation modules
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate3_v3_confirmation.py \
            ai_hypothesis/population_compute/analyze_gate3_v3_confirmation.py \
            ai_hypothesis/population_compute/run_gate3_v3_confirmation.py

      - name: Run data-blind confirmation qualification tests
        run: |
          python -m unittest \
            tests/test_gate3_v3_confirmation.py \
            tests/test_gate3_v3_confirmation_audit.py

      - name: Verify frozen confirmation constants without generating worlds
        shell: bash
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute.gate3_v3_confirmation import (
              GATE3_V3_CONFIRMATION_BOOTSTRAP_SAMPLES,
              GATE3_V3_CONFIRMATION_CHECKPOINT_INDICES,
              GATE3_V3_CONFIRMATION_CONDITIONS,
              GATE3_V3_CONFIRMATION_EVAL_BATCH_SIZE,
              GATE3_V3_CONFIRMATION_VERSION,
              GATE3_V3_CONFIRMATION_WORLD_COUNT,
          )
          from ai_hypothesis.population_compute.gate3_v3_generation_pressure import (
              GATE3_V3_CHECKPOINT_INDICES,
              GATE3_V3_CONDITIONS,
              GATE3_V3_DEPTH,
              GATE3_V3_HINT_RELIABILITY,
              GATE3_V3_SCHEDULED_SLOTS,
              GATE3_V3_TOTAL_LEARNED_UPDATES,
          )
          assert GATE3_V3_CONFIRMATION_VERSION == 'gate3-v3-generation-pressure-confirmation-v0'
          assert GATE3_V3_CONFIRMATION_WORLD_COUNT == 512
          assert GATE3_V3_CONFIRMATION_EVAL_BATCH_SIZE == 64
          assert GATE3_V3_CONFIRMATION_BOOTSTRAP_SAMPLES == 4000
          assert GATE3_V3_CONFIRMATION_CHECKPOINT_INDICES == GATE3_V3_CHECKPOINT_INDICES == (0, 1, 2)
          assert GATE3_V3_CONFIRMATION_CONDITIONS == GATE3_V3_CONDITIONS
          assert len(GATE3_V3_CONFIRMATION_CONDITIONS) == 5
          assert GATE3_V3_DEPTH == 8
          assert GATE3_V3_HINT_RELIABILITY == 0.70
          assert GATE3_V3_SCHEDULED_SLOTS == 223
          assert GATE3_V3_TOTAL_LEARNED_UPDATES == 3568
          PY

      - name: Verify admitted CLI has no scientific tuning knobs
        shell: bash
        run: |
          python -m ai_hypothesis.population_compute.run_gate3_v3_confirmation --help > gate3-v3-confirmation-help.txt
          grep -q -- '--output-root' gate3-v3-confirmation-help.txt
          grep -q -- '--checkpoint0' gate3-v3-confirmation-help.txt
          grep -q -- '--checkpoint1' gate3-v3-confirmation-help.txt
          grep -q -- '--checkpoint2' gate3-v3-confirmation-help.txt
          ! grep -q -- '--world-count' gate3-v3-confirmation-help.txt
          ! grep -q -- '--capacity' gate3-v3-confirmation-help.txt
          ! grep -q -- '--reliability' gate3-v3-confirmation-help.txt
          ! grep -q -- '--bootstrap' gate3-v3-confirmation-help.txt
          ! grep -q -- '--scheduled-slots' gate3-v3-confirmation-help.txt
          ! grep -q -- '--training' gate3-v3-confirmation-help.txt

      - name: Verify confirmation remains unexposed during qualification
        shell: bash
        run: |
          grep -q 'FROZEN BEFORE ANY GATE-3 v3 CONFIRMATION WORLD IS GENERATED OR INSPECTED' experiments/population_compute_scaling_v0/gate3_v3_confirmation_protocol.md
          grep -q 'Exactly \*\*512 confirmation worlds\*\*' experiments/population_compute_scaling_v0/gate3_v3_confirmation_protocol.md
          grep -q 'GATE3_V3_CONFIRMED_GENERATION_PRESSURE_BENEFIT' experiments/population_compute_scaling_v0/gate3_v3_confirmation_protocol.md
          ! find experiments/population_compute_scaling_v0 -maxdepth 1 -type f -iname 'gate3_v3*confirmation*result*' | grep -q .

  windows-powershell-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put checkout on admitted Gate3 v3 confirmation branch name
        shell: powershell
        run: git switch -C agent/gate3-v3-confirmation-v0

      - name: Execute confirmation pre-science wrapper under Windows PowerShell 5.1 StrictMode
        shell: powershell
        env:
          GATE3_V3_CONFIRMATION_WRAPPER_SMOKE: '1'
        run: |
          .\scripts\run_gate3_v3_confirmation.ps1 `
            -IdleMachineAttested `
            -OutputRoot "$env:RUNNER_TEMP\gate3-v3-confirmation-smoke"
