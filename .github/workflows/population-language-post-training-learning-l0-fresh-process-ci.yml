name: Population Language Post-Training Learning L0 Fresh Process CI

on:
  pull_request:
    paths:
      - ".github/workflows/population-language-post-training-learning-l0-fresh-process-ci.yml"
      - "ai_hypothesis/population_language/post_training_learning_l0_fresh_process.py"
      - "experiments/population_language_post_training_learning_l0/fresh_process_v0.md"
      - "tests/test_population_language_post_training_learning_l0_fresh_process.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          python -m pip install --disable-pip-version-check \
            torch==2.9.1 \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Compile fresh-process slice
        run: |
          python -m py_compile \
            ai_hypothesis/population_language/post_training_learning_l0_fresh_process.py \
            tests/test_population_language_post_training_learning_l0_fresh_process.py
      - name: Run full Post-Training Learning contract stack
        run: |
          python -m unittest \
            tests.test_population_language_post_training_learning_l0 \
            tests.test_population_language_post_training_learning_l0_adapter \
            tests.test_population_language_post_training_learning_l0_calibration \
            tests.test_population_language_post_training_learning_l0_execution \
            tests.test_population_language_post_training_learning_l0_checkpoint \
            tests.test_population_language_post_training_learning_l0_fresh_process
      - name: Verify locked fresh-process constants
        run: |
          python - <<'PY'
          from ai_hypothesis.population_language import post_training_learning_l0_fresh_process as fresh

          report = fresh.validate_fresh_process_contract()
          assert report["valid"], report
          assert fresh.SOURCE_CHECKPOINT_CONTRACT_HEAD == "0b43d2cfedcaaf92a9905750ba3cac809645bebd"
          assert len(fresh.REQUEST_KEYS) == 13
          assert len(fresh.RESULT_KEYS) == 18
          assert fresh.REQUEST_MAX_BYTES == 32 * 1024
          assert fresh.RESULT_MAX_BYTES == 64 * 1024
          assert fresh.MAX_PROBE_BATCH == 8
          assert fresh.MAX_PROBE_SEQUENCE == 8
          assert fresh.MAX_PROBE_WORKERS == 256
          PY
      - name: Verify exact four-file scope
        run: |
          base=0b43d2cfedcaaf92a9905750ba3cac809645bebd
          git cat-file -e "$base^{commit}"
          git diff --name-only "$base" HEAD | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/population-language-post-training-learning-l0-fresh-process-ci.yml
          ai_hypothesis/population_language/post_training_learning_l0_fresh_process.py
          experiments/population_language_post_training_learning_l0/fresh_process_v0.md
          tests/test_population_language_post_training_learning_l0_fresh_process.py
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
