name: Gate8 factorized message seed0 result v1 qualification

on:
  push:
    branches:
      - agent/gate8-factorized-message-training-seed0-result-v1
  pull_request:
    paths:
      - 'experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_result_v1.json'
      - 'experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_result_v1.md'
      - 'experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_manifest_v1.sha256'
      - '.github/workflows/gate8-factorized-message-training-seed0-result-v1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable result summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path('experiments/population_compute_scaling_v0')
          summary_path = root / 'gate8_factorized_message_training_seed0_result_v1.json'
          manifest_path = root / 'gate8_factorized_message_training_seed0_manifest_v1.sha256'
          data = json.loads(summary_path.read_text(encoding='utf-8'))

          assert data['scientific_status'] == 'G8_V1_TRAINING_CHECKPOINT_ADMITTED'
          assert data['source_head'] == '1b449f0ed4998e9246c86803d4473d0ac9ebdac3'
          assert data['protocol_head'] == 'a33dc123d090268a531d112251ea3ab53cb50062'
          assert data['runtime_head'] == '333d88ac4fc52f1651741fba224e0b4605feedd3'
          assert data['architecture_head'] == 'c3ab64008c816fa1eb6f9d6f8f0a1a99ed195ec8'
          assert data['seed'] == 0
          assert data['raw_result_sha256'] == '1e42eb53f6446e4eeb66bbb2090c8dad7551e2098b76f289b43cf0c05975e829'
          assert data['selected_checkpoint_sha256'] == '3005369a4830c12baee8ffa7fedc1bed0f1888784e1043bd88f4afd2b7cddde9'
          assert data['source_manifest_sha256'] == '3db3284b37d4ddd7dfec03ab9fd6c0aa6193d59c0cb887fcb773927eaa13e3ac'
          assert data['selected_step'] == 1024
          assert data['learned_parameter_count'] == 19649
          assert data['checkpoint_tensor_count'] == 12
          assert sum(row['parameters'] for row in data['checkpoint_tensor_ledger']) == 19649

          training = data['training']
          assert training['worlds'] == 262144
          assert training['optimizer_steps'] == 1024
          assert training['telemetry_rows'] == 1024
          assert training['world_batch_size'] == 256
          assert training['total_supervised_edges'] == 23767648
          assert training['checkpoint_steps'] == [256, 512, 768, 1024]
          assert training['coverage'] == {
              'inbox_codes': 256,
              'target_carriers': 16,
              'target_codes': 256,
              'target_symbols': 16,
          }

          validation = data['validation']
          assert validation['world_index_start'] == 512
          assert validation['world_index_end_inclusive'] == 1023
          assert validation['worlds_per_condition'] == 512
          assert validation['disjoint_from_v0_indices_0_through_511'] is True
          assert validation['conditions'] == [[32,4],[64,4],[64,8],[128,4],[128,8],[128,16]]

          candidates = data['candidates']
          assert [row['step'] for row in candidates] == [256, 512, 768, 1024]
          assert [row['admitted'] for row in candidates] == [False, True, True, True]
          assert candidates[0]['minimum_target_accuracy'] == 0.240234375
          for row in candidates[1:]:
              assert row['mean_target_accuracy'] == 1.0
              assert row['minimum_target_accuracy'] == 1.0
              assert row['exact_message_accuracy'] == 1.0
              assert row['carrier_accuracy'] == 1.0
              assert row['symbol_accuracy'] == 1.0
          assert candidates[3]['validation_loss'] < candidates[2]['validation_loss'] < candidates[1]['validation_loss']
          assert data['selected_metrics']['step'] == 1024
          assert data['selected_metrics']['admitted'] is True
          assert all(row['target_accuracy'] == 1.0 for row in data['selected_metrics']['conditions'])

          closed = data['closed_boundaries']
          assert closed == {
              'reference_inference_performed': False,
              'reference_model_weights_loaded': False,
              'reference_tokenizer_loaded': False,
              'scientific_test_worlds_generated': False,
              'seeds_1_and_2_executed': False,
          }
          assert all(data['artifact_inspection'].values())

          manifest_bytes = manifest_path.read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == data['source_manifest_sha256']
          manifest_text = manifest_bytes.decode('ascii')
          assert manifest_text.count('\r\n') == 8
          assert '1e42eb53f6446e4eeb66bbb2090c8dad7551e2098b76f289b43cf0c05975e829  training/gate8-factorized-organism-training-result.json' in manifest_text
          assert manifest_text.count('3005369a4830c12baee8ffa7fedc1bed0f1888784e1043bd88f4afd2b7cddde9') == 2
          PY

      - name: Verify result-only closed boundary
        run: |
          files='experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_result_v1.json experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_result_v1.md experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_manifest_v1.sha256'
          ! find experiments/population_compute_scaling_v0 -maxdepth 1 -name '*seed0*result*v1*.pt' -print -quit | grep .
          ! grep --line-number -E 'generate_gate8_world\(|torch\.optim|optimizer\.step\(|backward\(|torch\.save\(|AutoModel|AutoTokenizer|from_pretrained|snapshot_download|model\.safetensors' $files

      - name: Prove exact four-file result slice
        run: |
          changed="$(git diff --name-only 1b449f0ed4998e9246c86803d4473d0ac9ebdac3...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/gate8-factorized-message-training-seed0-result-v1-ci.yml' \
            'experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_manifest_v1.sha256' \
            'experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_result_v1.json' \
            'experiments/population_compute_scaling_v0/gate8_factorized_message_training_seed0_result_v1.md' | sort)"
          test "$changed" = "$expected"
