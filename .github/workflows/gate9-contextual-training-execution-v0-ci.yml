name: Gate9 contextual training execution qualification

on:
  pull_request:
    branches:
      - agent/gate9-contextual-training-protocol-v0
    paths:
      - .github/workflows/gate9-contextual-training-execution-v0-ci.yml
      - ai_hypothesis/population_compute/gate9_contextual_training_data.py
      - ai_hypothesis/population_compute/gate9_contextual_training_runtime.py
      - experiments/population_compute_scaling_v0/gate9_contextual_training_execution_v0.md
      - scripts/run_gate9_contextual_training.py
      - scripts/run_gate9_contextual_training.ps1
      - tests/test_gate9_contextual_training_execution.py

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install exact contract runtime
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python -m pip install --disable-pip-version-check \
            torch==2.9.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Compile execution surface and regressions
        run: |
          python -m py_compile \
            ai_hypothesis/population_compute/gate9_contextual_training_data.py \
            ai_hypothesis/population_compute/gate9_contextual_training_runtime.py \
            scripts/run_gate9_contextual_training.py \
            tests/test_gate9_contextual_training_execution.py

      - name: Run training-execution contract regressions
        run: |
          python -m unittest tests/test_gate9_contextual_training_execution.py -v

      - name: Verify exact execution bindings without training
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys
          import torch
          import numpy

          assert torch.__version__.startswith("2.9.1"), torch.__version__
          assert numpy.__version__ == "2.3.5", numpy.__version__

          runtime_path = pathlib.Path(
              "ai_hypothesis/population_compute/"
              "gate9_contextual_training_runtime.py"
          )
          spec = importlib.util.spec_from_file_location(
              "gate9_training_execution_ci", runtime_path
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          assert module.GATE9_TRAINING_EXECUTION_VERSION == (
              "gate9-contextual-training-execution-v0"
          )
          assert module.GATE9_TRAINING_EXECUTION_BRANCH == (
              "agent/gate9-contextual-training-execution-v0"
          )
          assert module.GATE9_TRAINING_PROTOCOL_HEAD == (
              "1228c19cbf85da4ab738c3355c58f946cd6a965c"
          )
          assert module.protocol.GATE9_ARCHITECTURE_HEAD == (
              "c689cc3f38f6f6f642916ee1a702d7de7bd0e43b"
          )
          assert module.protocol.GATE9_TRAIN_STEPS == 512
          assert module.protocol.GATE9_TRAIN_EPISODES == 262_144
          assert module.protocol.GATE9_VALIDATION_EPISODES == 32_768
          assert module.protocol.GATE9_CHECKPOINT_STEP == 512
          assert module.data.GATE9_VALIDATION_SHUFFLE_OFFSET != 0
          assert (
              module.data.GATE9_VALIDATION_SHUFFLE_OFFSET
              < module.protocol.GATE9_VALIDATION_EPISODES
          )
          print({
              "execution_version": module.GATE9_TRAINING_EXECUTION_VERSION,
              "training_protocol_head": module.GATE9_TRAINING_PROTOCOL_HEAD,
              "architecture_head": module.protocol.GATE9_ARCHITECTURE_HEAD,
              "validation_shuffle_offset": (
                  module.data.GATE9_VALIDATION_SHUFFLE_OFFSET
              ),
              "full_training_executed": False,
          })
          PY

      - name: Keep scientific namespaces and full training closed in CI
        run: |
          python - <<'PY'
          import pathlib

          data_source = pathlib.Path(
              "ai_hypothesis/population_compute/"
              "gate9_contextual_training_data.py"
          ).read_text(encoding="utf-8")
          runtime_source = pathlib.Path(
              "ai_hypothesis/population_compute/"
              "gate9_contextual_training_runtime.py"
          ).read_text(encoding="utf-8")
          workflow = pathlib.Path(
              ".github/workflows/"
              "gate9-contextual-training-execution-v0-ci.yml"
          ).read_text(encoding="utf-8")

          for token in (
              "graph_test_operator_counter(",
              "generate_gate9_test_world(",
              "test_assignment_key",
              "classify_gate9(",
          ):
              assert token not in data_source, token
              assert token not in runtime_source, token

          forbidden_ci = (
              "run_gate9_contextual_training.py" + " --seed",
              "run_gate9_contextual_training.ps1" + " -Seed",
              "262,144-episode job",
          )
          for token in forbidden_ci[:2]:
              assert token not in workflow, token
          PY

      - name: Prove exact seven-file execution slice
        run: |
          python - <<'PY'
          import subprocess

          base = "1228c19cbf85da4ab738c3355c58f946cd6a965c"
          expected = {
              ".github/workflows/gate9-contextual-training-execution-v0-ci.yml",
              "ai_hypothesis/population_compute/gate9_contextual_training_data.py",
              "ai_hypothesis/population_compute/gate9_contextual_training_runtime.py",
              "experiments/population_compute_scaling_v0/gate9_contextual_training_execution_v0.md",
              "scripts/run_gate9_contextual_training.py",
              "scripts/run_gate9_contextual_training.ps1",
              "tests/test_gate9_contextual_training_execution.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", base, "HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed == expected, (changed, expected)
          PY

  windows-wrapper-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smoke wrapper before imports CUDA output or optimizer
        shell: pwsh
        env:
          GATE9_CONTEXTUAL_TRAINING_WRAPPER_SMOKE: "1"
        run: |
          $output = Join-Path $env:RUNNER_TEMP "not-created-gate9-training"
          .\scripts\run_gate9_contextual_training.ps1 `
              -Seed 0 `
              -OutputRoot $output
          if (Test-Path -LiteralPath $output) {
              throw "Gate9 training wrapper smoke created an output directory."
          }
