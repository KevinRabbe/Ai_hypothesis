name: Large-scope benchmark qualification

on:
  push:
    branches:
      - agent/large-scope-benchmark-ci-v0
      - agent/large-scope-result-audit-v0
    paths:
      - 'ai_hypothesis/large_scope/**'
      - 'tests/test_large_scope_*.py'
      - '.github/workflows/large-scope-benchmark-ci.yml'
  pull_request:
    paths:
      - 'ai_hypothesis/large_scope/**'
      - 'tests/test_large_scope_*.py'
      - '.github/workflows/large-scope-benchmark-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Compile large-scope modules
        run: |
          python -m compileall -q ai_hypothesis/large_scope

      - name: Run large-scope mechanics, bridge, and result-audit regressions
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests/test_large_scope_relevance.py \
            tests/test_large_scope_evaluate.py \
            tests/test_large_scope_metrics.py \
            tests/test_large_scope_paired_metrics.py \
            tests/test_large_scope_runtime_bridge.py \
            tests/test_large_scope_run_relevance.py \
            tests/test_large_scope_result_audit.py \
            > large-scope-tests.log 2>&1
          echo $? > large-scope-tests.status
          exit 0

      - name: Upload large-scope qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-scope-qualification-log
          path: |
            large-scope-tests.log
            large-scope-tests.status
          if-no-files-found: error

      - name: Enforce large-scope qualification
        shell: bash
        run: |
          status="$(cat large-scope-tests.status)"
          if [ "$status" -ne 0 ]; then
            echo "Large-scope regression suite failed with exit $status"
            exit "$status"
          fi
