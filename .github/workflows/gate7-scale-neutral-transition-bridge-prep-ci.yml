name: Gate7 scale-neutral transition bridge qualification

on:
  push:
    branches:
      - agent/gate7-scale-neutral-transition-bridge-prep-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate7_scale_neutral_transition_bridge_prep.py'
      - 'ai_hypothesis/population_compute/gate7_scale_neutral_transition_bridge.py'
      - 'ai_hypothesis/population_compute/run_gate7_scale_neutral_transition_bridge.py'
      - 'ai_hypothesis/population_compute/analyze_gate7_scale_neutral_transition_bridge.py'
      - 'scripts/run_gate7_scale_neutral_transition_bridge.ps1'
      - 'tests/test_gate7_scale_neutral_transition_bridge_prep.py'
      - 'tests/test_gate7_scale_neutral_transition_bridge.py'
      - 'experiments/population_compute_scaling_v0/gate7_scale_neutral_scorer_transition_protocol.md'
      - '.github/workflows/gate7-scale-neutral-transition-bridge-prep-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Compile transition bridge modules
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate7_scale_neutral_transition_bridge_prep.py \
            ai_hypothesis/population_compute/gate7_scale_neutral_transition_bridge.py \
            ai_hypothesis/population_compute/run_gate7_scale_neutral_transition_bridge.py \
            ai_hypothesis/population_compute/analyze_gate7_scale_neutral_transition_bridge.py

      - name: Run data-blind bridge regressions
        run: |
          python -m unittest \
            tests/test_gate7_scale_neutral_transition_bridge_prep.py \
            tests/test_gate7_scale_neutral_transition_bridge.py

      - name: Verify exact checkpoint bindings and frozen bridge boundaries
        shell: bash
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute import gate7_scale_neutral_transition_bridge as bound
          from ai_hypothesis.population_compute import gate7_scale_neutral_transition_bridge_prep as bridge
          assert bridge.GATE7_TRANSITION_BRIDGE_PREPARATION_ONLY is True
          assert bound.GATE7_TRANSITION_BRIDGE_EXECUTION_ADMITTED is True
          assert bound.GATE7_TRANSITION_BRIDGE_HIGH_SCALE_OPENED is False
          assert bound.GATE7_TRANSITION_TRAINING_GIT_HEAD == "07307650b2bbbfaa09b80e40caa4419ecdda2947"
          assert bridge.GATE7_TRANSITION_BRIDGE_WORLD_COUNT == 256
          assert bridge.GATE7_TRANSITION_BRIDGE_BATCH_SIZE == 64
          assert bridge.GATE7_TRANSITION_BRIDGE_BOOTSTRAP_SAMPLES == 2000
          assert bridge.GATE7_TRANSITION_BRIDGE_DEPTH == 10
          assert bridge.GATE7_TRANSITION_BRIDGE_POPULATIONS == (128, 256)
          assert bridge.GATE7_TRANSITION_BRIDGE_NONINFERIORITY_MARGIN == 0.05
          assert [bound.GATE7_TRANSITION_BRIDGE_EXPECTED[i]["sha256"] for i in (0, 1, 2)] == [
              "be1b18e22a1f713b48de8934aca1c0302f1255342684158c6ae31a7c3618a719",
              "a9b712736f440168ccd86ee070b8d301be0eb834b9d17418d40c0175207cadfb",
              "cd7869511d07679cb1ad430743cad031299a575413e8a853ef9116d545c7480a",
          ]
          PY

      - name: Verify CI never instantiates fresh bridge worlds
        shell: bash
        run: |
          ! grep --line-number 'generate_gate7_transition_bridge_world(' \
            tests/test_gate7_scale_neutral_transition_bridge_prep.py \
            tests/test_gate7_scale_neutral_transition_bridge.py
          ! grep --line-number 'run_gate7_scale_neutral_transition_bridge(' \
            .github/workflows/gate7-scale-neutral-transition-bridge-prep-ci.yml

      - name: Verify high-scale Gate7 execution remains locked
        shell: bash
        run: |
          test -f ai_hypothesis/population_compute/run_gate7_scale_neutral_transition_bridge.py
          test -f scripts/run_gate7_scale_neutral_transition_bridge.ps1
          test ! -f experiments/population_compute_scaling_v0/gate7_scale_neutral_transition_bridge_result.md
          test ! -f ai_hypothesis/population_compute/run_gate7.py
          test ! -f scripts/run_gate7.ps1

  windows-wrapper-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smoke PowerShell wrapper before checkpoint or CUDA execution
        shell: pwsh
        env:
          GATE7_TRANSITION_BRIDGE_WRAPPER_SMOKE: '1'
        run: |
          $output = Join-Path $env:RUNNER_TEMP "gate7-transition-bridge-wrapper-smoke-${{ github.run_id }}"
          .\scripts\run_gate7_scale_neutral_transition_bridge.ps1 `
            -IdleMachineAttested `
            -OutputRoot $output
          if (-not (Test-Path -LiteralPath (Join-Path $output "run-config.json") -PathType Leaf)) {
              throw "Gate-7 transition bridge wrapper smoke did not write run-config.json"
          }
          if (Test-Path -LiteralPath (Join-Path $output "science")) {
              throw "Gate-7 transition bridge wrapper smoke reached scientific execution"
          }
