name: Gate7 information-ceiling precision confirmation execution qualification

on:
  push:
    branches:
      - agent/gate7-information-ceiling-precision-confirmation-execution-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation.py'
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_worlds.py'
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_rank.py'
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_statistics.py'
      - 'ai_hypothesis/population_compute/run_gate7_information_ceiling_precision_confirmation.py'
      - 'ai_hypothesis/population_compute/analyze_gate7_information_ceiling_precision_confirmation.py'
      - 'scripts/run_gate7_information_ceiling_precision_confirmation.ps1'
      - 'tests/test_gate7_information_ceiling_precision_confirmation_execution.py'
      - '.github/workflows/gate7-information-ceiling-precision-confirmation-execution-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch and NumPy for import boundary
        run: |
          python -m pip install --quiet numpy
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch

      - name: Compile precision execution and independent auditor
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_worlds.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_rank.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_statistics.py \
            ai_hypothesis/population_compute/run_gate7_information_ceiling_precision_confirmation.py \
            ai_hypothesis/population_compute/analyze_gate7_information_ceiling_precision_confirmation.py

      - name: Run non-exposure precision execution regressions
        run: |
          python -m unittest tests/test_gate7_information_ceiling_precision_confirmation_execution.py

      - name: Verify exact frozen precision bindings
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute import gate7_information_ceiling_precision_confirmation as e

          assert e.GATE7_PRECISION_EXECUTION_ADMITTED is True
          assert e.GATE7_PRECISION_PROTOCOL_HEAD == '8d7865ab01b4b04b875ed2ca627b68a6c33c81f7'
          assert e.GATE7_PRECISION_BASE_RESULT_HEAD == '4eb3e50a3ca7898ff81aebebddb7b049ff855df3'
          assert e.GATE7_PRECISION_POPULATIONS == (16384, 32768, 65536, 131072)
          assert e.GATE7_PRECISION_CHECKPOINT_INDICES == (0, 1, 2)
          assert e.GATE7_PRECISION_RANKERS == (
              'learned_score_rank',
              'bayes_hint_likelihood_rank',
              'public_hash_rank',
          )
          assert e.GATE7_PRECISION_ATTEMPT_LADDER == (
              1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024
          )
          assert e.GATE7_PRECISION_PRIMARY_ATTEMPTS == 128
          assert e.GATE7_PRECISION_WORLD_COUNT == 2048
          assert e.GATE7_PRECISION_EVALUATION_BATCH_SIZE == 64
          assert e.GATE7_PRECISION_PHYSICAL_BATCH_COUNT == 32
          assert e.GATE7_PRECISION_BOOTSTRAP_SAMPLES == 20_000
          assert e.GATE7_PRECISION_LEARNED_PARAMETER_COUNT == 19_649
          PY

      - name: Prove CI never invokes scientific worlds or runner
        shell: bash
        run: |
          test_file=tests/test_gate7_information_ceiling_precision_confirmation_execution.py
          workflow=.github/workflows/gate7-information-ceiling-precision-confirmation-execution-ci.yml
          ! grep --line-number -E '^[[:space:]]*(run_gate7_information_ceiling_precision_confirmation|generate_gate7_precision_world)\(' "$test_file"
          ! grep --line-number -E '^[[:space:]]*python -m ai_hypothesis\.population_compute\.run_gate7_information_ceiling_precision_confirmation([[:space:]]|$)' "$workflow"
          ! grep --line-number -E '^[[:space:]]*--transition-checkpoint0([[:space:]]|$)' "$workflow"
          ! grep --line-number -E '^[[:space:]]*if .*cuda\.is_available' "$workflow"

      - name: Verify independent auditor boundary
        shell: bash
        run: |
          auditor=ai_hypothesis/population_compute/analyze_gate7_information_ceiling_precision_confirmation.py
          ! grep --line-number '^import torch' "$auditor"
          ! grep --line-number '^from torch' "$auditor"
          ! grep --line-number 'gate7_information_ceiling_precision_confirmation import' "$auditor"
          ! grep --line-number 'gate7_information_ceiling_precision_confirmation_rank import' "$auditor"
          ! grep --line-number 'gate7_information_ceiling_precision_confirmation_statistics import' "$auditor"

      - name: Verify no training communication or rescue intervention
        shell: bash
        run: |
          runner=ai_hypothesis/population_compute/run_gate7_information_ceiling_precision_confirmation.py
          ranker=ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_rank.py
          ! grep --line-number -E 'optimizer|backward\(|\.train\(' "$runner" "$ranker"
          ! grep --line-number -E 'CommunicationMode|RelayPopulationModel|message_content|communication_mode' "$runner" "$ranker"
          grep -F '"communication_intervention_performed": False' "$runner"
          grep -F '"prior_worlds_reused": False' "$runner"
          grep -F '"adaptive_attempt_exposure_performed": False' "$runner"

  windows-wrapper-smoke:
    if: github.head_ref == 'agent/gate7-information-ceiling-precision-confirmation-execution-v0' || github.ref == 'refs/heads/agent/gate7-information-ceiling-precision-confirmation-execution-v0'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Smoke PowerShell wrapper before checkpoints CUDA or worlds
        shell: pwsh
        env:
          GATE7_PRECISION_CONFIRMATION_WRAPPER_SMOKE: '1'
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'gate7-precision-confirmation-wrapper-smoke'
          if (Test-Path -LiteralPath $output) {
              Remove-Item -LiteralPath $output -Recurse -Force
          }
          .\scripts\run_gate7_information_ceiling_precision_confirmation.ps1 `
              -IdleMachineAttested `
              -OutputRoot $output
          if (Test-Path -LiteralPath (Join-Path $output 'science')) {
              throw 'Precision-confirmation wrapper smoke reached the scientific output boundary.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $output 'run-config.json') -PathType Leaf)) {
              throw 'Precision-confirmation wrapper smoke did not preserve run provenance.'
          }
