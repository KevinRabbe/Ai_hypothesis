name: Gate9 failure-decomposition stage1 execution qualification

on:
  pull_request:
    branches:
      - agent/gate9-contextual-failure-decomposition-protocol-v0
      - agent/gate9-contextual-failure-decomposition-stage1-execution-v0
    paths:
      - .github/workflows/gate9-contextual-failure-decomposition-stage1-execution-v0-ci.yml
      - ai_hypothesis/population_compute/gate9_contextual_failure_decomposition_stage1_runtime.py
      - experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_execution_v0.md
      - experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.json
      - experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.md
      - experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_source_manifest_v0.sha256
      - scripts/run_gate9_contextual_failure_decomposition_stage1.py
      - scripts/run_gate9_contextual_failure_decomposition_stage1.ps1
      - tests/test_gate9_contextual_failure_decomposition_stage1_execution.py

permissions:
  contents: read

jobs:
  execution-contract:
    if: github.base_ref == 'agent/gate9-contextual-failure-decomposition-protocol-v0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install exact CPU contract runtime
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python -m pip install --disable-pip-version-check \
            torch==2.9.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and run stage1 contract regressions
        run: |
          python -m py_compile \
            ai_hypothesis/population_compute/gate9_contextual_failure_decomposition_stage1_runtime.py \
            scripts/run_gate9_contextual_failure_decomposition_stage1.py \
            tests/test_gate9_contextual_failure_decomposition_stage1_execution.py
          python -m unittest \
            tests/test_gate9_contextual_failure_decomposition_stage1_execution.py -v

      - name: Verify exact execution bindings without full training
        run: |
          git merge-base --is-ancestor \
            8deca15aef78d8636b07570aff044f9b7ae31928 HEAD
          git fetch origin \
            agent/gate9-contextual-worker-architecture-v0
          architecture_head="$(
            git rev-parse \
              origin/agent/gate9-contextual-worker-architecture-v0
          )"
          test "${#architecture_head}" -eq 40
          case "$architecture_head" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          export GATE9D_EXPECTED_ARCHITECTURE_HEAD="$architecture_head"

          python - <<'PY'
          import importlib.util
          import os
          import pathlib
          import sys
          import torch
          import numpy

          assert str(torch.__version__).startswith("2.9.1")
          assert numpy.__version__ == "2.3.5"
          path = pathlib.Path(
              "ai_hypothesis/population_compute/"
              "gate9_contextual_failure_decomposition_stage1_runtime.py"
          )
          spec = importlib.util.spec_from_file_location("gate9d_stage1_ci", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          assert module.GATE9D_STAGE1_EXECUTION_VERSION == (
              "gate9-contextual-failure-decomposition-stage1-execution-v0"
          )
          assert module.GATE9D_STAGE1_EXECUTION_BRANCH == (
              "agent/gate9-contextual-failure-decomposition-"
              "stage1-execution-v0"
          )
          assert module.GATE9D_PROTOCOL_HEAD == (
              "8deca15aef78d8636b07570aff044f9b7ae31928"
          )
          assert module.protocol.GATE9D_ARCHITECTURE_HEAD == os.environ[
              "GATE9D_EXPECTED_ARCHITECTURE_HEAD"
          ]
          assert module.GATE9D_STAGE_NAME == "single_operator_query_fit"
          assert module.GATE9D_STAGE_INDEX == 0
          assert module.GATE9D_TRAIN_STEPS == 1024
          assert module.GATE9D_BATCH_SIZE == 247
          assert module.GATE9D_TRAIN_EXAMPLES == 247
          assert module.GATE9D_STAGE.order == 1
          assert not module.GATE9D_STAGE.requires_context_causality
          assert not module.GATE9D_STAGE.unseen_operator_evaluation
          material = module.stage1_material()
          assert len(material["queries"]) == 247
          assert material["targets"] == material["oracle_targets"]
          assert len(module.stage1_dataset_sha256(material)) == 64
          print({
              "stage": module.GATE9D_STAGE_NAME,
              "train_steps": module.GATE9D_TRAIN_STEPS,
              "unique_examples": module.GATE9D_TRAIN_EXAMPLES,
              "full_training_executed": False,
          })
          PY

      - name: Prove exact six-file execution slice
        run: |
          base=8deca15aef78d8636b07570aff044f9b7ae31928
          mapfile -t changed < <(git diff --name-only "$base...HEAD" | sort)
          expected=(
            ".github/workflows/gate9-contextual-failure-decomposition-stage1-execution-v0-ci.yml"
            "ai_hypothesis/population_compute/gate9_contextual_failure_decomposition_stage1_runtime.py"
            "experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_execution_v0.md"
            "scripts/run_gate9_contextual_failure_decomposition_stage1.ps1"
            "scripts/run_gate9_contextual_failure_decomposition_stage1.py"
            "tests/test_gate9_contextual_failure_decomposition_stage1_execution.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Keep later stages and Gate9 v0 science closed
        run: |
          python - <<'PY'
          import pathlib

          runtime = pathlib.Path(
              "ai_hypothesis/population_compute/"
              "gate9_contextual_failure_decomposition_stage1_runtime.py"
          ).read_text(encoding="utf-8")
          cli = pathlib.Path(
              "scripts/run_gate9_contextual_failure_decomposition_stage1.py"
          ).read_text(encoding="utf-8")
          wrapper = pathlib.Path(
              "scripts/run_gate9_contextual_failure_decomposition_stage1.ps1"
          ).read_bytes()
          wrapper.decode("ascii")
          for token in (
              "GATE9D_COLLISION_OPERATOR_COUNTERS",
              "GATE9D_HELD_IN_OPERATOR_RANGE",
              "GATE9D_UNSEEN_TRAIN_OPERATOR_RANGE",
              "GATE9D_UNSEEN_EVAL_OPERATOR_RANGE",
              "generate_gate9_test_world(",
              "scientific_assignment_key",
              "classify_diagnostic(",
          ):
              assert token not in runtime, token
              assert token not in cli, token
          assert "GATE9D_STAGE_INDEX = 0" in runtime
          PY
          ! git diff --name-only \
            8deca15aef78d8636b07570aff044f9b7ae31928...HEAD |
            grep -E '\.(pt|bin|safetensors|sqlite3|jsonl)$'

  windows-wrapper-smoke:
    if: github.base_ref == 'agent/gate9-contextual-failure-decomposition-protocol-v0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smoke ASCII wrapper before imports CUDA output or optimizer
        shell: powershell
        env:
          GATE9D_STAGE1_WRAPPER_SMOKE: "1"
        run: |
          if ($PSVersionTable.PSEdition -ne "Desktop") {
              throw "Expected Windows PowerShell Desktop edition."
          }
          $output = Join-Path $env:RUNNER_TEMP "not-created-gate9d-stage1"
          .\scripts\run_gate9_contextual_failure_decomposition_stage1.ps1 `
              -SeedIndex 0 `
              -OutputRoot $output
          if (Test-Path -LiteralPath $output) {
              throw "Gate9D stage-1 wrapper smoke created output."
          }

  seed0-result-only:
    if: github.base_ref == 'agent/gate9-contextual-failure-decomposition-stage1-execution-v0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Verify immutable seed0 result and source evidence
        run: |
          result=experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.json
          manifest=experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_source_manifest_v0.sha256
          test "$(sha256sum "$result" | cut -d' ' -f1)" = \
            20188b8d70637b1599f5f603d700512c3d22d50fc5c3d0d1d0a5fa72843c0a80
          test "$(git hash-object "$result")" = \
            de694a4610e63b1bea900b6babd0778b15780409
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = \
            8074a4224c4a51f38f869944f57fd0c350a0f164b50627a2f9173352e170dc0e
          git merge-base --is-ancestor \
            2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c HEAD
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path("experiments/population_compute_scaling_v0")
          result_path = root / (
              "gate9_contextual_failure_decomposition_stage1_seed0_result_v0.json"
          )
          manifest_path = root / (
              "gate9_contextual_failure_decomposition_stage1_seed0_source_manifest_v0.sha256"
          )
          result = json.loads(result_path.read_text(encoding="utf-8"))

          assert result["experiment_version"] == (
              "gate9-contextual-failure-decomposition-stage1-seed0-result-v0"
          )
          assert result["scientific_status"] == (
              "G9D_STAGE1_SEED0_FAILURE_RECORDED"
          )
          assert result["seed_index"] == 0
          assert result["seed_outcome"] == "G9D_STAGE1_SEED_FAILED"
          assert result["role"] == "first_ordered_seed_result_only"
          assert result["stack_identity"] == {
              "architecture_head": "c689cc3f38f6f6f642916ee1a702d7de7bd0e43b",
              "execution_head": "2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c",
              "operator_contract_head": "be6451e1af82b18749bd0313a9c02ca62c4eee5c",
              "protocol_head": "8deca15aef78d8636b07570aff044f9b7ae31928",
          }
          assert result["operator"] == {
              "counter": 72057594037927936,
              "dataset_sha256": "37b4aafb3e184eaa2e8096b649457134bd5025f297912c26ed34100b76a3ff0f",
              "key": 14550454351299327585,
              "non_support_query_count": 247,
          }
          assert result["training"] == {
              "batch_size": 247,
              "examples_seen": 252928,
              "final_loss": 0.36635908484458923,
              "minimum_loss": 0.36635908484458923,
              "minimum_loss_step": 1024,
              "rows": 1024,
              "steps": 1024,
              "unique_examples": 247,
          }
          assert result["evaluation"] == {
              "bit_accuracy": 0.8456477732793523,
              "bit_correct": 1671,
              "bit_total": 1976,
              "exact_accuracy": 0.21052631578947367,
              "full_correct": 52,
              "oracle_accuracy": 1.0,
              "oracle_correct": 247,
              "query_only_accuracy": 0.0,
              "query_only_correct": 0,
              "rows": 247,
              "stage_passes": False,
          }
          assert result["diagnostic_consequence"] == {
              "all_three_initialization_seeds_required_to_advance": True,
              "remaining_seed_role": "replication_and_mixed-outcome_resolution_only",
              "stage1_seed0_independently_failed": True,
              "stage2_advancement_allowed": False,
              "terminal_outcomes_still_possible": [
                  "G9D_BASIC_QUERY_MAPPING_FAILED",
                  "G9D_DIAGNOSTIC_INCONCLUSIVE",
              ],
          }
          assert result["closed_boundaries"] == {
              "checkpoint_selection_performed": False,
              "diagnostic_classification_performed": False,
              "gate9_v0_result_mutation_performed": False,
              "later_diagnostic_stage_execution_performed": False,
              "population_execution_performed": False,
              "retraining_performed": False,
              "scientific_execution_performed": False,
              "scientific_test_generation_performed": False,
              "training_performed_in_result_slice": False,
          }
          assert result["independent_audit"] == {
              "checkpoint_all_finite_float32": True,
              "checkpoint_loaded_weights_only": True,
              "checkpoint_parameter_count_verified": True,
              "checkpoint_schema_verified": True,
              "evaluation_ledger_reconstructed": True,
              "git_head_verified": True,
              "git_status_empty_hash_verified_from_terminal": True,
              "manifest_paths_sorted_and_unique": True,
              "manifest_sha256_verified": True,
              "run_config_verified": True,
              "source_artifact_modified": False,
              "summary_evidence_reconciled": True,
              "training_ledger_reconstructed": True,
              "uploaded_artifact_hashes_match_manifest": True,
          }
          assert result["source_artifact_sha256"] == {
              "git-head.txt": "39aeac89e593584f77d1365c779f2eb2e5317e07729124026158f64c89abd940",
              "git-status.txt": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
              "manifest.sha256": "8074a4224c4a51f38f869944f57fd0c350a0f164b50627a2f9173352e170dc0e",
              "run-config.json": "1673b768313b748bd00339247acdab3db37326b7139a36f3a9cdce0ae5824000",
              "seed-0/evaluation-per-episode.jsonl": "98623f9c37f74137722f6d45ef37536064017a429246d45a3820aaee2c9785e1",
              "seed-0/selected-checkpoint.pt": "3c2c2bac4036ccd8bc45c5aca8c28fe3b2e470902489907e224ba602bafaa93f",
              "seed-0/summary.json": "a306fcb06bbd6965553dd8406ffd0aad41259bab45149d39a67c77cab7d143c8",
              "seed-0/train-steps.jsonl": "b74cf27618985dd690c2d50555cf478e6dd06fe5907cbd55e9de7fdf448fcc9c",
          }

          expected_manifest = """39aeac89e593584f77d1365c779f2eb2e5317e07729124026158f64c89abd940  git-head.txt
e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  git-status.txt
1673b768313b748bd00339247acdab3db37326b7139a36f3a9cdce0ae5824000  run-config.json
98623f9c37f74137722f6d45ef37536064017a429246d45a3820aaee2c9785e1  seed-0/evaluation-per-episode.jsonl
3c2c2bac4036ccd8bc45c5aca8c28fe3b2e470902489907e224ba602bafaa93f  seed-0/selected-checkpoint.pt
a306fcb06bbd6965553dd8406ffd0aad41259bab45149d39a67c77cab7d143c8  seed-0/summary.json
b74cf27618985dd690c2d50555cf478e6dd06fe5907cbd55e9de7fdf448fcc9c  seed-0/train-steps.jsonl
"""
          assert manifest_path.read_text(encoding="ascii") == expected_manifest
          assert hashlib.sha256(expected_manifest.encode("ascii")).hexdigest() == (
              "8074a4224c4a51f38f869944f57fd0c350a0f164b50627a2f9173352e170dc0e"
          )
          PY

      - name: Prove exact four-file result-only slice
        run: |
          base=2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c
          mapfile -t changed < <(git diff --name-only "$base...HEAD" | sort)
          expected=(
            ".github/workflows/gate9-contextual-failure-decomposition-stage1-execution-v0-ci.yml"
            "experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.json"
            "experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.md"
            "experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_source_manifest_v0.sha256"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Keep executable artifacts out of the result slice
        run: |
          ! git diff --name-only \
            2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c...HEAD |
            grep -E '\.(pt|bin|safetensors|sqlite3|jsonl|py|ps1)$'
