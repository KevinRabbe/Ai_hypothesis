name: Population Intelligence 300M Benchmark Program CI

on:
  pull_request:
    paths:
      - ai_hypothesis/population_language/intelligence_300m_benchmark_program.py
      - docs/population_intelligence_300m_benchmark_program.md
      - tests/test_population_intelligence_300m_benchmark_program.py
      - .github/workflows/population-intelligence-300m-benchmark-program-ci.yml
  push:
    paths:
      - ai_hypothesis/population_language/intelligence_300m_benchmark_program.py
      - docs/population_intelligence_300m_benchmark_program.md
      - tests/test_population_intelligence_300m_benchmark_program.py
      - .github/workflows/population-intelligence-300m-benchmark-program-ci.yml

permissions:
  contents: read

jobs:
  benchmark-program:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - name: Compile benchmark-program slice
        run: >-
          python -m py_compile
          ai_hypothesis/population_language/intelligence_300m_benchmark_program.py
          tests/test_population_intelligence_300m_benchmark_program.py
      - name: Run charter, mechanism, and benchmark contracts
        run: >-
          python -m unittest
          tests.test_population_intelligence_300m_charter
          tests.test_population_intelligence_300m_mechanism_program
          tests.test_population_intelligence_300m_benchmark_program
          -v
      - name: Verify locked benchmark-program constants
        run: |
          python - <<'PY'
          from ai_hypothesis.population_language import intelligence_300m_benchmark_program as program

          snapshot = program.validate_program()
          assert snapshot["valid"] is True
          assert snapshot["minimum_initialization_seeds"] == 3
          assert snapshot["protected_splits"] == ["validation", "test"]
          assert len(snapshot["benchmark_families"]) == 8
          assert len(snapshot["global_result_fields"]) == 25
          print(snapshot["version"])
          PY
      - name: Verify exact four-file scope
        env:
          BASE_HEAD: 9cc8b1b4c1dc4fc95df346ef82b188e276d97fcb
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_HEAD" HEAD)
          expected=(
            .github/workflows/population-intelligence-300m-benchmark-program-ci.yml
            ai_hypothesis/population_language/intelligence_300m_benchmark_program.py
            docs/population_intelligence_300m_benchmark_program.md
            tests/test_population_intelligence_300m_benchmark_program.py
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
