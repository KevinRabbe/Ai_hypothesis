name: Patch relay-v1 provenance

on:
  push:
    branches:
      - agent/population-compute-relay-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/population-compute-relay-v1
      - name: Version relay-v1 experiment and artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_hypothesis/population_compute/relay_experiment.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'from .collective_relay import (\n    RELAY_DIFFICULTIES,',
                  'from .collective_relay import (\n    COLLECTIVE_RELAY_VERSION,\n    RELAY_DIFFICULTIES,',
              ),
              (
                  'RELAY_EXPERIMENT_VERSION = "population-compute-relay-training-v0"',
                  'RELAY_EXPERIMENT_VERSION = "population-compute-relay-training-v1"',
              ),
              (
                  '            "experiment_version": self.experiment_version,\n            "evaluation_split": self.evaluation_split,',
                  '            "experiment_version": self.experiment_version,\n            "benchmark_version": COLLECTIVE_RELAY_VERSION,\n            "evaluation_split": self.evaluation_split,',
              ),
              (
                  '        "experiment_version": RELAY_EXPERIMENT_VERSION,\n        "training_seed": training.training_seed,',
                  '        "experiment_version": RELAY_EXPERIMENT_VERSION,\n        "benchmark_version": COLLECTIVE_RELAY_VERSION,\n        "training_seed": training.training_seed,',
              ),
              (
                  '    if payload.get("experiment_version") != RELAY_EXPERIMENT_VERSION:\n        raise ValueError("unexpected relay checkpoint experiment version")\n    config_data = payload.get("training_config", {}).get("model")',
                  '    if payload.get("experiment_version") != RELAY_EXPERIMENT_VERSION:\n        raise ValueError("unexpected relay checkpoint experiment version")\n    if payload.get("benchmark_version") != COLLECTIVE_RELAY_VERSION:\n        raise ValueError("unexpected relay checkpoint benchmark version")\n    config_data = payload.get("training_config", {}).get("model")',
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise RuntimeError(f'expected relay_experiment target not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          doc = Path('experiments/population_compute_scaling_v0/README.md')
          content = doc.read_text(encoding='utf-8')
          marker = '# Population Compute Scaling Gate v0\n'
          note = '''# Population Compute Scaling Gate v0\n\n> **Benchmark revision note — 2026-07-26:** The first trained development run of `collective-relay-v0` is invalid for architecture interpretation. V0 allowed pre-threshold prefixes to expose the final answer-bearing edge and allowed minimum complete prefixes to contain the only complete chain. Those shortcuts produced large exact-solve rates without valid multi-hop relay. `collective-relay-v1` supersedes v0 before confirmation: it uses structurally matched disjoint target/distractor chains, hides the final target edge before the previous frozen population point, and requires at least one complete distractor chain at every first-complete threshold. V0 artifacts remain benchmark-failure evidence only and must never be mixed with v1 checkpoints/results.\n'''
          if note not in content:
              if marker not in content:
                  raise RuntimeError('population-compute README heading not found')
              content = content.replace(marker, note, 1)
          doc.write_text(content, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_hypothesis/population_compute/relay_experiment.py experiments/population_compute_scaling_v0/README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Version shortcut-resistant relay benchmark [skip ci]"
          git push origin HEAD:agent/population-compute-relay-v1
