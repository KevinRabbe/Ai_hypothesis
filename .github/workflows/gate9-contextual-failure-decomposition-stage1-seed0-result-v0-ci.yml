name: Gate9 failure-decomposition stage1 seed0 result qualification

on:
  pull_request:
    branches:
      - agent/gate9-contextual-failure-decomposition-stage1-execution-v0
    paths:
      - .github/workflows/gate9-contextual-failure-decomposition-stage1-seed0-result-v0-ci.yml
      - experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.json
      - experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.md
      - experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_source_manifest_v0.sha256

permissions:
  contents: read

jobs:
  result-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Verify immutable result and source evidence
        run: |
          result=experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.json
          manifest=experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_source_manifest_v0.sha256
          test "$(sha256sum "$result" | cut -d' ' -f1)" = \
            20188b8d70637b1599f5f603d700512c3d22d50fc5c3d0d1d0a5fa72843c0a80
          test "$(git hash-object "$result")" = \
            de694a4610e63b1bea900b6babd0778b15780409
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = \
            8074a4224c4a51f38f869944f57fd0c350a0f164b50627a2f9173352e170dc0e
          git merge-base --is-ancestor \
            2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c HEAD
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path("experiments/population_compute_scaling_v0")
          result_path = root / (
              "gate9_contextual_failure_decomposition_stage1_seed0_result_v0.json"
          )
          manifest_path = root / (
              "gate9_contextual_failure_decomposition_stage1_seed0_source_manifest_v0.sha256"
          )
          result = json.loads(result_path.read_text(encoding="utf-8"))

          assert result["experiment_version"] == (
              "gate9-contextual-failure-decomposition-stage1-seed0-result-v0"
          )
          assert result["scientific_status"] == (
              "G9D_STAGE1_SEED0_FAILURE_RECORDED"
          )
          assert result["seed_index"] == 0
          assert result["seed_outcome"] == "G9D_STAGE1_SEED_FAILED"
          assert result["role"] == "first_ordered_seed_result_only"

          assert result["stack_identity"] == {
              "architecture_head": "c689cc3f38f6f6f642916ee1a702d7de7bd0e43b",
              "execution_head": "2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c",
              "operator_contract_head": "be6451e1af82b18749bd0313a9c02ca62c4eee5c",
              "protocol_head": "8deca15aef78d8636b07570aff044f9b7ae31928",
          }
          assert result["operator"] == {
              "counter": 72057594037927936,
              "dataset_sha256": "37b4aafb3e184eaa2e8096b649457134bd5025f297912c26ed34100b76a3ff0f",
              "key": 14550454351299327585,
              "non_support_query_count": 247,
          }
          assert result["training"] == {
              "batch_size": 247,
              "examples_seen": 252928,
              "final_loss": 0.36635908484458923,
              "minimum_loss": 0.36635908484458923,
              "minimum_loss_step": 1024,
              "rows": 1024,
              "steps": 1024,
              "unique_examples": 247,
          }
          assert result["evaluation"] == {
              "bit_accuracy": 0.8456477732793523,
              "bit_correct": 1671,
              "bit_total": 1976,
              "exact_accuracy": 0.21052631578947367,
              "full_correct": 52,
              "oracle_accuracy": 1.0,
              "oracle_correct": 247,
              "query_only_accuracy": 0.0,
              "query_only_correct": 0,
              "rows": 247,
              "stage_passes": False,
          }
          assert result["diagnostic_consequence"] == {
              "all_three_initialization_seeds_required_to_advance": True,
              "remaining_seed_role": "replication_and_mixed-outcome_resolution_only",
              "stage1_seed0_independently_failed": True,
              "stage2_advancement_allowed": False,
              "terminal_outcomes_still_possible": [
                  "G9D_BASIC_QUERY_MAPPING_FAILED",
                  "G9D_DIAGNOSTIC_INCONCLUSIVE",
              ],
          }
          expected_audit = {
              "checkpoint_all_finite_float32": True,
              "checkpoint_loaded_weights_only": True,
              "checkpoint_parameter_count_verified": True,
              "checkpoint_schema_verified": True,
              "evaluation_ledger_reconstructed": True,
              "git_head_verified": True,
              "git_status_empty_hash_verified_from_terminal": True,
              "manifest_paths_sorted_and_unique": True,
              "manifest_sha256_verified": True,
              "run_config_verified": True,
              "source_artifact_modified": False,
              "summary_evidence_reconciled": True,
              "training_ledger_reconstructed": True,
              "uploaded_artifact_hashes_match_manifest": True,
          }
          assert result["independent_audit"] == expected_audit
          assert all(
              value is False
              for value in result["closed_boundaries"].values()
          )

          source_hashes = {
              "git-head.txt": "39aeac89e593584f77d1365c779f2eb2e5317e07729124026158f64c89abd940",
              "git-status.txt": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
              "run-config.json": "1673b768313b748bd00339247acdab3db37326b7139a36f3a9cdce0ae5824000",
              "seed-0/evaluation-per-episode.jsonl": "98623f9c37f74137722f6d45ef37536064017a429246d45a3820aaee2c9785e1",
              "seed-0/selected-checkpoint.pt": "3c2c2bac4036ccd8bc45c5aca8c28fe3b2e470902489907e224ba602bafaa93f",
              "seed-0/summary.json": "a306fcb06bbd6965553dd8406ffd0aad41259bab45149d39a67c77cab7d143c8",
              "seed-0/train-steps.jsonl": "b74cf27618985dd690c2d50555cf478e6dd06fe5907cbd55e9de7fdf448fcc9c",
          }
          assert result["source_artifact_sha256"] == {
              "manifest.sha256": "8074a4224c4a51f38f869944f57fd0c350a0f164b50627a2f9173352e170dc0e",
              **source_hashes,
          }
          expected_manifest = """39aeac89e593584f77d1365c779f2eb2e5317e07729124026158f64c89abd940  git-head.txt
e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  git-status.txt
1673b768313b748bd00339247acdab3db37326b7139a36f3a9cdce0ae5824000  run-config.json
98623f9c37f74137722f6d45ef37536064017a429246d45a3820aaee2c9785e1  seed-0/evaluation-per-episode.jsonl
3c2c2bac4036ccd8bc45c5aca8c28fe3b2e470902489907e224ba602bafaa93f  seed-0/selected-checkpoint.pt
a306fcb06bbd6965553dd8406ffd0aad41259bab45149d39a67c77cab7d143c8  seed-0/summary.json
b74cf27618985dd690c2d50555cf478e6dd06fe5907cbd55e9de7fdf448fcc9c  seed-0/train-steps.jsonl
"""
          assert manifest_path.read_text(encoding="ascii") == expected_manifest
          assert hashlib.sha256(expected_manifest.encode("ascii")).hexdigest() == (
              "8074a4224c4a51f38f869944f57fd0c350a0f164b50627a2f9173352e170dc0e"
          )
          PY

      - name: Prove exact four-file result-only slice
        run: |
          base=2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c
          mapfile -t changed < <(git diff --name-only "$base...HEAD" | sort)
          expected=(
            ".github/workflows/gate9-contextual-failure-decomposition-stage1-seed0-result-v0-ci.yml"
            "experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.json"
            "experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_result_v0.md"
            "experiments/population_compute_scaling_v0/gate9_contextual_failure_decomposition_stage1_seed0_source_manifest_v0.sha256"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Keep execution and later diagnostic stages closed
        run: |
          ! git diff --name-only \
            2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c...HEAD |
            grep -E '\.(pt|bin|safetensors|sqlite3|jsonl|py|ps1)$'
          ! git diff \
            2e1b91d578e7bf9b4c54aa2ee1c120a9ec01b21c...HEAD -- . ':!*.md' |
            grep -E 'optimizer\.step|torch\.load|torch\.save|stage2|stage3|stage4|population_execution|scientific_test_generation'
