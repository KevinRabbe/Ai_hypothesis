name: Population-compute gate qualification

on:
  push:
    branches:
      - 'agent/population-compute-*'
      - 'agent/relay-work-span-*'
      - 'agent/gate2-*'
    paths:
      - 'ai_hypothesis/population_compute/**'
      - 'experiments/population_compute_scaling_v0/**'
      - 'scripts/run_gate1_resource_frontier*.ps1'
      - 'scripts/finalize_gate1_resource_frontier_v1_existing.ps1'
      - 'scripts/run_gate2_development.ps1'
      - 'tests/test_population*.py'
      - 'tests/test_collective_relay.py'
      - 'tests/test_shared_population_cell.py'
      - 'tests/test_relay_*.py'
      - 'tests/test_confirmation_gate_v1.py'
      - 'tests/test_gate2_*.py'
      - 'tests/test_compositional_relay_protocol.py'
      - '.github/workflows/population-compute-gate-ci.yml'
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/**'
      - 'experiments/population_compute_scaling_v0/**'
      - 'scripts/run_gate1_resource_frontier*.ps1'
      - 'scripts/finalize_gate1_resource_frontier_v1_existing.ps1'
      - 'scripts/run_gate2_development.ps1'
      - 'tests/test_population*.py'
      - 'tests/test_collective_relay.py'
      - 'tests/test_shared_population_cell.py'
      - 'tests/test_relay_*.py'
      - 'tests/test_confirmation_gate_v1.py'
      - 'tests/test_gate2_*.py'
      - 'tests/test_compositional_relay_protocol.py'
      - '.github/workflows/population-compute-gate-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Compile population-compute modules
        run: python -m compileall -q ai_hypothesis/population_compute

      - name: Parse target-GPU PowerShell runners
        shell: pwsh
        run: |
          $runnerPaths = @(
              'scripts/run_gate1_resource_frontier.ps1',
              'scripts/run_gate1_resource_frontier_v1.ps1'
          )
          foreach ($path in $runnerPaths) {
              $runnerPath = Resolve-Path $path
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $runnerPath,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Error "$path : $($_.Message)" }
                  exit 1
              }

              $runnerText = Get-Content -Raw $runnerPath
              if ($runnerText -match '&\s+python\s+-c\s+\$verifyCode') {
                  throw "$path must not pass multiline Python through python -c; Windows native quoting corrupts embedded quotes."
              }
              if ($runnerText -notmatch '&\s+python\s+\$verifyScriptPath\s+\$RepoRoot\s+\$CheckpointPath') {
                  throw "$path must execute the temporary Python verifier with the repository root before checkpoint arguments."
              }
              if ($runnerText -notmatch 'sys\.path\.insert\(0, repo_root\)') {
                  throw "$path temporary verifier must restore the repository root on Python sys.path."
              }

              $statusIndex = $runnerText.IndexOf('$gitStatus = @(& git status --porcelain)')
              $outputCreateIndex = $runnerText.IndexOf('New-Item -ItemType Directory -Force -Path $OutputRoot')
              if ($statusIndex -lt 0 -or $outputCreateIndex -lt 0 -or $statusIndex -gt $outputCreateIndex) {
                  throw "$path must check repository cleanliness before creating its output directory."
              }
              if ($runnerText -notmatch '\$gitStatusPath\s*=\s*Join-Path\s+\$OutputRoot\s+"git-status\.txt"') {
                  throw "$path must bind the Git status snapshot path explicitly."
              }
              if ($runnerText -notmatch 'New-Item\s+-ItemType\s+File\s+-Force\s+-Path\s+\$gitStatusPath') {
                  throw "$path must explicitly create git-status.txt when the clean-tree status array is empty."
              }
          }

          $v1Text = Get-Content -Raw 'scripts/run_gate1_resource_frontier_v1.ps1'
          if ($v1Text -notmatch 'run_relay_resource_frontier_v1') {
              throw 'Gate-1 v1 runner must invoke the precision-aware v1 measurement CLI.'
          }
          if ($v1Text -notmatch 'audit_relay_resource_frontier_v1') {
              throw 'Gate-1 v1 runner must invoke the independent v1 auditor.'
          }

          $finalizerPath = Resolve-Path 'scripts/finalize_gate1_resource_frontier_v1_existing.ps1'
          $finalizerTokens = $null
          $finalizerParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $finalizerPath,
              [ref]$finalizerTokens,
              [ref]$finalizerParseErrors
          ) | Out-Null
          if ($finalizerParseErrors.Count -gt 0) {
              $finalizerParseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
          $finalizerText = Get-Content -Raw $finalizerPath
          if ($finalizerText -notmatch 'benchmark_rerun\s*=\s*\$false') {
              throw 'Gate-1 v1 existing-result finalizer must explicitly record that the benchmark was not rerun.'
          }
          if ($finalizerText -notmatch 'timing_rerun\s*=\s*\$false') {
              throw 'Gate-1 v1 existing-result finalizer must explicitly record that timing was not rerun.'
          }
          if ($finalizerText -notmatch 'git diff --quiet \$measurementHead HEAD -- \$scientificSourcePaths') {
              throw 'Gate-1 v1 existing-result finalizer must reject scientific-source drift after the measured head.'
          }
          if ($finalizerText -notmatch '18b201e22ca0a33feb4644c8ed8a09375e8e23ea') {
              throw 'Gate-1 v1 existing-result finalizer must bind the canonical first target-run measurement head.'
          }
          if (-not (Test-Path 'experiments/population_compute_scaling_v0/gate1_v1_target_gpu_result.md')) {
              throw 'Gate-1 v1 target-GPU result record is missing.'
          }

          $gate2RunnerPath = Resolve-Path 'scripts/run_gate2_development.ps1'
          $gate2Tokens = $null
          $gate2ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $gate2RunnerPath,
              [ref]$gate2Tokens,
              [ref]$gate2ParseErrors
          ) | Out-Null
          if ($gate2ParseErrors.Count -gt 0) {
              $gate2ParseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
          $gate2Text = Get-Content -Raw $gate2RunnerPath
          $gate2StatusIndex = $gate2Text.IndexOf('$gitStatus = @(& git status --porcelain)')
          $gate2OutputCreateIndex = $gate2Text.IndexOf('New-Item -ItemType Directory -Force -Path $resolvedOutputRoot')
          if ($gate2StatusIndex -lt 0 -or $gate2OutputCreateIndex -lt 0 -or $gate2StatusIndex -gt $gate2OutputCreateIndex) {
              throw 'Gate-2 development runner must check clean-tree provenance before creating output.'
          }
          if ($gate2Text -notmatch 'run_gate2_development') {
              throw 'Gate-2 development runner must invoke the development-only CLI.'
          }
          if ($gate2Text -notmatch 'DEVELOPMENT_ONLY_NOT_CONFIRMATION') {
              throw 'Gate-2 runner must explicitly label its output as development-only.'
          }
          if ($gate2Text -match 'allow_confirmation|--confirmation') {
              throw 'Gate-2 development runner must not expose a confirmation-opening path.'
          }
          if ($gate2Text -notmatch 'New-Item\s+-ItemType\s+File\s+-Force\s+-Path\s+\$gitStatusPath') {
              throw 'Gate-2 development runner must materialize an empty clean-tree status snapshot.'
          }

          $tempProbe = Join-Path ([System.IO.Path]::GetTempPath()) ('ai-hypothesis-import-probe-' + [Guid]::NewGuid().ToString('N') + '.py')
          try {
              @(
                  'import sys',
                  'repo_root = sys.argv[1]',
                  'if repo_root not in sys.path:',
                  '    sys.path.insert(0, repo_root)',
                  'import ai_hypothesis.population_compute.relay_experiment_v1',
                  'import ai_hypothesis.population_compute.gate2_development',
                  'import ai_hypothesis.population_compute.run_gate2_development'
              ) | Set-Content -Encoding UTF8 $tempProbe
              & python $tempProbe (Resolve-Path '.')
              if ($LASTEXITCODE -ne 0) {
                  throw 'External temporary Python verifier cannot import the repository package after repo-root injection.'
              }
          }
          finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $tempProbe
          }

      - name: Run population-compute contract regressions
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests/test_population_compute_contract.py \
            tests/test_collective_relay.py \
            tests/test_shared_population_cell.py \
            tests/test_relay_population_model.py \
            tests/test_compositional_relay_protocol.py \
            tests/test_population_state_reset_policy.py \
            tests/test_relay_experiment.py \
            tests/test_relay_serial_control.py \
            tests/test_relay_experiment_v1.py \
            tests/test_run_relay_scaling_v1.py \
            tests/test_confirmation_gate_v1.py \
            tests/test_relay_resource_frontier.py \
            tests/test_relay_resource_equivalence_diagnostic.py \
            tests/test_relay_precision_diagnostic.py \
            tests/test_relay_resource_frontier_v1.py \
            tests/test_relay_resource_audit.py \
            tests/test_gate2_persistent_state_capacity.py \
            tests/test_gate2_persistent_model.py \
            tests/test_gate2_development.py \
            > population-compute-tests.log 2>&1
          echo $? > population-compute-tests.status
          exit 0

      - name: Upload qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-compute-qualification-log
          path: |
            population-compute-tests.log
            population-compute-tests.status
          if-no-files-found: error

      - name: Enforce population-compute qualification
        shell: bash
        run: |
          status="$(cat population-compute-tests.status)"
          if [ "$status" -ne 0 ]; then
            echo "Population-compute regression suite failed with exit $status"
            cat population-compute-tests.log
            exit "$status"
          fi
