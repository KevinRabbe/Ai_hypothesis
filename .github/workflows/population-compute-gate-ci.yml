name: Population-compute gate qualification

on:
  push:
    branches:
      - 'agent/population-compute-*'
      - 'agent/relay-work-span-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Compile population-compute modules
        run: python -m compileall -q ai_hypothesis/population_compute

      - name: Parse target-GPU PowerShell runner
        shell: pwsh
        run: |
          $runnerPath = Resolve-Path 'scripts/run_gate1_resource_frontier.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $runnerPath,
              [ref]$tokens,
              [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

          $runnerText = Get-Content -Raw $runnerPath
          if ($runnerText -match '&\s+python\s+-c\s+\$verifyCode') {
              throw 'Gate-1 verifier must not pass multiline Python through python -c; Windows native quoting corrupts embedded quotes.'
          }
          if ($runnerText -notmatch '&\s+python\s+\$verifyScriptPath\s+\$RepoRoot\s+\$CheckpointPath') {
              throw 'Gate-1 verifier must execute the temporary Python verifier with the repository root before checkpoint arguments.'
          }
          if ($runnerText -notmatch 'sys\.path\.insert\(0, repo_root\)') {
              throw 'Gate-1 temporary verifier must restore the repository root on Python sys.path.'
          }

          $statusIndex = $runnerText.IndexOf('$gitStatus = @(& git status --porcelain)')
          $outputCreateIndex = $runnerText.IndexOf('New-Item -ItemType Directory -Force -Path $OutputRoot')
          if ($statusIndex -lt 0 -or $outputCreateIndex -lt 0 -or $statusIndex -gt $outputCreateIndex) {
              throw 'Gate-1 runner must check repository cleanliness before creating its output directory.'
          }

          $tempProbe = Join-Path ([System.IO.Path]::GetTempPath()) ('ai-hypothesis-import-probe-' + [Guid]::NewGuid().ToString('N') + '.py')
          try {
              @(
                  'import sys',
                  'repo_root = sys.argv[1]',
                  'if repo_root not in sys.path:',
                  '    sys.path.insert(0, repo_root)',
                  'import ai_hypothesis.population_compute.relay_experiment_v1'
              ) | Set-Content -Encoding UTF8 $tempProbe
              & python $tempProbe (Resolve-Path '.')
              if ($LASTEXITCODE -ne 0) {
                  throw 'External temporary Python verifier cannot import the repository package after repo-root injection.'
              }
          }
          finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $tempProbe
          }

      - name: Run population-compute contract regressions
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests/test_population_compute_contract.py \
            tests/test_collective_relay.py \
            tests/test_shared_population_cell.py \
            tests/test_relay_population_model.py \
            tests/test_relay_experiment.py \
            tests/test_relay_serial_control.py \
            tests/test_relay_experiment_v1.py \
            tests/test_run_relay_scaling_v1.py \
            tests/test_confirmation_gate_v1.py \
            tests/test_relay_resource_frontier.py \
            tests/test_relay_resource_equivalence_diagnostic.py \
            tests/test_relay_precision_diagnostic.py \
            tests/test_relay_resource_audit.py \
            > population-compute-tests.log 2>&1
          echo $? > population-compute-tests.status
          exit 0

      - name: Upload qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-compute-qualification-log
          path: |
            population-compute-tests.log
            population-compute-tests.status
          if-no-files-found: error

      - name: Enforce population-compute qualification
        shell: bash
        run: |
          status="$(cat population-compute-tests.status)"
          if [ "$status" -ne 0 ]; then
            echo "Population-compute regression suite failed with exit $status"
            cat population-compute-tests.log
            exit "$status"
          fi
