name: Freeze Gate1 decisive checkpoint

on:
  push:
    branches:
      - agent/relay-work-span-frontier-v0

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relay-work-span-frontier-v0
      - name: Freeze seed-1 confirmation checkpoint identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          audit = Path('ai_hypothesis/population_compute/relay_resource_audit.py')
          text = audit.read_text(encoding='utf-8')
          old = '''CANONICAL_LEARNED_PARAMETER_COUNT = 26_669\nCANONICAL_EXPERIMENT_VERSION = "population-compute-relay-training-v1"\n'''
          new = '''CANONICAL_LEARNED_PARAMETER_COUNT = 26_669\nCANONICAL_RESOURCE_TRAINING_SEED = 1\nCANONICAL_RESOURCE_PARAMETER_FINGERPRINT = "c227ade9006e47bec17a2a3d5aedf6ac95a6a94607b96b9f52ab759905536c12"\nCANONICAL_EXPERIMENT_VERSION = "population-compute-relay-training-v1"\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('checkpoint constant target not found')

          old_check = '''        if learned_parameter_count != CANONICAL_LEARNED_PARAMETER_COUNT:\n            reasons.append("learned parameter count is not the canonical relay-v1 count")\n        _expect_equal(\n            reasons,\n            "checkpoint experiment_version",\n'''
          new_check = '''        if learned_parameter_count != CANONICAL_LEARNED_PARAMETER_COUNT:\n            reasons.append("learned parameter count is not the canonical relay-v1 count")\n        _expect_equal(\n            reasons,\n            "checkpoint training_seed",\n            checkpoint.get("training_seed"),\n            CANONICAL_RESOURCE_TRAINING_SEED,\n        )\n        _expect_equal(\n            reasons,\n            "checkpoint parameter_fingerprint",\n            checkpoint.get("parameter_fingerprint"),\n            CANONICAL_RESOURCE_PARAMETER_FINGERPRINT,\n        )\n        _expect_equal(\n            reasons,\n            "checkpoint experiment_version",\n'''
          if old_check in text:
              text = text.replace(old_check, new_check, 1)
          elif new_check not in text:
              raise RuntimeError('checkpoint validation target not found')
          audit.write_text(text, encoding='utf-8')

          protocol = Path('experiments/population_compute_scaling_v0/resource_frontier_protocol_v0.md')
          doc = protocol.read_text(encoding='utf-8')
          old_doc = '''A preserved frozen-confirmation checkpoint is appropriate because Gate 1 measures execution organization, not retraining quality.\n'''
          new_doc = '''The decisive Gate-1 run is frozen to confirmation **training seed 1**, which was selected before target-hardware timing:\n\n```text\ntraining_seed = 1\nparameter_fingerprint = c227ade9006e47bec17a2a3d5aedf6ac95a6a94607b96b9f52ab759905536c12\nsource = frozen confirmation artifact 8642866100 / run 30239005530 / run/seed_1/model-v1.pt\n```\n\nDo not select a different confirmed seed based on observed performance. Other checkpoints may be used only for explicitly labelled mechanics/replication runs.\n'''
          if old_doc in doc:
              doc = doc.replace(old_doc, new_doc, 1)
          elif new_doc not in doc:
              raise RuntimeError('protocol checkpoint paragraph not found')
          protocol.write_text(doc, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_hypothesis/population_compute/relay_resource_audit.py experiments/population_compute_scaling_v0/resource_frontier_protocol_v0.md
          git commit -m "Freeze Gate1 decisive checkpoint identity [skip ci]"
          git push origin HEAD:agent/relay-work-span-frontier-v0
