name: Gate9D router factorization sweep v5 qualification
on:
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate9d_router_factorization_sweep_v5.py'
      - 'scripts/run_gate9d_router_factorization_sweep_v5.py'
      - 'scripts/run_gate9d_router_factorization_sweep_v5.ps1'
      - 'experiments/population_compute_scaling_v0/gate9d_router_factorization_sweep_v5.md'
      - 'tests/test_gate9d_router_factorization_sweep_v5.py'
      - '.github/workflows/gate9d-router-factorization-sweep-v5-ci.yml'
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.9'}
      - run: python -m pip install --disable-pip-version-check torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m py_compile ai_hypothesis/population_compute/gate9d_router_factorization_sweep_v5.py scripts/run_gate9d_router_factorization_sweep_v5.py tests/test_gate9d_router_factorization_sweep_v5.py
          python -m unittest tests/test_gate9d_router_factorization_sweep_v5.py -v
      - run: |
          test "$(git diff --name-only ac7fc7ecaadcf46d4f55db6586984dd719eb5100...HEAD | wc -l)" -eq 6
          ! git diff --name-only ac7fc7ecaadcf46d4f55db6586984dd719eb5100...HEAD | grep -E '\.(pt|pth|bin|zip)$'
