name: Gate9D learned shared router qualification

on:
  pull_request:
    branches:
      - agent/gate9d-sparse-affine-worker-population-v0
    paths:
      - .github/workflows/gate9d-learned-shared-router-v0-ci.yml
      - ai_hypothesis/population_compute/gate9d_learned_shared_router.py
      - scripts/run_gate9d_learned_shared_router.py
      - scripts/run_gate9d_learned_shared_router.ps1
      - experiments/population_compute_scaling_v0/gate9d_learned_shared_router_v0.md
      - tests/gate9d_learned_shared_router_contract.py

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install exact CPU runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and verify contract
        run: |
          python -m py_compile \
            ai_hypothesis/population_compute/gate9d_learned_shared_router.py \
            scripts/run_gate9d_learned_shared_router.py \
            tests/gate9d_learned_shared_router_contract.py
          python tests/gate9d_learned_shared_router_contract.py
      - name: Prove exact six-file slice and closed binaries
        run: |
          base=6ad02bd4f0907bafa6a1d202eb157d701e26cbe8
          test "$(git diff --name-only "$base...HEAD" | wc -l)" -eq 6
          ! git diff --name-only "$base...HEAD" | grep -E '\.(pt|bin|safetensors|jsonl|sqlite3)$'
