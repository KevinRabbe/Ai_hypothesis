name: Repair indexed stack qualification failures

on:
  push:
    branches:
      - agent/indexed-runtime-ci-v0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply qualification fixes at their stack layers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          patch_branch() {
            branch="$1"
            level="$2"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"

            python - "$level" <<'PY'
          from pathlib import Path
          import sys

          level = int(sys.argv[1])

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old in text:
                  file.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if new not in text:
                  raise RuntimeError(f"expected qualification repair target missing in {path}")

          if level >= 50:
              replace_exact(
                  "tests/test_indexed_thread_consolidation.py",
                  'with self.assertRaisesRegex(ValueError, "without durable provenance"):\n            ThreadConsolidationPlanner(self.config).plan(',
                  'with self.assertRaisesRegex(ValueError, "missing durable allocation provenance"):\n            ThreadConsolidationPlanner(self.config).plan(',
              )

          if level >= 51:
              replace_exact(
                  "tests/test_indexed_thread_consolidation_control.py",
                  "self.scheduler = TracingScheduler(routed, ledger=self.ledger)",
                  "self.scheduler = TracingScheduler(self.ledger, routed)",
              )

          if level >= 52:
              replace_exact(
                  "ai_hypothesis/runtime/indexed_integration_partitions.py",
                  "from collections.abc import Mapping, Protocol, Sequence\nfrom dataclasses import dataclass, replace",
                  "from collections.abc import Mapping, Sequence\nfrom dataclasses import dataclass, replace\nfrom typing import Protocol",
              )
          PY

            git add \
              tests/test_indexed_thread_consolidation.py \
              tests/test_indexed_thread_consolidation_control.py \
              ai_hypothesis/runtime/indexed_integration_partitions.py 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "Fix indexed runtime qualification regressions"
              git push origin "HEAD:$branch"
            fi
          }

          patch_branch agent/indexed-thread-consolidation-planning-v0 50
          patch_branch agent/indexed-thread-consolidation-control-v0 51
          patch_branch agent/indexed-partitioned-integration-v0 52
          patch_branch agent/indexed-runtime-ci-v0 53
