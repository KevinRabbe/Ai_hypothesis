name: Fix indexed partition regression

on:
  push:
    branches:
      - agent/indexed-partitioned-integration-v0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/indexed-partitioned-integration-v0
      - name: Patch tracing scheduler construction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_indexed_integration_partitions.py')
          text = path.read_text(encoding='utf-8')
          old = '''self.scheduler = TracingScheduler(\n            self.partition_scheduler,\n            ledger=self.ledger,\n        )'''
          new = '''self.scheduler = TracingScheduler(\n            self.ledger,\n            self.partition_scheduler,\n        )'''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise RuntimeError('partition tracing-scheduler regression target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_indexed_integration_partitions.py
          git commit -m "Fix partition tracing scheduler regression [skip ci]"
          git push origin HEAD:agent/indexed-partitioned-integration-v0
