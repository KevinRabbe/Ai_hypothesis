name: Gate3 v3 generation pressure qualification

on:
  push:
    branches:
      - agent/gate3-v3-generation-pressure-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate3_v3_generation_pressure.py'
      - 'ai_hypothesis/population_compute/analyze_gate3_v3_generation_pressure.py'
      - 'ai_hypothesis/population_compute/run_gate3_v3_generation_pressure.py'
      - 'scripts/run_gate3_v3_generation_pressure.ps1'
      - 'tests/test_gate3_v3_generation_pressure.py'
      - 'tests/test_gate3_v3_generation_pressure_audit.py'
      - 'experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_protocol.md'
      - 'experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_development_result.md'
      - 'experiments/population_compute_scaling_v0/gate3_v2_frontier_development_result.md'
      - '.github/workflows/gate3-v3-generation-pressure-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation-pressure-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Verify Gate3 v2 F0 result is preserved
        shell: bash
        run: |
          grep -q 'V2_F0_NO_BEYOND_L64_EXTENSION' experiments/population_compute_scaling_v0/gate3_v2_frontier_development_result.md
          grep -q 'reached nominal capacity in \*\*0%\*\* of worlds' experiments/population_compute_scaling_v0/gate3_v2_frontier_development_result.md

      - name: Compile Gate3 v3 frozen modules
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate3_v3_generation_pressure.py \
            ai_hypothesis/population_compute/analyze_gate3_v3_generation_pressure.py \
            ai_hypothesis/population_compute/run_gate3_v3_generation_pressure.py

      - name: Run Gate3 v3 regressions
        run: |
          python -m unittest \
            tests/test_gate3_v3_generation_pressure.py \
            tests/test_gate3_v3_generation_pressure_audit.py

      - name: Verify frozen generation-pressure constants
        shell: bash
        run: |
          python - <<'PY'
          from ai_hypothesis.population_compute.gate3_v3_generation_pressure import (
              GATE3_V3_BOOTSTRAP_SAMPLES,
              GATE3_V3_CHECKPOINT_INDICES,
              GATE3_V3_CONDITIONS,
              GATE3_V3_DEPTH,
              GATE3_V3_EVAL_BATCH_SIZE,
              GATE3_V3_EXPECTED_DEPTH7_PREPRUNE,
              GATE3_V3_HINT_RELIABILITY,
              GATE3_V3_L256_FINAL_PRODUCTIVE,
              GATE3_V3_L256_FINAL_SINK,
              GATE3_V3_L64_FINAL_PRODUCTIVE,
              GATE3_V3_L64_FINAL_SINK,
              GATE3_V3_SCHEDULED_SLOTS,
              GATE3_V3_TOTAL_LEARNED_UPDATES,
              GATE3_V3_WORLD_COUNT,
          )
          assert GATE3_V3_CHECKPOINT_INDICES == (0, 1, 2)
          assert GATE3_V3_DEPTH == 8
          assert GATE3_V3_HINT_RELIABILITY == 0.70
          assert GATE3_V3_SCHEDULED_SLOTS == 223
          assert GATE3_V3_TOTAL_LEARNED_UPDATES == 3568
          assert GATE3_V3_WORLD_COUNT == 256
          assert GATE3_V3_EVAL_BATCH_SIZE == 64
          assert GATE3_V3_BOOTSTRAP_SAMPLES == 2000
          assert GATE3_V3_EXPECTED_DEPTH7_PREPRUNE == 128
          assert GATE3_V3_L64_FINAL_PRODUCTIVE == 64
          assert GATE3_V3_L64_FINAL_SINK == 32
          assert GATE3_V3_L256_FINAL_PRODUCTIVE == 96
          assert GATE3_V3_L256_FINAL_SINK == 0
          assert len(GATE3_V3_CONDITIONS) == 5
          assert 3 * len(GATE3_V3_CONDITIONS) == 15
          PY

      - name: Verify admitted CLI exposes no scientific tuning knobs
        shell: bash
        run: |
          python -m ai_hypothesis.population_compute.run_gate3_v3_generation_pressure --help > gate3-v3-help.txt
          grep -q -- '--output-root' gate3-v3-help.txt
          grep -q -- '--checkpoint0' gate3-v3-help.txt
          grep -q -- '--checkpoint1' gate3-v3-help.txt
          grep -q -- '--checkpoint2' gate3-v3-help.txt
          ! grep -q -- '--capacity' gate3-v3-help.txt
          ! grep -q -- '--reliability' gate3-v3-help.txt
          ! grep -q -- '--world-count' gate3-v3-help.txt
          ! grep -q -- '--scheduled-slots' gate3-v3-help.txt
          ! grep -q -- '--depth' gate3-v3-help.txt
          ! grep -q -- '--training' gate3-v3-help.txt

      - name: Verify v3 protocol/result boundary
        shell: bash
        run: |
          grep -q 'Gate-3 v3 confirmation is CLOSED' experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_protocol.md
          ! grep -R --line-number -- '--confirmation' ai_hypothesis/population_compute/run_gate3_v3_generation_pressure.py scripts/run_gate3_v3_generation_pressure.ps1
          if [ -f experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_development_result.md ]; then
            grep -q 'V3_G1_ROBUST_GENERATION_PRESSURE_BENEFIT' experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_development_result.md
            grep -q 'Confirmation opened during this run: \*\*false\*\*' experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_development_result.md
          else
            grep -q 'FROZEN PRE-RESULT PROTOCOL — NO GATE-3 v3 RESULT INSPECTED' experiments/population_compute_scaling_v0/gate3_v3_generation_pressure_protocol.md
          fi

  windows-powershell-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put checkout on admitted Gate3 v3 branch name
        shell: powershell
        run: git switch -C agent/gate3-v3-generation-pressure-v0

      - name: Execute Gate3 v3 pre-science wrapper under Windows PowerShell 5.1 StrictMode
        shell: powershell
        env:
          GATE3_V3_WRAPPER_SMOKE: '1'
        run: |
          .\scripts\run_gate3_v3_generation_pressure.ps1 `
            -IdleMachineAttested `
            -OutputRoot "$env:RUNNER_TEMP\gate3-v3-generation-pressure-smoke"
