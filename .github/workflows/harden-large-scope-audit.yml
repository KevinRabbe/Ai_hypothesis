name: Harden large-scope result audit

on:
  push:
    branches:
      - agent/large-scope-result-audit-v0

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/large-scope-result-audit-v0
      - name: Harden malformed-result and arithmetic checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if new in text:
                  return
              raise RuntimeError(f'patch target missing in {path}: {old[:80]!r}')

          source = Path('ai_hypothesis/large_scope/result_audit.py')
          replace_once(
              source,
              '''        errors=errors,\n    )\n    _audit_scope_equivalence(''',
              '''        errors=errors,\n        tolerance=zero_tolerance,\n    )\n    _audit_scope_equivalence(''',
          )
          replace_once(
              source,
              '''        errors=errors,\n    )\n    if {"same_worker", "diverse_workers"}.issubset(set(modes)):\n        _audit_paired_against_conditions(''',
              '''        errors=errors,\n        tolerance=zero_tolerance,\n    )\n    if {"same_worker", "diverse_workers"}.issubset(set(modes)):\n        _audit_paired_against_conditions(''',
          )
          replace_once(
              source,
              '''    if audit.warnings:\n        lines.extend(("## Warnings", ""))\n        lines.extend(f"- `{issue.code}` — {issue.message}" for issue in audit.warnings)\n        lines.append("")\n\n    conditions = _rows_by_key(payload.get("summaries"), "mode", "width")''',
              '''    if audit.warnings:\n        lines.extend(("## Warnings", ""))\n        lines.extend(f"- `{issue.code}` — {issue.message}" for issue in audit.warnings)\n        lines.append("")\n\n    if not audit.valid:\n        lines.extend(("Result tables are omitted because benchmark-integrity validation failed.", ""))\n        return "\\n".join(lines)\n\n    conditions = _rows_by_key(payload.get("summaries"), "mode", "width")''',
          )
          replace_once(
              source,
              '''    modes: tuple[str, ...],\n    errors: list[ResultAuditIssue],\n) -> dict[tuple[str, int], Mapping[str, Any]]:''',
              '''    modes: tuple[str, ...],\n    errors: list[ResultAuditIssue],\n    tolerance: float,\n) -> dict[tuple[str, int], Mapping[str, Any]]:''',
          )
          replace_once(
              source,
              '''        _audit_finite_fields(\n            row,\n            (\n                "mean_target_rank_when_inspected",''',
              '''        _audit_condition_arithmetic(\n            row,\n            errors=errors,\n            label=f"summary {key!r}",\n            tolerance=tolerance,\n        )\n        _audit_finite_fields(\n            row,\n            (\n                "mean_target_rank_when_inspected",''',
          )
          replace_once(
              source,
              '''    modes: tuple[str, ...],\n    errors: list[ResultAuditIssue],\n) -> dict[int, Mapping[str, Any]]:\n    rows = _mapping_rows(raw, "paired_summaries", errors)''',
              '''    modes: tuple[str, ...],\n    errors: list[ResultAuditIssue],\n    tolerance: float,\n) -> dict[int, Mapping[str, Any]]:\n    rows = _mapping_rows(raw, "paired_summaries", errors)''',
          )
          replace_once(
              source,
              '''        p_value = row.get("exact_retrieval_discordance_p_value")\n        if p_value is not None and _finite_number(p_value) and not 0.0 <= float(p_value) <= 1.0:''',
              '''        _audit_paired_arithmetic(\n            row,\n            errors=errors,\n            label=f"paired width {width}",\n            tolerance=tolerance,\n        )\n        p_value = row.get("exact_retrieval_discordance_p_value")\n        if p_value is not None and _finite_number(p_value) and not 0.0 <= float(p_value) <= 1.0:''',
          )

          helper_marker = '''\ndef _audit_scope_equivalence(\n'''
          helper_block = r'''
def _audit_condition_arithmetic(
    row: Mapping[str, Any],
    *,
    errors: list[ResultAuditIssue],
    label: str,
    tolerance: float,
) -> None:
    positive = _count(row, "positive_world_count", errors, label)
    negative = _count(row, "negative_world_count", errors, label)
    inspected = _count(row, "target_inspected_count", errors, label)
    retrieved = _count(row, "target_retrieved_count", errors, label)
    if None in (positive, negative, inspected, retrieved):
        return
    assert positive is not None and negative is not None
    assert inspected is not None and retrieved is not None
    if inspected > positive:
        errors.append(ResultAuditIssue("CONDITION_COUNT_ARITHMETIC", f"{label} target_inspected_count exceeds positive worlds"))
    if retrieved > inspected:
        errors.append(ResultAuditIssue("CONDITION_COUNT_ARITHMETIC", f"{label} target_retrieved_count exceeds inspected targets"))
    expected = (
        ("target_coverage_rate", _optional_rate(inspected, positive)),
        ("target_retrieval_rate", _optional_rate(retrieved, positive)),
        ("retrieval_given_inspected", _optional_rate(retrieved, inspected)),
    )
    for field, value in expected:
        if not _close_optional(row.get(field), value, tolerance):
            errors.append(ResultAuditIssue("CONDITION_RATE_ARITHMETIC", f"{label} {field} does not match its counts"))


def _audit_paired_arithmetic(
    row: Mapping[str, Any],
    *,
    errors: list[ResultAuditIssue],
    label: str,
    tolerance: float,
) -> None:
    names = (
        "target_inspected_count",
        "same_target_retrieved_count",
        "diverse_target_retrieved_count",
        "both_retrieved_count",
        "same_only_retrieved_count",
        "diverse_only_retrieved_count",
        "neither_retrieved_count",
        "retrieval_discordant_count",
    )
    counts = {name: _count(row, name, errors, label) for name in names}
    if any(value is None for value in counts.values()):
        return
    inspected = counts["target_inspected_count"]
    same_retrieved = counts["same_target_retrieved_count"]
    diverse_retrieved = counts["diverse_target_retrieved_count"]
    both = counts["both_retrieved_count"]
    same_only = counts["same_only_retrieved_count"]
    diverse_only = counts["diverse_only_retrieved_count"]
    neither = counts["neither_retrieved_count"]
    discordant = counts["retrieval_discordant_count"]
    assert None not in (inspected, same_retrieved, diverse_retrieved, both, same_only, diverse_only, neither, discordant)
    assert inspected is not None and same_retrieved is not None and diverse_retrieved is not None
    assert both is not None and same_only is not None and diverse_only is not None and neither is not None and discordant is not None
    if both + same_only + diverse_only + neither != inspected:
        errors.append(ResultAuditIssue("PAIRED_COUNT_ARITHMETIC", f"{label} retrieval contingency does not cover inspected targets"))
    if both + same_only != same_retrieved:
        errors.append(ResultAuditIssue("PAIRED_COUNT_ARITHMETIC", f"{label} same-worker retrieval count disagrees with contingency"))
    if both + diverse_only != diverse_retrieved:
        errors.append(ResultAuditIssue("PAIRED_COUNT_ARITHMETIC", f"{label} diverse-worker retrieval count disagrees with contingency"))
    if same_only + diverse_only != discordant:
        errors.append(ResultAuditIssue("PAIRED_COUNT_ARITHMETIC", f"{label} discordant count disagrees with contingency"))
    same_rate = _optional_rate(same_retrieved, inspected)
    diverse_rate = _optional_rate(diverse_retrieved, inspected)
    if not _close_optional(row.get("retrieval_given_inspected_same"), same_rate, tolerance):
        errors.append(ResultAuditIssue("PAIRED_RATE_ARITHMETIC", f"{label} same-worker retrieval rate does not match counts"))
    if not _close_optional(row.get("retrieval_given_inspected_diverse"), diverse_rate, tolerance):
        errors.append(ResultAuditIssue("PAIRED_RATE_ARITHMETIC", f"{label} diverse-worker retrieval rate does not match counts"))
    expected_delta = (
        diverse_rate - same_rate
        if same_rate is not None and diverse_rate is not None
        else None
    )
    if not _close_optional(row.get("retrieval_given_inspected_delta"), expected_delta, tolerance):
        errors.append(ResultAuditIssue("PAIRED_RATE_ARITHMETIC", f"{label} retrieval delta does not match counts"))
    expected_p = _exact_discordance_probability(same_only, diverse_only)
    if not _close_optional(row.get("exact_retrieval_discordance_p_value"), expected_p, tolerance):
        errors.append(ResultAuditIssue("PAIRED_P_ARITHMETIC", f"{label} exact discordance probability does not match counts"))


def _count(
    row: Mapping[str, Any],
    field: str,
    errors: list[ResultAuditIssue],
    label: str,
) -> int | None:
    value = row.get(field)
    if isinstance(value, bool) or not isinstance(value, int) or value < 0:
        errors.append(ResultAuditIssue("COUNT_FIELD", f"{label} has invalid {field}={value!r}"))
        return None
    return value


def _exact_discordance_probability(same_only: int, diverse_only: int) -> float | None:
    total = same_only + diverse_only
    if total == 0:
        return None
    tail = min(same_only, diverse_only)
    probability = sum(math.comb(total, value) for value in range(tail + 1)) / (2**total)
    return min(1.0, 2.0 * probability)

'''
          text = source.read_text(encoding='utf-8')
          if '_audit_condition_arithmetic(' not in text.split(helper_marker, 1)[1] if helper_marker in text else False:
              pass
          if 'def _audit_condition_arithmetic(' not in text:
              if helper_marker not in text:
                  raise RuntimeError('audit helper insertion marker missing')
              source.write_text(text.replace(helper_marker, '\n' + helper_block + helper_marker, 1), encoding='utf-8')

          tests = Path('tests/test_large_scope_result_audit.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '''    def test_local_window_accounting_must_close_exactly(self) -> None:\n'''
          additions = '''    def test_condition_rates_must_match_counts(self) -> None:\n        payload = valid_payload()\n        payload["summaries"][2]["target_retrieval_rate"] = 1.0\n        audit = audit_large_scope_result(payload)\n        self.assertIn("CONDITION_RATE_ARITHMETIC", {issue.code for issue in audit.errors})\n\n    def test_paired_contingency_and_exact_probability_must_close(self) -> None:\n        payload = valid_payload()\n        payload["paired_summaries"][1]["diverse_only_retrieved_count"] = 0\n        audit = audit_large_scope_result(payload)\n        codes = {issue.code for issue in audit.errors}\n        self.assertIn("PAIRED_COUNT_ARITHMETIC", codes)\n        self.assertIn("PAIRED_P_ARITHMETIC", codes)\n\n    def test_malformed_summary_still_renders_integrity_report(self) -> None:\n        payload = valid_payload()\n        payload["summaries"][0]["width"] = "broken"\n        audit = audit_large_scope_result(payload)\n        self.assertFalse(audit.valid)\n        markdown = render_large_scope_audit_markdown(payload, audit)\n        self.assertIn("**Integrity:** INVALID", markdown)\n        self.assertIn("Result tables are omitted", markdown)\n\n'''
          if additions not in text:
              if anchor not in text:
                  raise RuntimeError('audit regression insertion marker missing')
              tests.write_text(text.replace(anchor, additions + anchor, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_hypothesis/large_scope/result_audit.py tests/test_large_scope_result_audit.py
          git commit -m "Harden large-scope result audit [skip ci]"
          git push origin HEAD:agent/large-scope-result-audit-v0
