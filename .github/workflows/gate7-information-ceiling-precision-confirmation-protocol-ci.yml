name: Gate7 information-ceiling precision confirmation protocol qualification

on:
  push:
    branches:
      - agent/gate7-information-ceiling-precision-confirmation-protocol-v0
  pull_request:
    paths:
      - 'ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_protocol.py'
      - 'tests/test_gate7_information_ceiling_precision_confirmation_protocol.py'
      - 'experiments/population_compute_scaling_v0/gate7_information_ceiling_precision_confirmation_protocol_v0.md'
      - '.github/workflows/gate7-information-ceiling-precision-confirmation-protocol-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile frozen precision protocol
        run: |
          python -m compileall -q \
            ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_protocol.py \
            tests/test_gate7_information_ceiling_precision_confirmation_protocol.py

      - name: Run precision protocol regressions
        run: |
          python -m unittest tests/test_gate7_information_ceiling_precision_confirmation_protocol.py

      - name: Verify exact evidence bindings and matrix
        shell: bash
        run: |
          file=ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_protocol.py
          grep -F '4eb3e50a3ca7898ff81aebebddb7b049ff855df3' "$file"
          grep -F '3640699f1727886c9ad2e954269fad660dc34370' "$file"
          grep -F '161142c1e5552cb9464216c774397def6a4100be' "$file"
          grep -F 'b06959ce9d6c7d83bac953ce17a3c3008ad0f306' "$file"
          grep -F '71a383ced44419f84022738448c460d79a3fb21746f436649e5f14399704f731' "$file"
          grep -F '86a7dbb774119cca9bcd697978081e0872b41e4e61a3f8b08538e0cc89c8397d' "$file"
          grep -F 'GATE7_PRECISION_WORLD_COUNT = 2_048' "$file"
          grep -F 'GATE7_PRECISION_BOOTSTRAP_SAMPLES = 20_000' "$file"
          grep -F 'GATE7_PRECISION_PRIMARY_ATTEMPTS = 128' "$file"
          grep -F 'GATE7_PRECISION_NEAR_CEILING_MARGIN = 0.02' "$file"
          grep -F 'GATE7_PRECISION_LEARNED_PARAMETER_COUNT = 19_649' "$file"

      - name: Verify frozen classifier hierarchy
        shell: bash
        run: |
          file=ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_protocol.py
          grep -F 'G7_PRECISION_INFORMATION_CEILING_DOMINANT' "$file"
          grep -F 'G7_PRECISION_SCORER_REPRESENTATION_GAP' "$file"
          grep -F 'G7_PRECISION_INFORMATION_AND_SCORER_GAP_MIXED' "$file"
          grep -F 'G7_PRECISION_INCONCLUSIVE' "$file"
          grep -F 'world_index_clustered_within_population_across_T0_T1_T2' "$file"
          grep -F 'equal_population_then_equal_checkpoint' "$file"
          grep -F 'population_pooled_and_cellwise_M128_clear_gap' "$file"

      - name: Verify protocol-only boundary
        shell: bash
        run: |
          protocol=ai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_protocol.py
          ! grep --line-number -E '(^|[[:space:]])(import torch|from torch|torch\.|import json|from json|open\(|read_text\(|write_text\(|checkpoint_path|load_verified|generate_gate7|run_gate7|argparse)' "$protocol"
          grep -F '"execution_admitted": False' "$protocol"
          grep -F '"communication_intervention_performed": False' "$protocol"
          grep -F '"prior_worlds_reused": False' "$protocol"

      - name: Prove exact four-file protocol slice
        shell: bash
        run: |
          base=4eb3e50a3ca7898ff81aebebddb7b049ff855df3
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected=$'.github/workflows/gate7-information-ceiling-precision-confirmation-protocol-ci.yml\nai_hypothesis/population_compute/gate7_information_ceiling_precision_confirmation_protocol.py\nexperiments/population_compute_scaling_v0/gate7_information_ceiling_precision_confirmation_protocol_v0.md\ntests/test_gate7_information_ceiling_precision_confirmation_protocol.py'
          test "$changed" = "$expected"
          git diff --exit-code "$base"...HEAD -- \
            ai_hypothesis/population_compute/run_gate7_information_ceiling_decomposition.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_rank.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_statistics.py \
            ai_hypothesis/population_compute/gate7_information_ceiling_decomposition_worlds.py \
            scripts
