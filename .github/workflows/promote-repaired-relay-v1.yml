              experiment,
              '''        if not math.isfinite(self.gradient_clip_norm) or self.gradient_clip_norm <= 0.0:
            raise ValueError("gradient_clip_norm must be finite and positive")''',
              '''        if not math.isfinite(self.gradient_clip_norm) or self.gradient_clip_norm <= 0.0:
            raise ValueError("gradient_clip_norm must be finite and positive")
        if not math.isfinite(self.gate_supervision_weight) or self.gate_supervision_weight < 0.0:
            raise ValueError("gate_supervision_weight must be finite and non-negative")
        if self.communication_mode is not CommunicationMode.SPARSE_SHARED_V1:
            raise ValueError("relay training v1 requires sparse_shared_v1")''',
          )
          replace_once(
              experiment,
              '''                "gradient_clip_norm": self.training_config.gradient_clip_norm,
                "model": asdict(self.training_config.model),''',
              '''                "gradient_clip_norm": self.training_config.gradient_clip_norm,
                "gate_supervision_weight": self.training_config.gate_supervision_weight,
                "communication_mode": self.training_config.communication_mode.value,
                "model": asdict(self.training_config.model),''',
          )
          replace_once(
              experiment,
              '''        output = model(
            batch,
            communication_mode=CommunicationMode.SPARSE_SHARED_V0,
        )
        targets = (batch.target_bits > 0).to(dtype=output.logits.dtype)
        loss = loss_fn(output.logits, targets)''',
              '''        output = model(
            batch,
            communication_mode=config.communication_mode,
        )
        targets = (batch.target_bits > 0).to(dtype=output.logits.dtype)
        relay_loss = loss_fn(output.logits, targets)
        gate_loss = _oracle_gate_supervision_loss(model, batch, worlds)
        loss = relay_loss + config.gate_supervision_weight * gate_loss''',
          )
          replace_once(
              experiment,
              '''        for communication_mode in (
            CommunicationMode.SPARSE_SHARED_V0,
            CommunicationMode.NO_COMMUNICATION,
        ):''',
              '''        for communication_mode in (
            CommunicationMode.SPARSE_SHARED_V1,
            CommunicationMode.NO_COMMUNICATION,
        ):''',
          )
          replace_once(
              experiment,
              '            is CommunicationMode.SPARSE_SHARED_V0',
              '            is CommunicationMode.SPARSE_SHARED_V1',
          )
          replace_once(
              experiment,
              '''            "gradient_clip_norm": training_config.gradient_clip_norm,
            "model": asdict(training_config.model),''',
              '''            "gradient_clip_norm": training_config.gradient_clip_norm,
            "gate_supervision_weight": training_config.gate_supervision_weight,
            "communication_mode": training_config.communication_mode.value,
            "model": asdict(training_config.model),''',
          )

          experiment_path = Path(experiment)
          experiment_text = experiment_path.read_text(encoding="utf-8")
          helper_marker = "\n\ndef split_seed_start(split: str) -> int:\n"
          helper = '''


def _oracle_gate_supervision_loss(
    model: RelayPopulationModel,
    batch,
    worlds: Sequence[RelayWorld],
) -> torch.Tensor:
    """Training-only selector supervision; no oracle information enters inference."""

    active_workers = batch.active_workers
    local = batch.local_inputs[:, :active_workers, :]
    batch_size = int(local.shape[0])
    flat_local = local.reshape(batch_size * active_workers, -1)
    initial = torch.tanh(model.cell.input_projection(flat_local))
    queries, target_slots = _oracle_hop_targets(
        worlds,
        active_workers=active_workers,
        device=local.device,
    )
    losses: list[torch.Tensor] = []

    for hop in range(queries.shape[1]):
        clean_query = torch.tanh(
            model.query_projection(encode_node_bits(queries[:, hop]))
        )
        shared_flat = (
            clean_query.unsqueeze(1)
            .expand(batch_size, active_workers, model.config.message_width)
            .reshape(batch_size * active_workers, model.config.message_width)
        )
        states = model.cell.update(
            torch.cat((flat_local, shared_flat), dim=-1),
            initial,
        )
        gate_logits = model.cell.message_gate(states).reshape(
            batch_size, active_workers
        )
        losses.append(
            torch.nn.functional.cross_entropy(gate_logits, target_slots[:, hop])
        )
    return torch.stack(losses).mean()


def _oracle_hop_targets(
    worlds: Sequence[RelayWorld],
    *,
    active_workers: int,
    device: torch.device,
) -> tuple[torch.Tensor, torch.Tensor]:
    hop_count = worlds[0].difficulty.hop_count
    query_rows: list[list[int]] = []
    slot_rows: list[list[int]] = []
    for world in worlds:
        if world.difficulty.hop_count != hop_count:
            raise ValueError("gate-supervision batch mixed relay depths")
        query = world.start_key
        queries: list[int] = []
        slots: list[int] = []
        for _ in range(hop_count):
            matches = tuple(
                record
                for record in world.records
                if record.is_chain_edge and record.key == query
            )
            if len(matches) != 1:
                raise RuntimeError("expected one chain record per supervised relay hop")
            record = matches[0]
            if record.worker_slot >= active_workers:
                raise RuntimeError("gate-supervision target lies outside active scope")
            queries.append(query)
            slots.append(record.worker_slot)
            query = record.value
        if query != world.answer_key:
            raise RuntimeError("gate-supervision chain does not terminate at answer")
        query_rows.append(queries)
        slot_rows.append(slots)
    return (
        torch.tensor(query_rows, dtype=torch.int64, device=device),
        torch.tensor(slot_rows, dtype=torch.int64, device=device),
    )
'''
          if "def _oracle_gate_supervision_loss(" not in experiment_text:
              if helper_marker not in experiment_text:
                  raise RuntimeError("relay helper insertion marker not found")
              experiment_text = experiment_text.replace(
                  helper_marker,
                  helper + helper_marker,
                  1,
              )
              experiment_path.write_text(experiment_text, encoding="utf-8")

          tests = "tests/test_relay_experiment.py"
          replace_once(
              tests,
              '(difficulty, population, CommunicationMode.SPARSE_SHARED_V0)',
              '(difficulty, population, CommunicationMode.SPARSE_SHARED_V1)',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_hypothesis/population_compute/contract.py \
            ai_hypothesis/population_compute/model.py \
            ai_hypothesis/population_compute/relay_experiment.py \
            tests/test_relay_experiment.py
          git commit -m "Promote repaired relay protocol v1 [skip ci]"
