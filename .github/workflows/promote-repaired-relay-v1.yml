              '            CommunicationMode.NO_COMMUNICATION,\n            CommunicationMode.SPARSE_SHARED_V0,\n        }:',
              '            CommunicationMode.NO_COMMUNICATION,\n            CommunicationMode.SPARSE_SHARED_V0,\n            CommunicationMode.SPARSE_SHARED_V1,\n        }:',
          )
          replace_once(
              model,
              '                "SharedPopulationCell v0 supports only no_communication and "\n                "sparse_shared_v0"',
              '                "SharedPopulationCell supports no_communication, sparse_shared_v0, "\n                "and sparse_shared_v1"',
          )
          replace_once(
              model,
              '''            if communication_mode is CommunicationMode.SPARSE_SHARED_V0:
                gate = torch.sigmoid(self.message_gate(active_states))
                if active_message_content is None:
                    content = torch.tanh(self.message_projection(active_states))
                else:
                    content = active_message_content
                messages = content * gate
                message_sum = messages.new_zeros(
                    batch_size,
                    self.config.message_width,
                ).index_add(0, active_batch_indices, messages)
                shared = torch.tanh(message_sum)
                messages_emitted += active_states_per_batch
                # One bounded field read and one candidate write per active state.
                communicated_scalars += (
                    2 * active_states_per_batch * self.config.message_width
                )
            else:''',
              '''            if communication_mode in {
                CommunicationMode.SPARSE_SHARED_V0,
                CommunicationMode.SPARSE_SHARED_V1,
            }:
                gate_logits = self.message_gate(active_states)
                if communication_mode is CommunicationMode.SPARSE_SHARED_V0:
                    gate = torch.sigmoid(gate_logits)
                else:
                    flat_gate_logits = gate_logits.new_full(
                        (batch_size * worker_count,),
                        float("-inf"),
                    ).index_copy(
                        0,
                        active_flat_indices,
                        gate_logits.squeeze(1),
                    )
                    normalized = torch.softmax(
                        flat_gate_logits.reshape(batch_size, worker_count),
                        dim=1,
                    ).reshape(-1)
                    gate = normalized.index_select(
                        0, active_flat_indices
                    ).unsqueeze(1)
                if active_message_content is None:
                    content = torch.tanh(self.message_projection(active_states))
                else:
                    content = active_message_content
                messages = content * gate
                message_sum = messages.new_zeros(
                    batch_size,
                    self.config.message_width,
                ).index_add(0, active_batch_indices, messages)
                shared = torch.tanh(message_sum)
                messages_emitted += active_states_per_batch
                # One bounded field read and one candidate write per active state.
                communicated_scalars += (
                    2 * active_states_per_batch * self.config.message_width
                )
            else:''',
          )

          experiment = "ai_hypothesis/population_compute/relay_experiment.py"
          replace_once(
              experiment,
              '    decode_node_logits,\n)',
              '    decode_node_logits,\n    encode_node_bits,\n)',
