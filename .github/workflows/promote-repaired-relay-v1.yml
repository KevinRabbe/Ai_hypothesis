    model: RelayPopulationConfig = RelayPopulationConfig()''',
              '''    gradient_clip_norm: float = 1.0
    gate_supervision_weight: float = 1.0
    communication_mode: CommunicationMode = CommunicationMode.SPARSE_SHARED_V1
    model: RelayPopulationConfig = RelayPopulationConfig()''',
