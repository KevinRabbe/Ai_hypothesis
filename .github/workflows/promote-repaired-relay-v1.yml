          replace_once(
              experiment,
              'RELAY_EXPERIMENT_VERSION = "population-compute-relay-training-v0"',
              'RELAY_EXPERIMENT_VERSION = "population-compute-relay-training-v1"',
          )
          replace_once(
              experiment,
